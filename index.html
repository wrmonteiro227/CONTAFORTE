<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultron - Visualizador de IA</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: sans-serif;
        }
        canvas { display: block; }

        #app-header {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 60px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: rgba(5, 2, 12, 0.6);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: text-shadow 0.2s, border-color 0.2s;
        }

        #mic-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            width: 60px; height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        #mic-btn:active { transform: translateX(-50%) scale(0.9); }

        #waveform {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
        }
        .bar {
            width: 4px;
            background-color: #ff0000;
            border-radius: 2px;
            animation: soundWave 0s infinite ease-in-out alternate;
        }
        .bar:nth-child(1) { height: 12px; animation-duration: 0.4s; }
        .bar:nth-child(2) { height: 28px; animation-duration: 0.25s; }
        .bar:nth-child(3) { height: 45px; animation-duration: 0.35s; }
        .bar:nth-child(4) { height: 22px; animation-duration: 0.2s; }
        .bar:nth-child(5) { height: 15px; animation-duration: 0.45s; }

        @keyframes soundWave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }

        #menu-btn {
            position: absolute;
            top: 10px; left: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 40px; height: 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 22px;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }
        #menu-btn:hover { background: rgba(255, 255, 255, 0.15); }

        #side-menu {
            position: absolute;
            top: 0; left: -320px;
            width: 300px; height: 100vh;
            background: rgba(10, 5, 20, 0.95);
            backdrop-filter: blur(15px);
            border-right: 2px solid rgba(138, 43, 226, 0.3);
            z-index: 20;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #side-menu.open { left: 0; }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .menu-header h2 { margin: 0; font-size: 20px; }
        #close-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }
        #close-btn:hover { color: white; }

        #main-nav { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover { background: rgba(138, 43, 226, 0.3); }

        #tasks-panel { display: none; }
        #back-nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #back-nav-btn:hover { background: rgba(255,255,255,0.2); }

        #task-list {
            list-style: none;
            padding: 0; margin: 0;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        #task-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #8a2be2;
            font-size: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #pesquisas-panel { display: none; }
        .panel-back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .panel-back-btn:hover { background: rgba(255,255,255,0.2); }

        #pesquisa-list {
            list-style: none;
            padding: 0; margin: 0;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        #pesquisa-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #00d4ff;
            font-size: 14px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
            cursor: pointer;
        }
        #pesquisa-list .q { font-weight: bold; color: #ffffff; }
        #pesquisa-list .meta { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 4px; }
        #pesquisa-list .sub {
            display: block;
            color: #7fd4ff;
            font-size: 12px;
            margin-top: 6px;
            text-decoration: underline;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header id="app-header">Ultron</header>
    <button id="menu-btn" aria-label="Abrir Menu">☰</button>

    <div id="side-menu">
        <div class="menu-header">
            <h2>Menu</h2>
            <button id="close-btn" aria-label="Fechar Menu">✖</button>
        </div>

        <ul id="main-nav">
            <li class="nav-item" id="nav-tarefas-btn">📝 Tarefas Diárias</li>
            <li class="nav-item" id="nav-pesquisas-btn">🌐 Buscas Recentes</li>
        </ul>

        <div id="tasks-panel">
            <button id="back-nav-btn">⬅ Voltar</button>
            <ul id="task-list"></ul>
        </div>

        <div id="pesquisas-panel">
            <button class="panel-back-btn" id="back-pesquisas-btn">⬅ Voltar</button>
            <ul id="pesquisa-list"></ul>
        </div>
    </div>

    <div id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <button id="mic-btn" aria-label="Ativar IA">🎤</button>

    <script>
        // ============================================================
        // 📚 EDITE AQUI SUA BASE DE CONHECIMENTO LOCAL
        // Adicione linhas no formato:
        //   { chave: ["palavra ou frase", "outra variação"], resposta: "o que o Ultron vai falar" }
        // Ele responde ANTES de ir na internet sempre que você usar
        // uma das palavras-chave (comparação ignora acentos).
        // ============================================================
        const BASE_CONHECIMENTO = [
            { chave: ["senha do wifi", "senha wifi", "wifi"],  resposta: "A senha do wifi é: EDITE_AQUI." },
            { chave: ["meu email", "meu e-mail", "meu mail"],  resposta: "Seu e-mail é: EDITE_AQUI." },
            { chave: ["meu endereco", "onde eu moro", "endereço"], resposta: "Seu endereço é: EDITE_AQUI." },
            { chave: ["meu numero", "meu telefone", "telefone"], resposta: "Seu número é: EDITE_AQUI." }
        ];
        // ============================================================

        // ==========================================
        // UI DO MENU E PAINÉIS
        // ==========================================
        const menuBtn = document.getElementById('menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const closeBtn = document.getElementById('close-btn');
        const mainNav = document.getElementById('main-nav');
        const tasksPanel = document.getElementById('tasks-panel');
        const navTarefasBtn = document.getElementById('nav-tarefas-btn');
        const backNavBtn = document.getElementById('back-nav-btn');
        const taskListEl = document.getElementById('task-list');
        const micBtn = document.getElementById('mic-btn');
        const appHeader = document.getElementById('app-header');
        const waveform = document.getElementById('waveform');

        const navPesquisasBtn = document.getElementById('nav-pesquisas-btn');
        const backPesquisasBtn = document.getElementById('back-pesquisas-btn');
        const pesquisasPanel = document.getElementById('pesquisas-panel');
        const pesquisaListEl = document.getElementById('pesquisa-list');

        let tarefas = JSON.parse(localStorage.getItem('utron.tasks.v1')) || [];
        let pesquisas = JSON.parse(localStorage.getItem('utron.pesquisas.v1')) || [];
        let fatos = JSON.parse(localStorage.getItem('utron.fatos.v1')) || [];

        function openSideMenu() {
            sideMenu.classList.add('open');
            mainNav.style.display = 'block';
            tasksPanel.style.display = 'none';
            pesquisasPanel.style.display = 'none';
        }
        function openTasksPanel() {
            mainNav.style.display = 'none';
            tasksPanel.style.display = 'block';
            pesquisasPanel.style.display = 'none';
        }
        function openPesquisasPanel() {
            mainNav.style.display = 'none';
            tasksPanel.style.display = 'none';
            pesquisasPanel.style.display = 'block';
        }

        menuBtn.addEventListener('click', openSideMenu);
        closeBtn.addEventListener('click', () => sideMenu.classList.remove('open'));
        navTarefasBtn.addEventListener('click', openTasksPanel);
        backNavBtn.addEventListener('click', () => { tasksPanel.style.display = 'none'; mainNav.style.display = 'block'; });
        navPesquisasBtn.addEventListener('click', openPesquisasPanel);
        backPesquisasBtn.addEventListener('click', () => { pesquisasPanel.style.display = 'none'; mainNav.style.display = 'block'; });

        function atualizarListaTarefas() {
            taskListEl.innerHTML = '';
            if (tarefas.length === 0) {
                taskListEl.innerHTML = '<li style="border-left-color: gray; color: gray;">Nenhum compromisso registrado para hoje.</li>';
            } else {
                tarefas.forEach((tarefa) => {
                    let li = document.createElement('li');
                    li.textContent = tarefa;
                    taskListEl.appendChild(li);
                });
            }
            localStorage.setItem('utron.tasks.v1', JSON.stringify(tarefas));
        }
        atualizarListaTarefas();

        function atualizarListaPesquisas() {
            pesquisaListEl.innerHTML = '';
            if (pesquisas.length === 0) {
                pesquisaListEl.innerHTML = '<li style="border-left-color: gray; color: gray; cursor: default;">Nenhuma busca registrada ainda. Diga "pesquisa sobre tal coisa".</li>';
                return;
            }
            pesquisas.forEach((p) => {
                let li = document.createElement('li');
                let q = document.createElement('span');
                q.className = 'q';
                q.textContent = p.pergunta;
                let meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = (p.fonte || '') + (p.data ? ' • ' + p.data : '');
                li.appendChild(q);
                li.appendChild(meta);
                if (p.lista && p.lista.length) {
                    p.lista.slice(0, 3).forEach((l) => {
                        let sub = document.createElement('span');
                        sub.className = 'sub';
                        sub.textContent = '↳ ' + l.titulo;
                        sub.addEventListener('click', (ev) => { ev.stopPropagation(); window.open(l.url, '_blank'); });
                        li.appendChild(sub);
                    });
                }
                li.addEventListener('click', () => { if (p.url) window.open(p.url, '_blank'); });
                pesquisaListEl.appendChild(li);
            });
        }
        atualizarListaPesquisas();

        function salvarPesquisa(p) {
            pesquisas.unshift({
                pergunta: p.pergunta,
                fonte: p.fonte,
                titulo: p.titulo,
                url: p.url,
                lista: p.lista || [],
                data: new Date().toLocaleString('pt-BR')
            });
            pesquisas = pesquisas.slice(0, 8);
            localStorage.setItem('utron.pesquisas.v1', JSON.stringify(pesquisas));
            atualizarListaPesquisas();
        }

        // ==========================================
        // ESTADO GLOBAL
        // ==========================================
        let audioContext;
        let analyser;
        let dataArray;
        let currentVolume = 0;
        let smoothedVolume = 0;

        let recognition = null;
        let isUltronSpeaking = false;
        let currentUtterance = null;
        let currentUtteranceText = '';
        let isListening = false;
        let isSearching = false;
        let searchToken = 0;

        let nomeUsuario = localStorage.getItem('utron.name') || "senhor";
        let isGenioActive = localStorage.getItem('utron.mode') === 'genio';
        let isFaceActive = localStorage.getItem('utron.face') === 'on';

        // MEMÓRIA DE CONVERSA (contexto: o que foi dito antes)
        let memoria = { ultimoTopico: '', ultimoResumo: '', ultimoComando: '', ultimoTs: 0 };

        const corBaseNormal = new THREE.Color(0x8a2be2);
        const corAtivaNormal = new THREE.Color(0xff0000);
        const corBaseGenio = new THREE.Color(0x004d00);
        const corAtivaGenio = new THREE.Color(0x33ff33);

        const corBaseAlvo = new THREE.Color(isGenioActive ? 0x004d00 : 0x8a2be2);
        const corAtivaAlvo = new THREE.Color(isGenioActive ? 0x33ff33 : 0xff0000);
        const corBaseAtual = new THREE.Color(isGenioActive ? 0x004d00 : 0x8a2be2);
        const corAtivaAtual = new THREE.Color(isGenioActive ? 0x33ff33 : 0xff0000);

        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        function registrarComando(transcript) {
            memoria.ultimoComando = transcript;
            memoria.ultimoTs = Date.now();
        }

        // ==========================================
        // FALA + BARGE-IN (ele te interrompe? não: você interrompe ELE)
        // O microfone NUNCA é desligado durante a fala — se você falar,
        // ele corta a si próprio e te escuta (com filtro anti-auto-escuta).
        // ==========================================
        function responderComoUltron(fraseDaVez, onEndCallback = null) {
            if (isUltronSpeaking) return;

            isUltronSpeaking = true;
            currentUtteranceText = fraseDaVez.toLowerCase();

            waveform.style.opacity = '1';
            window.speechSynthesis.cancel();

            currentUtterance = new SpeechSynthesisUtterance(fraseDaVez);
            currentUtterance.lang = 'pt-BR';
            currentUtterance.pitch = 0.2;
            currentUtterance.rate = 0.85;
            currentUtterance.volume = 1.0;

            const vozes = window.speechSynthesis.getVoices();
            const vozMasculinaOuPremium = vozes.find(voz =>
                (voz.lang.includes('pt-BR') || voz.lang.includes('pt-PT')) &&
                (voz.name.includes('Premium') || voz.name.includes('Daniel') || voz.name.includes('Thiago') || voz.name.includes('Google'))
            ) || vozes.find(voz => voz.lang.includes('pt'));

            if (vozMasculinaOuPremium) {
                currentUtterance.voice = vozMasculinaOuPremium;
            }

            const finalizarFala = () => {
                if (currentUtterance && currentUtterance.onend !== finalizarFala) {
                    // fala cancelada por barge-in: o controle já mudou de mão
                    if (isUltronSpeaking) {
                        isUltronSpeaking = false;
                        currentUtteranceText = '';
                        waveform.style.opacity = '0';
                        if (typeof onEndCallback === 'function') onEndCallback();
                    }
                    return;
                }
                isUltronSpeaking = false;
                currentUtteranceText = '';
                waveform.style.opacity = '0';
                if (typeof onEndCallback === 'function') onEndCallback();
            };

            currentUtterance.onend = finalizarFala;
            currentUtterance.onerror = (ev) => {
                // 'interrupted'/'canceled' virá do barge-in; trata como fim normal
                finalizarFala();
            };

            window.speechSynthesis.speak(currentUtterance);
        }

        function interromperFala() {
            if (!isUltronSpeaking) return;
            searchToken++; // aborta qualquer fluxo de busca em andamento
            isSearching = false;
            isUltronSpeaking = false;
            currentUtteranceText = '';
            waveform.style.opacity = '0';
            try { window.speechSynthesis.cancel(); } catch(e) {}
        }

        function parecerAutoEscuta(transcript) {
            if (!currentUtteranceText) return false;
            const palavrasNovas = transcript.split(/\s+/).filter(w => w.length > 3);
            if (palavrasNovas.length === 0) return false;
            const palavrasUltron = new Set(currentUtteranceText.split(/\s+/).filter(w => w.length > 3));
            const emComum = palavrasNovas.filter(w => palavrasUltron.has(w));
            return emComum.length / palavrasNovas.length > 0.5;
        }

        function falar(frase) {
            return new Promise((resolve) => {
                if (isUltronSpeaking) { resolve(); return; }
                responderComoUltron(frase, () => resolve());
            });
        }

        // ==========================================
        // MÓDULO DE INTERNET (fontes abertas, sem chave)
        // ==========================================
        async function httpGetJSON(url, timeoutMs = 6000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function buscarWikipedia(consulta) {
            const q = encodeURIComponent(consulta);
            const busca = await httpGetJSON(
                `https://pt.wikipedia.org/w/api.php?action=query&list=search&srsearch=${q}&srlimit=5&format=json&origin=*`
            );
            const resultados = (busca.query && busca.query.search) || [];
            if (!resultados.length) return null;
            const primeiro = resultados[0];

            let extResumo = '';
            try {
                const ext = await httpGetJSON(
                    `https://pt.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(primeiro.title)}&format=json&origin=*`
                );
                const paginas = (ext.query && ext.query.pages) ? Object.values(ext.query.pages) : [];
                extResumo = (paginas[0] && paginas[0].extract) || '';
            } catch (e) {}

            const resumo = (extResumo || primeiro.snippet || '').replace(/<[^>]*>/g, '');
            return {
                fonte: 'Wikipédia',
                titulo: primeiro.title,
                resumo: resumo,
                url: `https://pt.wikipedia.org/wiki/${encodeURIComponent(primeiro.title.replace(/ /g, '_'))}`,
                lista: resultados.slice(0, 5).map(r => ({
                    titulo: r.title,
                    url: `https://pt.wikipedia.org/wiki/${encodeURIComponent(r.title.replace(/ /g, '_'))}`
                }))
            };
        }

        async function buscarDuckDuckGo(consulta) {
            const q = encodeURIComponent(consulta);
            const d = await httpGetJSON(
                `https://api.duckduckgo.com/?q=${q}&format=json&no_html=1&skip_disambig=1&kl=br-pt`
            );
            let resumo = d.AbstractText || d.Answer || d.Definition || '';
            if (!resumo && d.RelatedTopics && d.RelatedTopics.length) {
                const t = d.RelatedTopics.find(x => x && x.Text);
                if (t) resumo = t.Text;
            }
            if (!resumo) return null;
            return {
                fonte: 'DuckDuckGo',
                titulo: d.Heading || consulta,
                resumo: resumo,
                url: d.AbstractURL || `https://duckduckgo.com/?q=${q}`,
                lista: []
            };
        }

        function climaDescricao(codigo) {
            const mapa = {
                0: 'céu limpo', 1: 'predominantemente limpo', 2: 'parcialmente nublado', 3: 'nublado',
                45: 'nevoeiro', 48: 'nevoeiro com geada',
                51: 'garoa fraca', 53: 'garoa', 55: 'garoa intensa',
                56: 'garoa congelante', 57: 'garoa congelante intensa',
                61: 'chuva fraca', 63: 'chuva moderada', 65: 'chuva forte',
                66: 'chuva congelante fraca', 67: 'chuva congelante forte',
                71: 'neve fraca', 73: 'neve moderada', 75: 'neve forte', 77: 'grãos de neve',
                80: 'pancadas de chuva fracas', 81: 'pancadas de chuva moderadas', 82: 'pancadas de chuva violentas',
                85: 'pancadas de neve fracas', 86: 'pancadas de neve fortes',
                95: 'trovoada', 96: 'trovoada com granizo fraco', 99: 'trovoada com granizo forte'
            };
            return mapa[codigo] || 'condições não informadas';
        }

        async function buscarClima(cidade) {
            let lugar = null;
            const geo = await httpGetJSON(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt&format=json`
            );
            if (geo.results && geo.results.length) {
                lugar = geo.results[0];
            } else if (cidade.includes(' ')) {
                const geo2 = await httpGetJSON(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade.split(' ')[0])}&count=1&language=pt&format=json`
                );
                if (geo2.results && geo2.results.length) lugar = geo2.results[0];
            }
            if (!lugar) throw new Error('cidade não encontrada');

            const f = await httpGetJSON(
                `https://api.open-meteo.com/v1/forecast?latitude=${lugar.latitude}&longitude=${lugar.longitude}` +
                `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code` +
                `&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`
            );
            const c = f.current;
            const d = f.daily;
            const resumo = `Agora: ${climaDescricao(c.weather_code)}, ${Math.round(c.temperature_2)} graus, sensação de ${Math.round(c.apparent_temperature)} graus, umidade de ${Math.round(c.relative_humidity_2m)} por cento. Hoje a máxima é de ${Math.round(d.temperature_2m_max[0])} e a mínima de ${Math.round(d.temperature_2m_min[0])} graus.`;
            return {

        function extrairCidade(transcript) {
            if (!/\b(clima|tempo|previs[ãa]o|chove|chover|chovendo|chuva)\b/i.test(transcript)) return null;
            const m = transcript.match(/\b(?:em|no|na|de|do|da)\s+([a-zà-ö]+(?:\s+[a-zà-ö]+)?)(?:\s+(?:hoje|amanh[ãa]|semana|pra semana|nesta semana))?\s*[.!?]*\s*$/i);
            return m ? m[1].trim() : null;
        }

        function prepararParaFala(texto, max) {
            texto = texto.replace(/\s+/g, ' ').trim();
            if (texto.length <= max) return texto;
            let corte = texto.slice(0, max);
            const ponto = corte.lastIndexOf('.');
            if (ponto > max * 0.5) corte = corte.slice(0, ponto);
            return corte + '...';
        }

        // Busca SÓ com gatilho explícito ("pesquisa", "busca", "acha", "procura"...)
        const TRIGGERS_BUSCA = /pesquis|busc|achar?\b|procur|na internet|na web|no google|me informa|informa sobre|me fala sobre|me diz sobre/i;

        function temGatilhoBusca(transcript) {
            return TRIGGERS_BUSCA.test(transcript);
        }

        function limparConsulta(transcript) {
            let q = transcript
                .replace(/^(ultron|ei|eai)\s*,?\s*/i, '')
                .replace(/^(por favor|pra mim)\s*/i, '')
                .replace(/^(me\s+)?(pesquise|pesquisar|pesquisa|busque|buscar|busca|acha|achar|procura|procure|procurar)\s+(na\s+internet|na\s+web|no\s+google|na\s+wikip[ée]dia|lá|la)\s*/i, '')
                .replace(/^(me\s+)?(pesquise|pesquisar|pesquisa|busque|buscar|busca|acha|achar|procura|procure|procurar)\s*/i, '')
                .replace(/^(sobre|de|me fala|me diz|qual é|quem é|o que é)\s+/i, '')
                .trim();
            return q.length >= 3 ? q : transcript;
        }

        async function processarPesquisa(consulta, prefixoResposta = '') {
            if (isSearching) return;
            isSearching = true;
            const token = ++searchToken;
            await falar(`Consultando a rede, ${nomeUsuario}.`);

            let mensagemFinal;
            try {
                let resultado = null;
                const cidade = extrairCidade(consulta);
                if (cidade) {
                    try { resultado = await buscarClima(cidade); } catch (e) { resultado = null; }
                    if (token !== searchToken) return;
                }
                if (!resultado) {

                    if (token !== searchToken) return;
                }
                if (!resultado) {
                    try { resultado = await buscarDuckDuckGo(consulta); } catch (e) { resultado = null; }
                    if (token !== searchToken) return;
                }

                if (resultado) {
                    const tamanho = isGenioActive ? 700 : 400;
                    memoria.ultimoTopico = consulta;
                    memoria.ultimoResumo = prepararParaFala(resultado.resumo, 400);
                    salvarPesquisa({ pergunta: consulta, fonte: resultado.fonte, titulo: resultado.titulo, url: resultado.url, lista: resultado.lista });
                    const inicio = prefixoResposta ? prefixoResposta + ' ' : 'Encontrei, ' + nomeUsuario + '. ';
                    mensagemFinal = `${inicio}${resultado.fonte}: ${resultado.titulo}. ${prepararParaFala(resultado.resumo, tamanho)}`;
                } else {
                    mensagemFinal = `Procurei em toda a rede, ${nomeUsuario}, mas não encontrei nada sobre isso. Pode tentar com outras palavras?`;
                }
            } catch (e) {
                console.warn('Falha na busca:', e);
                mensagemFinal = `Houve falha na conexão com a rede, ${nomeUsuario}. Verifique sua internet, por favor.`;
            }

            if (token !== searchToken) return;
            isSearching = false;
            await falar(mensagemFinal);
        }

        // ==========================================
        // 📚 BASE DE CONHECIMENTO LOCAL + FATOS POR VOZ
        // ==========================================
        function normalizar(s) {
            return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function consultarBase(transcript) {
            const t = normalizar(transcript);
            for (const item of BASE_CONHECIMENTO) {
                for (const chave of item.chave) {
                    if (t.includes(normalizar(chave))) return item.resposta;
                }
            }
            return null;
        }

        const PALAVRAS_PARA = new Set([
            'que','meu','minha','meus','minhas','o','a','os','as','de','da','do','das','dos','em','no','na','nos','nas',
            'é','e','com','para','pra','tem','ter','está','esta','este','foi','se','um','uma','ao','pela','pelo','mas',
            'mais','quando','onde','qual','quais','me','eu','voc','você','voce','ja','ainda','tambem','so','sobre','depois','antes'
        ]);

        function palavrasSignificativas(s) {
            return normalizar(s).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !PALAVRAS_PARA.has(w));
        }

        function consultarFatos(transcript) {
            const pt = palavrasSignificativas(transcript);
            if (pt.length < 2) return null;
            for (const f of fatos) {
                const fw = new Set(palavrasSignificativas(f.frase));
                const comuns = pt.filter(w => fw.has(w));
                if (comuns.length >= 2) return f.frase;
            }
            return null;
        }

        // ==========================================
        // ⏰ TIMERS RELATIVOS + ALARMES DE HORA ESPECÍFICA
        // ==========================================
        let timerId = null;
        let timerEndsAt = 0;
        let timerLabel = '';

        function formatarTempo(seg) {
            seg = Math.max(0, Math.ceil(seg));
            const h = Math.floor(seg / 3600);
            const m = Math.floor((seg % 3600) / 60);
            const s = seg % 60;
            const mm = String(m).padStart(2, '0');
            const ss = String(s).padStart(2, '0');
            return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
        }

        function atualizarHeaderTimer() {
            const restante = (timerEndsAt - Date.now()) / 1000;
            if (restante <= 0) {
                clearInterval(timerId);
                timerId = null;
                timerEndsAt = 0;
                appHeader.textContent = 'Ultron';
                tocarAlarme();
                if ('Notification' in window && Notification.permission === 'granted') {
                    try { new Notification('Ultron', { body: `${timerLabel} concluído, ${nomeUsuario}.` }); } catch(e) {}
                }
                responderComoUltron(`Tempo esgotado, ${nomeUsuario}. ${timerLabel} terminou.`);
                return;
            }
            appHeader.textContent = `Ultron ⏰ ${formatarTempo(restante)}`;
        }

        function tocarAlarme() {
            try {
                const ctxA = audioContext || new (window.AudioContext || window.webkitAudioContext)();
                [0, 0.35, 0.7].forEach((d, i) => {
                    const o = ctxA.createOscillator();
                    const g = ctxA.createGain();
                    o.type = 'sine';
                    o.frequency.value = i === 2 ? 1318.5 : 880;
                    g.gain.setValueAtTime(0.0001, ctxA.currentTime + d);
                    g.gain.exponentialRampToValueAtTime(0.3, ctxA.currentTime + d + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, ctxA.currentTime + d + 0.3);
                    o.connect(g); g.connect(ctxA.destination);
                    o.start(ctxA.currentTime + d);
                    o.stop(ctxA.currentTime + d + 0.35);
                });
            } catch(e) {}
        }

        function extrairAlarme(transcript) {
            // "me acorda às 7" / "alarme das 7 da manhã" / "me avise às 14:30"
            if (!/(?:acorda|acorde|avise|alarme|toque|lembre)/i.test(transcript)) return null;
            if (/meia[- ]noite/i.test(transcript)) {
                const alvo = montarHoraAlvo(0, 0);
                if (alvo) return alvo;
            }
            if (/meio dia/i.test(transcript)) {
                const alvo = montarHoraAlvo(12, 0);
                if (alvo) return alvo;
            }
            const m = transcript.match(/(\d{1,2})(?::(\d{2}))?\s*(?:horas?|h)?\s*(da\s+(manh[ãa]|tarde|noite|madrugada))?/i);
            if (!m) return null;
            const idxNum = transcript.indexOf(m[0]);
            const depois = transcript.slice(idxNum + m[0].length);
            if (/^minutos?/i.test(depois)) return null; // é timer relativo, não alarme
            let hora = parseInt(m[1], 10);
            const min = m[2] ? parseInt(m[2], 10) : 0;
            const periodo = m[3];
            if (hora < 1 || hora > 23 || min > 59) return null;
            if (periodo) {
                if (periodo === 'tarde' && hora < 12) hora += 12;
                if (periodo === 'noite' && hora < 19) hora += 12;
                if (periodo === 'madrugada' && hora > 5) hora -= 12;
            }
            return montarHoraAlvo(hora, min);
        }

        function montarHoraAlvo(hora, min) {
            const agora = new Date();
            const alvo = new Date(agoro);
            alvo.setHours(hora, min, 0, 0);
            if (alvo <= agora) alvo.setDate(alvo.getDate() + 1);
            return {
                timestamp: alvo.getTime(),
                label: `o alarme das ${String(hora).padStart(2, '0')}:${String(min).padStart(2, '0')}`
            };
        }

        function extrairTimer(transcript) {
            if (!/(?:me avise|me lembre|lembre|avise|timer|cron[oó]metro|alarme|defina|definir|ative|crie|deixe um)/i.test(transcript)) return null;
            if (/\bmeia hora\b/i.test(transcript)) return { totalSeg: 30 * 60, minutos: 30 };
            const t2 = transcript
                .replace(/\bzero\b/g, '0').replace(/\bum\b/g, '1').replace(/\bdois\b/g, '2').replace(/\btr[eê]s\b/g, '3')
                .replace(/\bquatro\b/g, '4').replace(/\bcinco\b/g, '5').replace(/\bseis\b/g, '6').replace(/\bsete\b/g, '7')
                .replace(/\boito\b/g, '8').replace(/\bnove\b/g, '9').replace(/\bdez\b/g, '10').replace(/\bquinze\b/g, '15')
                .replace(/\btrinta\b/g, '30').replace(/\bcinq[ûu]enta\b/g, '50').replace(/\bsessenta\b/g, '60')
                .replace(/\bnoventa\b/g, '90').replace(/\bcem\b/g, '100');
            const numMatch = t2.match(/(\d+)\s*(?:minutos?|horas?)/);
            if (!numMatch) return null;
            let minutos = parseInt(numMatch[1], 10);
            if (/hora/i.test(numMatch[0])) minutos *= 60;
            const totalSeg = minutos * 60;
            if (totalSeg < 60 || totalSeg > 12 * 3600) return null;
            return { totalSeg, minutos };
        }

        function ativarTimer(endTs, label) {
            if (timerId) clearInterval(timerId);
            timerEndsAt = endTs;
            timerLabel = label;
            timerId = setInterval(atualizarHeaderTimer, 250);
            if ('Notification' in window && Notification.permission === 'default') {
                try { Notification.requestPermission(); } catch(e) {}
            }
        }

        function cancelarTimer() {
            if (!timerId) return false;
            clearInterval(timerId);
            timerId = null;
            timerEndsAt = 0;
            timerLabel = '';
            appHeader.textContent = 'Ultron';
            return true;

        // ==========================================
        // 🧠 CONTEXTO: seguir a conversa e orientar soluções
        // ==========================================
        function detectarContexto(transcript) {
            if (!memoria.ultimoTopico || (Date.now() - memoria.ultimoTs > 10 * 60 * 1000)) return null;
            const problema = /(nao funciona|nao esta funcionando|nao esta funcio|errou|deu errado|quebrou|travou|falhou|nao entendi|nada a ver|esta errado|nao gostei|errado|nao resolveu)/i.test(transcript);
            const questao = /^(e |ent[ãa]o |ai |a[íi] |da[íi] |dai |como |o que |qual |quais |por que |porque |quando |onde |quanto |e como |e qual |isso |daquilo |e ai)/i.test(transcript) && transcript.split(/\s+/).length <= 10;
            if (!problema && !questao) return null;
            if (problema) {
                return {
                    tipo: 'problema',
                    consulta: memoria.ultimoTopico + ' solucao problemas como resolver',
                    prefixo: `Sobre ${memoria.ultimoTopico}, somando com o problema que você relatou, a melhor saída que encontrei:`
                };
            }
            const limpa = transcript.replace(/^(e |ent[ãa]o |ai |a[íi] |da[íi] |dai |e como |e o que |e qual |como |o que |qual |quais |por que |porque |quando |onde |quanto |isso |daquilo )+/i, '').trim();
            return {
                tipo: 'questao',
                consulta: (limpa.length >= 3 ? memoria.ultimoTopico + ' ' + limpa : memoria.ultimoTopico),
                prefixo: `Combinando o que conversamos sobre ${memoria.ultimoTopico} com a sua pergunta:`
            };
        }

        // ==========================================
        // CÉREBRO: MICROFONE E ROTEADOR DE INTENTS
        // ==========================================
        micBtn.addEventListener('click', async () => {
            try {
                const unlockSpeech = new SpeechSynthesisUtterance('');

                audioContext = new (window.AudioContext || window.webkitAudioContext)();

                        // Face Human — variações amplas (STT pode entregar "face humana", "face human", "modo face"...)

                        const ativarFaceMatch = transcript.match(/face ?huma?na?|modo (face|humano|rosto)|ativar (o |a )?(rosto|face|humano)|ativa (o |a )?(rosto|face|humano)|liga (o |a )?(rosto|face)|transforme[- ]se (em|para|pra) (um )?(rosto|face|humano|ser humano)|modo rosto/i);

                        const ativarGenioMatch = transcript.match(/ativar modo g[eê]nio|liga[r]? modo g[eê]nio/i) || (transcript.includes('modo gênio') && !transcript.includes('desativar') && !transcript.includes('desligar') && !transcript.includes('sair'));

                        let mathTranscript = transcript
                            .replace(/\bzero\b/g, '0').replace(/\bum\b/g, '1').replace(/\bdois\b/g, '2').replace(/\btr[eê]s\b/g, '3')
                            .replace(/\bquatro\b/g, '4').replace(/\bcinco\b/g, '5').replace(/\bseis\b/g, '6').replace(/\bsete\b/g, '7')
                            .replace(/\boito\b/g, '8').replace(/\bnove\b/g, '9').replace(/\bdez\b/g, '10');

                        const mathRegex = /(\d+(?:[.,]\d+)?)\s*(mais|somada? a?|\+|menos|-|vezes|\*|x|multiplicado(?: por)?|dividido(?: por| para| pra)?|\/)\s*(\d+(?:[.,]\d+)?)/i;

                                responderComoUltron(`Você tem ${tarefas.length} ${plural}. São elas: ${textoTarefas}.`);

                        else if (nomeMatch) {
                            nomeUsuario = nomeMatch[1].charAt(0).toUpperCase() + nomeMatch[1].slice(1);
                            localStorage.setItem('utron.name', nomeUsuario);
                            responderComoUltron(`Entendido. A partir de agora, o chamarei de ${nomeUsuario}.`);

                        else if (transcript.includes('capacidade máxima') || transcript.includes('capacidade maxima')) {

                        }
                        else if (transcript.includes('horas') || transcript.includes('hora')) {

                            responderComoUltron(`Agora são exatamente ${time}, ${nomeUsuario}.`);
                        }
                        else if (mathMatch) {
                            let num1 = parseFloat(mathMatch[1].replace(',', '.'));
                            let num2 = parseFloat(mathMatch[3].replace(',', '.'));
                            let operador = mathMatch[2].toLowerCase();
                            let resultado;

                            if (operador.includes('mais') || operador.includes('somad') || operador === '+') {
                                resultado = num1 + num2;
                            } else if (operador.includes('menos') || operador === '-') {
                                resultado = num1 - num2;
                            } else if (operador.includes('vezes') || operador.includes('multiplicado') || operador === '*' || operador === 'x') {
                                resultado = num1 * num2;
                            } else if (operador.includes('dividido') || operador === '/') {
                                if (num2 === 0) {
                                    responderComoUltron(`Não é possível dividir por zero, ${nomeUsuario}.`);

                                }

                        // ---- BASE DE CONHECIMENTO LOCAL (antes da internet) ----
                        else {

        // ==========================================
        // ESFERA DE PLASMA — shader de GPU (leve e bonito)
        // Rim glow (fresnel), ruído simplex animado,
        // anéis de pulso na fala, sparkles e cores em fluxo.
        // ==========================================
        const NOISE_GLSL = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0) * 2.0 + 1.0;
            vec4 s1 = floor(b1) * 2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }
        `;

        const esferaGeometry = new THREE.IcosahedronGeometry(2.2, 7);
        const vCount = esferaGeometry.attributes.position.count;
        const randArr = new Float32Array(vCount);
        for (let i = 0; i < vCount; i++) randArr[i] = Math.random();
        esferaGeometry.setAttribute('aRand', new THREE.BufferAttribute(randArr, 1));

        const esferaUniforms = {
            uTime: { value: 0 },
            uPulse: { value: 0 },
            uFace: { value: isFaceActive ? 1 : 0 },
            uGenio: { value: isGenioActive ? 1 : 0 }
        };

        const esferaMaterial = new THREE.ShaderMaterial({
            uniforms: esferaUniforms,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexShader: NOISE_GLSL + `
                uniform float uTime;
                uniform float uPulse;
                uniform float uFace;
                uniform float uGenio;
                attribute float aRand;
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    vec3 dir = normalize(position);
                    float t = uTime * 0.35;

                    float n1 = snoise(dir * 1.6 + vec3(0.0, t, t * 0.7));
                    float n2 = snoise(dir * 3.4 - vec3(t * 0.6, 0.0, t));
                    float noise01 = (n1 * 0.65 + n2 * 0.35) * 0.5 + 0.5;

                    float disp = 0.05 + 0.10 * noise01 + uPulse * 0.12 * max(0.0, n2);
                    disp *= (1.0 - uFace * 0.85);
                    vec3 p = position + dir * disp;

                    vec4 mv = modelViewMatrix * vec4(p, 1.0);

                    vec3 nView = normalize(normalMatrix * dir);
                    vec3 vView = normalize(-mv.xyz);
                    float fres = pow(1.0 - abs(dot(nView, vView)), 2.0);

                    vec3 deep = mix(vec3(0.06, 0.01, 0.18), vec3(0.0, 0.06, 0.02), uGenio);
                    vec3 mid  = mix(vec3(0.48, 0.12, 0.85), vec3(0.0, 0.40, 0.08), uGenio);
                    vec3 hot  = mix(vec3(0.20, 0.85, 1.00), vec3(0.30, 1.00, 0.35), uGenio);

                    float bands = smoothstep(0.25, 0.8, noise01);
                    vec3 base = mix(deep, mid, bands);
                    base = mix(base, hot, smoothstep(0.72, 0.97, noise01) * (0.55 + uPulse * 0.6));

                    float ring = pow(max(0.0, sin(dir.y * 5.0 - uTime * 7.0 + n1 * 2.0)), 6.0) * uPulse * 0.9;
                    float spark = step(0.985, fract(aRand * 91.7 + sin(uTime * 3.0 + aRand * 40.0) * 0.02))
                                  * (0.5 + 0.5 * sin(uTime * 9.0 + aRand * 100.0));

                    vec3 col = base * (0.55 + 0.6 * noise01);
                    col += hot * (fres * (0.9 + uPulse * 1.2));
                    col += hot * ring;
                    col += vec3(1.0) * spark * 0.9;

                    vColor = col;
                    vAlpha = clamp((0.35 + 0.65 * fres + ring * 0.5 + spark) * (1.0 - uFace), 0.0, 1.0);

                    float size = (1.6 + 2.6 * aRand) * (1.0 + uPulse * 0.5);
                    gl_PointSize = size * (140.0 / -mv.z);
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vAlpha;
                void main() {
                    vec2 c = gl_PointCoord - 0.5;
                    float d = length(c) * 2.0;
                    float falloff = 1.0 - smoothstep(0.15, 1.0, d);
                    float core = (1.0 - smoothstep(0.0, 0.5, d)) * 0.7;
                    float a = (falloff * 0.8 + core) * vAlpha;
                    if (a < 0.01) discard;
                    gl_FragColor = vec4(vColor, a);
                }
            `
        });
        const esfera = new THREE.Points(esferaGeometry, esferaMaterial);
        scene.add(esfera);

        // ---- Poeira orbital sutil (profundidade, sem peso) ----
        function criarTexturaSuave() {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
            g.addColorStop(0.7, 'rgba(255,255,255,0.12)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }
        const softTex = criarTexturaSuave();

        const D = 320;
        const dustPos = new Float32Array(D * 3);
        const dustCol = new Float32Array(D * 3);
        const dustPalette = [[0.45, 0.20, 0.90], [0.25, 0.50, 0.95], [0.70, 0.30, 0.85]];
        for (let i = 0; i < D; i++) {
            let dx = Math.random() * 2 - 1, dy = Math.random() * 2 - 1, dz = Math.random() * 2 - 1;
            const l = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
            dx /= l; dy /= l; dz /= l;
            const r = 2.7 + Math.random() * 1.0;

            const pc = dustPalette[Math.floor(Math.random() * dustPalette.length)];

        }
        const dustGeometry = new THREE.BufferGeometry();

        dustGeometry.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
        const dustMaterial = new THREE.PointsMaterial({

        const dust = new THREE.Points(dustGeometry, dustMaterial);
        scene.add(dust);

        // ---- Estrelas de fundo ----
        const S = 550;
        const starPos = new Float32Array(S * 3);
        const starCol = new Float32Array(S * 3);
        for (let i = 0; i < S; i++) {
            let dx = Math.random() * 2 - 1, dy = Math.random() * 2 - 1, dz = Math.random() * 2 - 1;
            const l = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
            const r = 13 + Math.random() * 7;
            starPos[i * 3] = dx / l * r; starPos[i * 3 + 1] = dy / l * r; starPos[i * 3 + 2] = dz / l * r;
            const b = 0.5 + Math.random() * 0.5;

        }
        const starGeometry = new THREE.BufferGeometry();

        starGeometry.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
        const starMaterial = new THREE.PointsMaterial({

        const stars = new THREE.Points(starGeometry, starMaterial);

        // ---- Glow central ----
        const glowMaterial = new THREE.SpriteMaterial({

        const whiteColor = new THREE.Color(1, 1, 1);

        // ==========================================
        // FACE HUMAN — partículas que condensam no rosto
        // (só visível e processado durante o modo face)
        // ==========================================
        const N = 3200;
        const positions = new Float32Array(N * 3);
        const colors = new Float32Array(N * 3);
        const origX = new Float32Array(N), origY = new Float32Array(N), origZ = new Float32Array(N);
        const baseR = new Float32Array(N);
        const seeds = new Float32Array(N);
        const delays = new Float32Array(N);
        const faceTX = new Float32Array(N), faceTY = new Float32Array(N), faceTZ = new Float32Array(N);
        const nebCR = new Float32Array(N), nebCG = new Float32Array(N), nebCB = new Float32Array(N);
        const faceCR = new Float32Array(N), faceCG = new Float32Array(N), faceCB = new Float32Array(N);
        const parts = new Uint8Array(N);
        const eyeCY = new Float32Array(N);

        const palette = [
            [0.54, 0.17, 0.89],
            [0.85, 0.27, 0.94],
            [0.22, 0.74, 0.97],
            [0.13, 0.83, 0.93],
            [0.96, 0.45, 0.71],
            [0.23, 0.26, 0.72]
        ];

        const _fo = { x: 0, y: 0, z: 0 };
        function faceOutline(t) {
            const x0 = Math.cos(t), y0 = Math.sin(t);
            let x = 1.0 * x0;
            let y = 1.35 * y0;
            if (y0 < 0) {
                const jaw = Math.pow(-y0, 1.3);
                x *= (1 - 0.52 * jaw);
                y *= (1 - 0.10 * jaw);
            } else {
                x *= 1 + 0.06 * y0;
            }
            const z = 0.34 * (1 - (y / 1.35) * (y / 1.35)) * 0.9;
            _fo.x = x; _fo.y = y; _fo.z = z;
            return _fo;
        }

        for (let i = 0; i < N; i++) {
            let dx, dy, dz;
            do {
                dx = Math.random() * 2 - 1;
                dy = Math.random() * 2 - 1;
                dz = Math.random() * 2 - 1;
                const l2 = dx * dx + dy * dy + dz * dz;
                if (l2 < 0.05 || l2 > 1) { dx = NaN; } else {
                    const l = Math.sqrt(l2);
                    dx /= l; dy /= l; dz /= l;
                }
            } while (isNaN(dx));
            const r = 2.2 * (0.75 + Math.random() * 0.55);
            origX[i] = dx * r; origY[i] = dy * r; origZ[i] = dz * r;
            baseR[i] = r;
            seeds[i] = Math.random();
            delays[i] = Math.random() * 0.35;

            const pc = palette[Math.floor(Math.random() * palette.length)];
            const bright = 0.7 + Math.random() * 0.5;
            nebCR[i] = pc[0] * bright;
            nebCG[i] = pc[1] * bright;
            nebCB[i] = pc[2] * bright;

            const roll = Math.random();
            if (roll < 0.45) {
                parts[i] = 0;
                const t = Math.random() * Math.PI * 2;
                const f = faceOutline(t);
                faceTX[i] = f.x; faceTY[i] = f.y; faceTZ[i] = f.z;
                faceCR[i] = 0.62; faceCG[i] = 0.42; faceCB[i] = 1.0;
            } else if (roll < 0.58) {
                parts[i] = 1;
                const side = Math.random() < 0.5 ? -1 : 1;
                const a = Math.random() * Math.PI * 2;
                const ex = Math.cos(a) * 0.30, ey = Math.sin(a) * 0.10;
                const tilt = 0.14 * side;
                const xr = ex * Math.cos(tilt) - ey * Math.sin(tilt);
                const yr = ex * Math.sin(tilt) + ey * Math.cos(tilt);
                faceTX[i] = side * 0.44 + xr;
                faceTY[i] = 0.38 + yr;
                faceTZ[i] = 0.34;
                eyeCY[i] = 0.38;
                faceCR[i] = 0.30; faceCG[i] = 0.95; faceCB[i] = 1.0;
            } else if (roll < 0.65) {
                parts[i] = 2;
                let ny = 0.30 - Math.random() * 0.40;
                let nx = (Math.random() - 0.5) * 0.05;
                if (ny < -0.02) {
                    nx = (Math.random() < 0.5 ? -1 : 1) * (0.03 + Math.random() * 0.07);
                    ny = -0.08 - Math.random() * 0.08;
                }
                faceTX[i] = nx; faceTY[i] = ny; faceTZ[i] = 0.36;
                faceCR[i] = 0.55; faceCG[i] = 0.45; faceCB[i] = 0.95;
            } else if (roll < 0.74) {
                parts[i] = 3;
                const u = (Math.random() * 2 - 1) * 0.32;
                faceTX[i] = u;
                faceTY[i] = -0.62 + 0.035 * (1 - (u / 0.32) * (u / 0.32)) + (Math.random() - 0.5) * 0.02;
                faceTZ[i] = 0.33;
                faceCR[i] = 0.70; faceCG[i] = 0.50; faceCB[i] = 1.0;
            } else {
                parts[i] = 4;
                const t = Math.random() * Math.PI * 2;
                const s = Math.pow(Math.random(), 0.65);
                const f = faceOutline(t);
                faceTX[i] = f.x * s;
                faceTY[i] = f.y * s * 0.92;
                faceTZ[i] = f.z * s * 0.55 + 0.05;
                faceCR[i] = 0.21; faceCG[i] = 0.15; faceCB[i] = 0.37;
            }
        }

        const faceGeometry = new THREE.BufferGeometry();
        faceGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        faceGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const faceMaterial = new THREE.PointsMaterial({
            size: 0.055, map: softTex, vertexColors: true,
            blending: THREE.AdditiveBlending, transparent: true, opacity: 0, depthWrite: false
        });
        const facePoints = new THREE.Points(faceGeometry, faceMaterial);
        facePoints.visible = false;
        scene.add(facePoints);

        // ==========================================
        // LOOP DE ANIMAÇÃO
        // ==========================================
        const clock = new THREE.Clock();
        let morph = isFaceActive ? 1 : 0;
        let genioBlend = isGenioActive ? 1 : 0;
        let nebAngleY = 0, nebAngleX = 0;
        let prevFaceBlend = isFaceActive ? 1 : 0;

        function wrapAngle(a) {
            while (a > Math.PI) a -= 2 * Math.PI;
            while (a < -Math.PI) a += 2 * Math.PI;
            return a;
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(0.05, clock.getDelta());
            const time = clock.elapsedTime;

            const morphTarget = isFaceActive ? 1 : 0;
            morph += (morphTarget - morph) * 0.028;
            if (Math.abs(morphTarget - morph) < 0.001) morph = morphTarget;
            genioBlend += ((isGenioActive ? 1 : 0) - genioBlend) * 0.04;
            const faceBlend = morph * morph * (3 - 2 * morph);

            corBaseAtual.lerp(corBaseAlvo, 0.03);
            corAtivaAtual.lerp(corAtivaAlvo, 0.03);
            const cAtivaCSS = `rgb(${Math.round(corAtivaAtual.r * 255)}, ${Math.round(corAtivaAtual.g * 255)}, ${Math.round(corAtivaAtual.b * 255)})`;
            appHeader.style.textShadow = `0 0 12px ${cAtivaCSS}`;
            appHeader.style.borderBottomColor = cAtivaCSS;

            if (isUltronSpeaking) {
                currentVolume = (Math.sin(time * 20) * 0.5 + 0.5) * (Math.random() * 0.6 + 0.4) * 0.7;
            } else {
                currentVolume = 0;
            }
            smoothedVolume += (currentVolume - smoothedVolume) * 0.15;
            const activeVolume = Math.min(1.0, smoothedVolume * 2.5);

            // ---- Uniforms do shader da esfera ----
            esferaUniforms.uTime.value = time;
            esferaUniforms.uPulse.value = activeVolume;
            esferaUniforms.uFace.value = morph;
            esferaUniforms.uGenio.value = genioBlend;

            const inFace = faceBlend >= 0.5;
            if (!inFace) {
                if (prevFaceBlend >= 0.5) { nebAngleY = esfera.rotation.y; nebAngleX = esfera.rotation.x; }
                nebAngleY += dt * 0.12;
                nebAngleX += dt * 0.08;
                esfera.rotation.y = nebAngleY;
                esfera.rotation.x = nebAngleX;
            } else {
                esfera.rotation.y += wrapAngle(esfera.rotation.y) * -0.06;
                esfera.rotation.x += esfera.rotation.x * -0.06;
                esfera.rotation.y += Math.sin(time * 0.25) * 0.0012;
                esfera.rotation.x += Math.sin(time * 0.17) * 0.0009;
            }
            prevFaceBlend = faceBlend;

            // Esfera dissolvida/encolhida durante a face
            const escalaEsfera = 1 - 0.4 * faceBlend;
            esfera.scale.setScalar(escalaEsfera);
            esfera.visible = faceBlend < 0.999;

            // Poeira e estrelas
            dust.rotation.y = time * 0.03;
            dust.rotation.z = time * 0.012;
            dustMaterial.opacity = 0.22 * (1 - faceBlend * 0.85);
            stars.rotation.y = time * 0.004;
            glowMaterial.opacity = (0.14 + activeVolume * 0.35) * (1 - faceBlend * 0.7);
            glowMaterial.color.copy(corAtivaAtual).lerp(whiteColor, 0.4);

            // ---- Partículas da face (só quando morfas) ----
            facePoints.visible = morph > 0.01;
            if (morph > 0.01) {
                faceMaterial.opacity = faceBlend;
                const posAttr = faceGeometry.attributes.position;
                const colAttr = faceGeometry.attributes.color;
                const nebAmp = 1 - 0.85 * faceBlend;

                const eyeR = 0.30;
                const eyeG = 0.95 + 0.05 * genioBlend;
                const eyeB = 1.0 - 0.70 * genioBlend;

                let blinkScale = 1;
                const cyc = time % 4.5;
                if (cyc < 0.22 && faceBlend > 0.7) {
                    blinkScale = 1 - Math.sin(Math.PI * cyc / 0.22) * 0.92;
                }

                for (let i = 0; i < N; i++) {
                    const i3 = i * 3;
                    const s1 = seeds[i];
                    const ox = origX[i], oy = origY[i], oz = origZ[i];

                    const n1 = Math.sin(time * 0.40 + s1 * 6.283 + ox * 2.0);
                    const n2 = Math.cos(time * 0.31 + s1 * 4.17 + oy * 2.5);
                    const n3 = Math.sin(time * 0.52 + s1 * 5.31 + oz * 3.0);
                    const radial = (n1 * 0.35 + n2 * 0.25 + n3 * 0.20) * nebAmp;
                    const pulse = activeVolume * 0.40 * (1 - faceBlend) * (0.5 + 0.5 * Math.sin(time * 8 - baseR[i] * 3.0 + s1 * 3.0));

                    const swirlA = time * (0.05 + s1 * 0.12);
                    const cosS = Math.cos(swirlA), sinS = Math.sin(swirlA);
                    const nx = ox * cosS - oz * sinS;
                    const nz0 = ox * sinS + oz * cosS;
                    const ny = oy;
                    const len = Math.sqrt(nx * nx + ny * ny + nz0 * nz0) || 1;
                    const r = baseR[i] + radial + pulse;
                    let px = nx / len * r;
                    let py = ny / len * r;
                    let pz = nz0 / len * r;

                    let pLocal = morph * 1.4 - delays[i];
                    if (pLocal < 0) pLocal = 0;
                    else if (pLocal > 1) pLocal = 1;
                    const e = pLocal * pLocal * (3 - 2 * pLocal);

                    if (e > 0) {
                        const fx = faceTX[i], fy = faceTY[i], fz = faceTZ[i];
                        px += (fx - px) * e;
                        py += (fy - py) * e;
                        pz += (fz - pz) * e;

                        const sw = (1 - e) * (s1 - 0.5) * 1.6;
                        const cs = Math.cos(sw), sn = Math.sin(sw);
                        const rx = px * cs - pz * sn;
                        pz = px * sn + pz * cs;
                        px = rx;

                        const jit = Math.sin(time * 1.6 + s1 * 9.0) * 0.008 * e;
                        px += jit;
                        py += jit * 0.7;
                        pz += jit;

                        if (parts[i] === 1) {
                            py = eyeCY[i] + (py - eyeCY[i]) * blinkScale;
                        }
                        if (parts[i] === 3 && activeVolume > 0.02) {
                            py += Math.sin(time * 11 + s1 * 12) * 0.018 * activeVolume;
                        }
                    }

                    posAttr.setXYZ(i, px, py, pz);

                    const pulseC = 0.72 + 0.28 * Math.sin(time * 0.6 + s1 * 6.283);
                    let cr = nebCR[i] * pulseC;
                    let cg = nebCG[i] * pulseC;
                    let cb = nebCB[i] * pulseC;

                    const en = activeVolume * (1 - faceBlend);
                    cr += en * 0.25; cg += en * 0.40; cb += en * 0.50;

                    if (e > 0) {
                        let fcr = faceCR[i], fcg = faceCG[i], fcb = faceCB[i];
                        if (parts[i] === 1) {
                            const og = 0.85 + activeVolume * 0.6;
                            fcr = eyeR * og; fcg = eyeG * og; fcb = eyeB * og;
                        } else if (parts[i] === 3) {
                            const mg = 1 + activeVolume * 0.4;
                            fcr *= mg; fcg *= mg; fcb *= mg;
                        } else if (parts[i] === 4) {
                            const fl = 0.7 + 0.3 * Math.sin(time * 2 + s1 * 20);
                            fcr *= fl; fcg *= fl; fcb *= fl;
                        }
                        cr += (fcr - cr) * e;
                        cg += (fcg - cg) * e;
                        cb += (fcb - cb) * e;
                    }

                    colAttr.setXYZ(i, cr, cg, cb);
                }

                posAttr.needsUpdate = true;
                colAttr.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
