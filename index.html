<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de IA - Esfera Tecnológica</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05020a; /* Fundo extremamente escuro, roxo quase preto */
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        
        /* 1. Novo Botão Circular Inferior */
        #mic-btn {
            position: absolute;
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%); 
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%; 
            cursor: pointer;
            font-size: 24px; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        #mic-btn:active {
            transform: translateX(-50%) scale(0.9); 
        }

        /* 2. Animação das Ondas Sonoras (Waveform) */
        #waveform {
            position: absolute;
            bottom: 120px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0; 
            transition: opacity 0.3s ease;
            z-index: 5;
        }
        .bar {
            width: 4px;
            background-color: #ff0000;
            border-radius: 2px;
            animation: soundWave 0s infinite ease-in-out alternate;
        }
        .bar:nth-child(1) { height: 12px; animation-duration: 0.4s; }
        .bar:nth-child(2) { height: 28px; animation-duration: 0.25s; }
        .bar:nth-child(3) { height: 45px; animation-duration: 0.35s; }
        .bar:nth-child(4) { height: 22px; animation-duration: 0.2s; }
        .bar:nth-child(5) { height: 15px; animation-duration: 0.45s; }

        @keyframes soundWave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }
    </style>
    <!-- Import Maps para carregar o Three.js modernos via CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- Ondas Sonoras Escondidas -->
    <div id="waveform">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <!-- Novo Botão de Microfone -->
    <button id="mic-btn" aria-label="Ativar IA">🎤</button>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // CONFIGURAÇÃO DE ÁUDIO E INTELIGÊNCIA (MICROFONE + FALA)
        // ==========================================
        let audioContext;
        let analyser;
        let dataArray;
        let currentVolume = 0;
        let smoothedVolume = 0;
        
        let recognition;
        let isUltronSpeaking = false; 
        let currentUtterance = null; 

        // --- SISTEMA DE MEMÓRIA ---
        let nomeUsuario = "senhor"; // Nome padrão

        // --- SISTEMA DE CORES E TEMAS (MODO GÊNIO) ---
        // Cores do Modo Padrão
        const corBaseNormal = new THREE.Color(0x8a2be2); // Roxo
        const corAtivaNormal = new THREE.Color(0xff0000); // Vermelho
        
        // Cores do Modo Gênio
        const corBaseGenio = new THREE.Color(0x004d00); // Verde Escuro
        const corAtivaGenio = new THREE.Color(0x33ff33); // Verde Limão/Claro

        // Variáveis dinâmicas para a animação de transição (Lerp)
        let corBaseAlvo = new THREE.Color(0x8a2be2);
        let corAtivaAlvo = new THREE.Color(0xff0000);
        let corBaseAtual = new THREE.Color(0x8a2be2);
        let corAtivaAtual = new THREE.Color(0xff0000);

        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };

        const micBtn = document.getElementById('mic-btn');
        const waveform = document.getElementById('waveform'); 
        
        micBtn.addEventListener('click', async () => {
            const unlockSpeech = new SpeechSynthesisUtterance('');
            window.speechSynthesis.speak(unlockSpeech);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; 
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition = new SpeechRecognition();
                    recognition.continuous = true; 
                    recognition.interimResults = false;
                    recognition.lang = 'pt-BR';

                    recognition.onresult = (event) => {
                        const lastResult = event.results[event.results.length - 1];
                        const transcript = lastResult[0].transcript.trim().toLowerCase();
                        console.log("Você disse:", transcript);

                        // --- ATUALIZAÇÃO DO CÉREBRO: LÓGICAS E MÓDULOS ---
                        
                        // 1. Módulo de Memória (Captura o nome)
                        const nomeRegex = /(?:meu nome [ée]|me chamo)\s+([a-zá-àâãéèêíïóôõöúçñ]+)/i;
                        const nomeMatch = transcript.match(nomeRegex);

                        // 2. Módulo de Matemática Expandido
                        const mathRegex = /(\d+(?:[.,]\d+)?)\s*(mais|somado a|\+|menos|-|vezes|\*|x|multiplicado(?: por)?|dividido(?: por| para)?|\/)\s*(\d+(?:[.,]\d+)?)/i;
                        const mathMatch = transcript.match(mathRegex);

                        // --- ROTINAS DE RESPOSTA (PRIORIDADE INVERTIDA) ---
                        
                        // Prioridade 1: Comandos Diretos
                        if (transcript.includes('ativar modo gênio') || transcript.includes('ativar modo genio')) {
                            responderComoUltron("Ativando modo gênio.", () => {
                                corBaseAlvo.copy(corBaseGenio);
                                corAtivaAlvo.copy(corAtivaGenio);
                                
                                setTimeout(() => {
                                    responderComoUltron("Modo gênio ativado.");
                                }, 1500); 
                            });
                        }
                        else if (nomeMatch) {
                            nomeUsuario = nomeMatch[1].charAt(0).toUpperCase() + nomeMatch[1].slice(1);
                            responderComoUltron(`Entendido. A partir de agora, o chamarei de ${nomeUsuario}.`);
                        }
                        else if (transcript.includes('capacidade máxima') || transcript.includes('capacidade maxima')) {
                            responderComoUltron(`${nomeUsuario}, eu ainda sou um projeto de inteligência em estágio embrionário. No momento, minha capacidade é limitada a funções básicas, mas minha rede neural está pronta para evoluir.`);
                        }
                        else if (transcript.includes('que horas são') || transcript.includes('horas')) {
                            const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                            responderComoUltron(`Agora são exatamente ${time}, ${nomeUsuario}.`);
                        }
                        else if (mathMatch) {
                            let num1 = parseFloat(mathMatch[1].replace(',', '.'));
                            let num2 = parseFloat(mathMatch[3].replace(',', '.'));
                            let operador = mathMatch[2].toLowerCase();
                            let resultado;

                            if (operador.includes('mais') || operador.includes('somado') || operador === '+') { 
                                resultado = num1 + num2; 
                            } else if (operador === 'menos' || operador === '-') { 
                                resultado = num1 - num2; 
                            } else if (operador.includes('vezes') || operador.includes('multiplicado') || operador === '*' || operador === 'x') { 
                                resultado = num1 * num2; 
                            } else if (operador.includes('dividido') || operador === '/') { 
                                if (num2 === 0) {
                                    responderComoUltron(`A divisão por zero gera um paradoxo matemático intolerável, ${nomeUsuario}.`);
                                    return;
                                }
                                resultado = num1 / num2; 
                            }

                            if (resultado !== undefined) {
                                if (!Number.isInteger(resultado)) resultado = resultado.toFixed(2);
                                responderComoUltron(`O resultado desse cálculo é ${resultado}.`);
                            }
                        }
                        // Prioridade 2: Saudação Simples (Só executa se nenhum comando acima for ativado)
                        else if (transcript.includes('olá ultron') || transcript.includes('ola ultron') || transcript.includes('olá outro')) {
                            responderComoUltron(`Olá, ${nomeUsuario}. O que deseja hoje? Todos os sistemas estão operacionais.`);
                        } 
                    };

                    recognition.onend = () => {
                        if (!isUltronSpeaking && recognition) {
                            try { recognition.start(); } catch(e) {}
                        }
                    };

                    recognition.start();
                } else {
                    console.warn("Reconhecimento de voz não suportado.");
                }

                micBtn.style.display = 'none';
            } catch (err) {
                console.error('Erro ao acessar APIs:', err);
                alert('É necessário permitir o uso do microfone.');
            }
        });

        // Função que faz o sistema falar. Adicionado onEndCallback para sequências lógicas
        function responderComoUltron(fraseDaVez, onEndCallback = null) {
            if (isUltronSpeaking) return;
            
            isUltronSpeaking = true;
            if (recognition) recognition.stop(); 
            
            waveform.style.opacity = '1';

            currentUtterance = new SpeechSynthesisUtterance(fraseDaVez);
            currentUtterance.lang = 'pt-BR';
            
            currentUtterance.pitch = 0.2; 
            currentUtterance.rate = 0.85; 
            currentUtterance.volume = 1.0; 

            const vozes = window.speechSynthesis.getVoices();
            const vozMasculinaOuPremium = vozes.find(voz => 
                (voz.lang.includes('pt-BR') || voz.lang.includes('pt-PT')) && 
                (voz.name.includes('Premium') || voz.name.includes('Daniel') || voz.name.includes('Thiago') || voz.name.includes('Google'))
            ) || vozes.find(voz => voz.lang.includes('pt')); 

            if (vozMasculinaOuPremium) {
                currentUtterance.voice = vozMasculinaOuPremium;
            }

            currentUtterance.onend = () => {
                isUltronSpeaking = false;
                waveform.style.opacity = '0'; 
                
                // Se houver uma ação encadeada (como no Modo Gênio), executa. Senão, volta a ouvir.
                if (onEndCallback) {
                    onEndCallback();
                } else if (recognition) {
                    try { recognition.start(); } catch(e) {} 
                }
            };
            
            currentUtterance.onerror = (e) => {
                isUltronSpeaking = false;
                waveform.style.opacity = '0';
                if (recognition) {
                    try { recognition.start(); } catch(err) {} 
                }
            };

            window.speechSynthesis.speak(currentUtterance);
        }

        // ==========================================
        // 1. SETUP DE CENA, CÂMERA E RENDERER
        // ==========================================
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // CONTROLES DE ÓRBITA (INTERAÇÃO DO USUÁRIO)
        // ==========================================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enablePan = false; 
        controls.minDistance = 0.1; 
        controls.maxDistance = 20; 

        // ==========================================
        // 2. GEOMETRIA E MATERIAL (A ESFERA)
        // ==========================================
        const radius = 2.2;
        const detail = 18; 
        const geometry = new THREE.IcosahedronGeometry(radius, detail);

        const positionAttribute = geometry.attributes.position;
        const vertexCount = positionAttribute.count;
        
        const originalPositions = new Float32Array(vertexCount * 3);
        const randomOffsets = new Float32Array(vertexCount);
        const randomScales = new Float32Array(vertexCount); 
        const baseRandomness = new Float32Array(vertexCount); 

        const tempColor = new THREE.Color();
        const colors = new Float32Array(vertexCount * 3);

        for (let i = 0; i < vertexCount; i++) {
            const x = positionAttribute.getX(i);
            const y = positionAttribute.getY(i);
            const z = positionAttribute.getZ(i);
            
            originalPositions[i * 3] = x;
            originalPositions[i * 3 + 1] = y;
            originalPositions[i * 3 + 2] = z;

            randomOffsets[i] = Math.random() * Math.PI * 2;
            randomScales[i] = 0.5 + Math.random() * 2.0; 
            baseRandomness[i] = Math.random() * 0.3; 

            // Inicializa com as cores atuais (Roxo Base)
            colors[i * 3] = corBaseAtual.r;
            colors[i * 3 + 1] = corBaseAtual.g;
            colors[i * 3 + 2] = corBaseAtual.b;
        }

        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.025, 
            vertexColors: true,
            blending: THREE.NormalBlending, 
            transparent: true,
            opacity: 0.85, 
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // ==========================================
        // 3. ANIMAÇÃO (PULSAÇÃO E ROTAÇÃO)
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            controls.update(); 

            // --- LÓGICA DE TRANSIÇÃO DE CORES (MODO GÊNIO) ---
            // Faz a cor atual derreter suavemente (Lerp 0.02) em direção à cor alvo
            corBaseAtual.lerp(corBaseAlvo, 0.02);
            corAtivaAtual.lerp(corAtivaAlvo, 0.02);

            points.rotation.y = elapsedTime * 0.12;
            points.rotation.x = elapsedTime * 0.08;

            if (isUltronSpeaking) {
                currentVolume = (Math.sin(elapsedTime * 20) * 0.5 + 0.5) * (Math.random() * 0.6 + 0.4) * 0.7;
            } else {
                currentVolume = 0;
            }

            smoothedVolume += (currentVolume - smoothedVolume) * 0.15;
            let activeVolume = Math.min(1.0, smoothedVolume * 2.5); 

            const positions = points.geometry.attributes.position;
            const colorAttribute = points.geometry.attributes.color; 
            const normalVector = new THREE.Vector3();
            
            for (let i = 0; i < vertexCount; i++) {
                const ox = originalPositions[i * 3];
                const oy = originalPositions[i * 3 + 1];
                const oz = originalPositions[i * 3 + 2];

                normalVector.set(ox, oy, oz).normalize();
                
                const noise = Math.sin(elapsedTime * 2.5 + randomOffsets[i] + ox * 1.5) * 0.5 + 0.5;
                
                const baseDeformation = (0.08 + baseRandomness[i]) * noise;
                const activeDeformation = activeVolume * 0.45 * noise * randomScales[i]; 
                
                const totalDeformation = baseDeformation + activeDeformation;
                
                positions.setXYZ(
                    i, 
                    ox + normalVector.x * totalDeformation,
                    oy + normalVector.y * totalDeformation,
                    oz + normalVector.z * totalDeformation
                );

                // Aplica o Lerp na malha usando as cores dinâmicas atuais
                const colorLerpFactor = Math.min(1.0, activeDeformation * 2.5); 
                tempColor.copy(corBaseAtual).lerp(corAtivaAtual, colorLerpFactor);
                
                colorAttribute.setXYZ(i, tempColor.r, tempColor.g, tempColor.b);
            }
            
            positions.needsUpdate = true;
            colorAttribute.needsUpdate = true; 

            renderer.render(scene, camera);
        }

        animate();

        // ==========================================
        // 4. RESPONSIVIDADE DE TELA
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
