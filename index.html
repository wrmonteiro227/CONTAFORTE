<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de IA - Esfera Tecnológica</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05020a; /* Fundo extremamente escuro, roxo quase preto */
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        /* Estilização do botão para ativar o microfone (Exigência de segurança dos navegadores) */
        #mic-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
            transition: background-color 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #mic-btn:hover {
            background-color: #6a1b9a;
        }
    </style>
    <!-- Import Maps para carregar o Three.js modernos via CDN -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <button id="mic-btn">Ativar Microfone e IA</button>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==========================================
        // CONFIGURAÇÃO DE ÁUDIO E INTELIGÊNCIA (MICROFONE + FALA)
        // ==========================================
        let audioContext;
        let analyser;
        let dataArray;
        let currentVolume = 0;
        let smoothedVolume = 0;
        
        let recognition;
        let isUltronSpeaking = false; // Flag para controlar de quem é a vez de falar

        const micBtn = document.getElementById('mic-btn');
        
        micBtn.addEventListener('click', async () => {
            try {
                // 1. Solicita permissão e configura o microfone (Web Audio API)
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; 
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                // 2. Desbloqueia a voz do sistema no iOS (SpeechSynthesis)
                // O iOS exige que a primeira fala ocorra a partir de um clique do usuário
                const unlockSpeech = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockSpeech);

                // 3. Configura o Reconhecimento de Voz (SpeechRecognition)
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition = new SpeechRecognition();
                    recognition.continuous = true; // Continua ouvindo o tempo todo
                    recognition.interimResults = false;
                    recognition.lang = 'pt-BR';

                    recognition.onresult = (event) => {
                        const lastResult = event.results[event.results.length - 1];
                        const transcript = lastResult[0].transcript.trim().toLowerCase();
                        console.log("Você disse:", transcript);

                        // Lógica de Gatilho: Verifica se você chamou o Ultron
                        if (transcript.includes('olá ultron') || transcript.includes('ola ultron') || transcript.includes('olá outro')) {
                            responderComoUltron();
                        }
                    };

                    // Mantém o reconhecimento rodando se ele parar sozinho
                    recognition.onend = () => {
                        if (!isUltronSpeaking && recognition) {
                            try { recognition.start(); } catch(e) {}
                        }
                    };

                    recognition.start();
                } else {
                    console.warn("Reconhecimento de voz não suportado neste navegador.");
                }

                micBtn.style.display = 'none';
            } catch (err) {
                console.error('Erro ao acessar APIs:', err);
                alert('É necessário permitir o uso do microfone.');
            }
        });

        // Função que faz o sistema falar e a esfera reagir
        function responderComoUltron() {
            if (isUltronSpeaking) return;
            
            isUltronSpeaking = true;
            if (recognition) recognition.stop(); // Para de ouvir você enquanto ele fala

            const frase = "Olá, senhor. Todos os sistemas estão operacionais. Como posso ajudar?";
            const utterance = new SpeechSynthesisUtterance(frase);
            utterance.lang = 'pt-BR';
            utterance.pitch = 0.6; // Voz um pouco mais grave para parecer uma IA
            utterance.rate = 1.0;  // Velocidade normal

            utterance.onend = () => {
                isUltronSpeaking = false;
                if (recognition) {
                    try { recognition.start(); } catch(e) {} // Volta a te ouvir
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // ==========================================
        // 1. SETUP DE CENA, CÂMERA E RENDERER
        // ==========================================
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // ==========================================
        // CONTROLES DE ÓRBITA (INTERAÇÃO DO USUÁRIO)
        // ==========================================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enablePan = false; 
        controls.minDistance = 0.1; 
        controls.maxDistance = 20; 

        // ==========================================
        // 2. GEOMETRIA E MATERIAL (A ESFERA)
        // ==========================================
        const radius = 2.2;
        const detail = 18; 
        const geometry = new THREE.IcosahedronGeometry(radius, detail);

        const positionAttribute = geometry.attributes.position;
        const vertexCount = positionAttribute.count;
        
        const originalPositions = new Float32Array(vertexCount * 3);
        const randomOffsets = new Float32Array(vertexCount);
        const randomScales = new Float32Array(vertexCount); 
        const baseRandomness = new Float32Array(vertexCount); 

        const baseColor = new THREE.Color(0x8a2be2); 
        const activeColor = new THREE.Color(0xff0000); 
        const tempColor = new THREE.Color();
        const colors = new Float32Array(vertexCount * 3);

        for (let i = 0; i < vertexCount; i++) {
            const x = positionAttribute.getX(i);
            const y = positionAttribute.getY(i);
            const z = positionAttribute.getZ(i);
            
            originalPositions[i * 3] = x;
            originalPositions[i * 3 + 1] = y;
            originalPositions[i * 3 + 2] = z;

            randomOffsets[i] = Math.random() * Math.PI * 2;
            randomScales[i] = 0.5 + Math.random() * 2.0; 
            baseRandomness[i] = Math.random() * 0.3; 

            colors[i * 3] = baseColor.r;
            colors[i * 3 + 1] = baseColor.g;
            colors[i * 3 + 2] = baseColor.b;
        }

        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.025, 
            vertexColors: true,
            blending: THREE.NormalBlending, 
            transparent: true,
            opacity: 0.85, 
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // ==========================================
        // 3. ANIMAÇÃO (PULSAÇÃO E ROTAÇÃO)
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            controls.update(); 

            points.rotation.y = elapsedTime * 0.12;
            points.rotation.x = elapsedTime * 0.08;

            // --- LÓGICA DE CAPTAÇÃO VISUAL (QUEM ESTÁ FALANDO?) ---
            if (isUltronSpeaking) {
                // Se a IA estiver falando, simula pulsos fortes baseados no tempo para a esfera reagir à própria voz
                // Mistura oscilações rápidas com fatores aleatórios para simular as sílabas
                currentVolume = (Math.sin(elapsedTime * 20) * 0.5 + 0.5) * (Math.random() * 0.6 + 0.4) * 0.7;
            } else {
                // Mantém a esfera em repouso sem reagir visualmente ao microfone do usuário
                currentVolume = 0;
            }

            smoothedVolume += (currentVolume - smoothedVolume) * 0.15;
            let activeVolume = Math.min(1.0, smoothedVolume * 2.5); 

            // Anima vértices
            const positions = points.geometry.attributes.position;
            const colorAttribute = points.geometry.attributes.color; 
            const normalVector = new THREE.Vector3();
            
            for (let i = 0; i < vertexCount; i++) {
                const ox = originalPositions[i * 3];
                const oy = originalPositions[i * 3 + 1];
                const oz = originalPositions[i * 3 + 2];

                normalVector.set(ox, oy, oz).normalize();
                
                const noise = Math.sin(elapsedTime * 2.5 + randomOffsets[i] + ox * 1.5) * 0.5 + 0.5;
                
                const baseDeformation = (0.08 + baseRandomness[i]) * noise;
                const activeDeformation = activeVolume * 0.45 * noise * randomScales[i]; 
                
                const totalDeformation = baseDeformation + activeDeformation;
                
                positions.setXYZ(
                    i, 
                    ox + normalVector.x * totalDeformation,
                    oy + normalVector.y * totalDeformation,
                    oz + normalVector.z * totalDeformation
                );

                const colorLerpFactor = Math.min(1.0, activeDeformation * 2.5); 
                tempColor.copy(baseColor).lerp(activeColor, colorLerpFactor);
                
                colorAttribute.setXYZ(i, tempColor.r, tempColor.g, tempColor.b);
            }
            
            positions.needsUpdate = true;
            colorAttribute.needsUpdate = true; 

            renderer.render(scene, camera);
        }

        animate();

        // ==========================================
        // 4. RESPONSIVIDADE DE TELA
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
