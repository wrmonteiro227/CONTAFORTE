                if (ultimaSaud !== hoje) {
                    localStorage.setItem('sexta_feira.lastGreet', hoje);
                    responderComoSextaFeira(`Olá, ${nomeUsuario}. Todos os sistemas estão operacionais.`);
                } else {
                    const n = parseInt(localStorage.getItem('sexta_feira.greetCount') || '0', 10) + 1;
                    localStorage.setItem('sexta_feira.greetCount', String(n));
                    const varia = [`Oi, ${nomeUsuario}.`, 'Oi.', 'Oi, estou escutando.'][n % 3];
                    responderComoSextaFeira(varia);
                }
            }
            else {
                // ---- Base de conhecimento local (antes da internet) ----
                const daBase = consultarBase(transcript);
                if (daBase) {
                    salvarPesquisa({ pergunta: transcript, fonte: 'Base local', titulo: daBase.slice(0, 60), url: '', lista: [] });
                    responderComoSextaFeira(`Da minha base local: ${daBase}`);
                }
                else {
                    const fato = consultarFatos(transcript);
                    if (fato) {
                        responderComoSextaFeira(`Você me ensinou antes: ${fato}.`);
                    }
                    else if (TRIGGERS_BUSCA.test(transcript)) {
                        await processarPesquisa(limparConsulta(transcript));
                    }
                    else {
                        // ---- Contexto: continuação / relato de problema ----
                        const contexto = detectarContexto(transcript);
                        if (contexto) {
                            await processarPesquisa(contexto.consulta, contexto.prefixo);
                        }
                        else if (/^(ok|okay|t[áa]m?|t[áa] bom|entendi|entendido|combinado|show|perfeito|ótimo|otimo|legal|valeu|obrigado|obrigada|beleza|show de bola|pode ser|fechado|isso|sim|nao)$|^o k$/i.test(transcript)) {
                            responderComoSextaFeira(/obrigad/i.test(transcript) ? 'Sempre à disposição.' : 'Às ordens.');
                        }
                        else if (STOP_RE.test(transcript)) {
                            responderComoSextaFeira('Compreendido.');
                        }
                        else {
                            const respostasErro = [
                                "Desculpe, não entendi o comando. Poderia repetir?",
                                "Perdão, não tenho resposta para isso no momento.",
                                "Não compreendi. Pode reformular a instrução?"
                            ];
                            responderComoSextaFeira(respostasErro[Math.floor(Math.random() * respostasErro.length)]);
                        }
                    }
                }
            }
        }

        // ==========================================
        // CÉREBRO: MICROFONE (voz)
        // ==========================================
        micBtn.addEventListener('click', async () => {
            try {
                const unlockSpeech = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockSpeech);

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;

                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);

                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = false;
                    recognition.lang = 'pt-BR';

                    recognition.onstart = () => {
                        isListening = true;
                        micBtn.style.display = 'none';
                    };

                    recognition.onresult = async (event) => {
                        const lastResult = event.results[event.results.length - 1];
                        const transcript = lastResult[0].transcript.trim().toLowerCase();
                        if (!transcript) return;

                        // ---- BARGE-IN: você falou durante a fala dela ----
                        const isStop = STOP_RE.test(transcript);
                        if (isSextaFeiraSpeaking) {
                            const conf = lastResult[0].confidence;
                            if (conf !== undefined && conf < 0.5 && !isStop) return;
                            if (!isStop && parecerAutoEscuta(transcript)) return;
                            interromperFala();
                            if (isStop) return; // silêncio: só parou
                        }

                        if (isSearching) return;

                        await processarComando(transcript);
                    };

                    recognition.onend = () => {
                        isListening = false;
                        if (!isSextaFeiraSpeaking && recognition && !recognition.active) {
                            try {
                                recognition.start();
                            } catch(e) {
                                micBtn.style.display = 'flex';
                            }
                        }
                    };

                    recognition.onerror = (event) => {
                        console.warn("Erro de escuta:", event.error);
                        if (!recognition.active) micBtn.style.display = 'flex';
                    };

                    recognition.start();
                }

            } catch (err) {
                console.error('Erro na inicialização de hardware:', err);
                alert('Erro ao inicializar microfone.');
                micBtn.style.display = 'flex';
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (recognition && !isListening && !isSextaFeiraSpeaking && !isSearching && !recognition.active) {
                    try {
                        recognition.start();
                    } catch(e) {
                        micBtn.style.display = 'flex';
                    }
                }
            } else {
                if (recognition && isListening) {
                    try { recognition.stop(); } catch(e) {}
                }
            }
        });

        // ==========================================
        // 3D: CENA, CÂMERA, RENDERER
        // ==========================================
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.minDistance = 0.1;
        controls.maxDistance = 20;

        // ==========================================
        // ESFERA — anéis ondulados ciano + núcleo escuro
        // ==========================================
        const NOISE_GLSL = `
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i = floor(v + dot(v, C.yyy));
            vec3 x0 = v - i + dot(i, C.xxx);
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min(g.xyz, l.zxy);
            vec3 i2 = max(g.xyz, l.zxy);
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute(permute(permute(
                i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0) * 2.0 + 1.0;
            vec4 s1 = floor(b1) * 2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
            vec3 p0 = vec3(a0.xy, h.x);
            vec3 p1 = vec3(a0.zw, h.y);
            vec3 p2 = vec3(a1.xy, h.z);
            vec3 p3 = vec3(a1.zw, h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
        }
        `;

        const esferaGeometry = new THREE.IcosahedronGeometry(2.2, 7);
        const vCount = esferaGeometry.attributes.position.count;
        const randArr = new Float32Array(vCount);
        for (let i = 0; i < vCount; i++) randArr[i] = Math.random();
        esferaGeometry.setAttribute('aRand', new THREE.BufferAttribute(randArr, 1));

        const esferaUniforms = {
            uTime: { value: 0 },
            uPulse: { value: 0 },
            uGenio: { value: isGenioActive ? 1 : 0 }
        };

        const esferaMaterial = new THREE.ShaderMaterial({
            uniforms: esferaUniforms,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexShader: NOISE_GLSL + `
                uniform float uTime;
                uniform float uPulse;
                uniform float uGenio;
                attribute float aRand;
                varying vec3 vColor;
                varying float vAlpha;

                void main() {
                    vec3 dir = normalize(position);
                    float t = uTime;

                    // ondulação orgânica lenta
                    float n  = snoise(dir * 2.8 + vec3(0.0, t * 0.18, t * 0.12));
                    float n2 = snoise(dir * 5.0 - vec3(t * 0.1, 0.0, t * 0.14));

                    // duas famílias de anéis concêntricos ondulados
                    float r1 = sin(dir.y * 17.0 - t * 1.1 + n * 1.2);
                    float r2 = sin(dot(dir, vec3(0.6, 0.45, 0.66)) * 13.0 + t * 0.8 + n2 * 1.4);
                    float line = (1.0 - smoothstep(0.0, 0.055, abs(r1))) * 0.85
                               + (1.0 - smoothstep(0.0, 0.075, abs(r2))) * 0.55;

                    // respiração muito suave (sem pulso constante)
                    float disp = 0.04 + 0.07 * n + uPulse * 0.03;
                    vec3 p = dir * (2.2 + disp);

                    vec4 mv = modelViewMatrix * vec4(p, 1.0);

                    // centro escuro, bordas brilhantes
                    vec3 nView = normalize(normalMatrix * dir);
                    vec3 vView = normalize(-mv.xyz);
                    float centerFres = abs(dot(nView, vView));
                    float edge = 1.0 - centerFres * centerFres;

                    // paleta ciano/teal (verde no modo gênio)
                    vec3 dark  = mix(vec3(0.05, 0.30, 0.40), vec3(0.02, 0.30, 0.12), uGenio);
                    vec3 bright = mix(vec3(0.45, 0.85, 0.95), vec3(0.30, 1.00, 0.45), uGenio);
                    vec3 col = mix(dark, bright, 0.25 + 0.75 * line);

                    float intensity = (0.05 + line * (0.30 + 0.70 * edge)) * (1.0 + uPulse * 0.3);

                    vColor = col * (0.9 + 0.15 * n2);
                    vAlpha = clamp(intensity, 0.0, 1.0);

                    float size = (0.8 + 1.5 * aRand) * (1.0 + uPulse * 0.3);
                    gl_PointSize = size * (60.0 / -mv.z);
                    gl_Position = projectionMatrix * mv;
                }
            `,
            fragmentShader: `
                varying vec3 vColor;
                varying float vAlpha;
                void main() {
                    vec2 c = gl_PointCoord - 0.5;
                    float d = length(c) * 2.0;
                    float falloff = 1.0 - smoothstep(0.15, 1.0, d);
                    float core = (1.0 - smoothstep(0.0, 0.5, d)) * 0.7;
                    float a = (falloff * 0.8 + core) * vAlpha;
                    if (a < 0.01) discard;
                    gl_FragColor = vec4(vColor, a);
                }
            `
        });
        const esfera = new THREE.Points(esferaGeometry, esferaMaterial);
        scene.add(esfera);

        // ---- Fluxo de partículas: nascem no núcleo e fluem para fora ----
        function criarTexturaSuave() {
            const c = document.createElement('canvas');
            c.width = c.height = 64;
            const ctx = c.getContext('2d');
            const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            g.addColorStop(0, 'rgba(255,255,255,1)');
            g.addColorStop(0.35, 'rgba(255,255,255,0.55)');
            g.addColorStop(0.7, 'rgba(255,255,255,0.12)');
            g.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(c);
        }
        const softTex = criarTexturaSuave();

        const F = 650;
        const flowPos = new Float32Array(F * 3);
        const flowCol = new Float32Array(F * 3);
        const flowDirX = new Float32Array(F), flowDirY = new Float32Array(F), flowDirZ = new Float32Array(F);
        const flowSeed = new Float32Array(F);
        const flowT = new Float32Array(F);
        for (let i = 0; i < F; i++) {
            let dx = Math.random() * 2 - 1, dy = Math.random() * 2 - 1, dz = Math.random() * 2 - 1;
            const l = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
            flowDirX[i] = dx / l; flowDirY[i] = dy / l; flowDirZ[i] = dz / l;
            flowSeed[i] = Math.random();
            flowT[i] = Math.random();
        }
        const flowGeometry = new THREE.BufferGeometry();
        flowGeometry.setAttribute('position', new THREE.BufferAttribute(flowPos, 3));
        flowGeometry.setAttribute('color', new THREE.BufferAttribute(flowCol, 3));
        const flowMaterial = new THREE.PointsMaterial({
            size: 0.045, map: softTex, vertexColors: true,
            blending: THREE.AdditiveBlending, transparent: true, opacity: 0.9, depthWrite: false
        });
        const flow = new THREE.Points(flowGeometry, flowMaterial);
        scene.add(flow);

        // ---- Poeira orbital sutil ----
        const D = 300;
        const dustPos = new Float32Array(D * 3);
        const dustCol = new Float32Array(D * 3);
        const dustPalette = [[0.20, 0.55, 0.65], [0.15, 0.45, 0.60], [0.30, 0.60, 0.70]];
        for (let i = 0; i < D; i++) {
            let dx = Math.random() * 2 - 1, dy = Math.random() * 2 - 1, dz = Math.random() * 2 - 1;
            const l = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
            dx /= l; dy /= l; dz /= l;
            const r = 2.8 + Math.random() * 1.0;
            dustPos[i * 3] = dx * r; dustPos[i * 3 + 1] = dy * r; dustPos[i * 3 + 2] = dz * r;
            const pc = dustPalette[Math.floor(Math.random() * dustPalette.length)];
            const b = 0.5 + Math.random() * 0.5;
            dustCol[i * 3] = pc[0] * b; dustCol[i * 3 + 1] = pc[1] * b; dustCol[i * 3 + 2] = pc[2] * b;
        }
        const dustGeometry = new THREE.BufferGeometry();
        dustGeometry.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        dustGeometry.setAttribute('color', new THREE.BufferAttribute(dustCol, 3));
        const dustMaterial = new THREE.PointsMaterial({
            size: 0.07, map: softTex, vertexColors: true,
            blending: THREE.AdditiveBlending, transparent: true, opacity: 0.12, depthWrite: false
        });
        const dust = new THREE.Points(dustGeometry, dustMaterial);
        scene.add(dust);

        // ---- Estrelas de fundo ----
        const S = 550;
        const starPos = new Float32Array(S * 3);
        const starCol = new Float32Array(S * 3);
        for (let i = 0; i < S; i++) {
            let dx = Math.random() * 2 - 1, dy = Math.random() * 2 - 1, dz = Math.random() * 2 - 1;
            const l = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1;
            const r = 13 + Math.random() * 7;
            starPos[i * 3] = dx / l * r; starPos[i * 3 + 1] = dy / l * r; starPos[i * 3 + 2] = dz / l * r;
            const b = 0.5 + Math.random() * 0.5;
            starCol[i * 3] = 0.8 * b; starCol[i * 3 + 1] = 0.85 * b; starCol[i * 3 + 2] = 1.0 * b;
        }
        const starGeometry = new THREE.BufferGeometry();
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeometry.setAttribute('color', new THREE.BufferAttribute(starCol, 3));
        const starMaterial = new THREE.PointsMaterial({
            size: 0.035, vertexColors: true, transparent: true, opacity: 0.55, depthWrite: false
        });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        // ==========================================
        // GLOBO OSINT (God's Eye View - Inicia Oculto)
        // ==========================================
        const globeGeometry = new THREE.SphereGeometry(2.6, 32, 32);
        const globeMaterial = new THREE.MeshBasicMaterial({
            color: 0x40dcff,
            wireframe: true,
            transparent: true,
            opacity: 0,
            blending: THREE.AdditiveBlending
        });
        const globe = new THREE.Mesh(globeGeometry, globeMaterial);
        scene.add(globe);

        let isGlobeMode = false;

        // ==========================================
        // LOOP DE ANIMAÇÃO
        // ==========================================
        const clock = new THREE.Clock();
        let genioBlend = isGenioActive ? 1 : 0;
        let nebAngleY = 0, nebAngleX = 0;
        let timeAcc = 0;

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(0.05, clock.getDelta());
            const time = clock.elapsedTime;

            genioBlend += ((isGenioActive ? 1 : 0) - genioBlend) * 0.04;

            corBaseAtual.lerp(corBaseAlvo, 0.03);
            corAtivaAtual.lerp(corAtivaAlvo, 0.03);
            const cAtivaCSS = `rgb(${Math.round(corAtivaAtual.r * 255)}, ${Math.round(corAtivaAtual.g * 255)}, ${Math.round(corAtivaAtual.b * 255)})`;
            appHeader.style.textShadow = `0 0 12px ${cAtivaCSS}`;
            appHeader.style.borderBottomColor = cAtivaCSS;

            if (isSextaFeiraSpeaking) {
                currentVolume = (Math.sin(time * 20) * 0.5 + 0.5) * (Math.random() * 0.6 + 0.4) * 0.7;
            } else {
                currentVolume = 0;
            }
            smoothedVolume += (currentVolume - smoothedVolume) * 0.15;
            const activeVolume = Math.min(1.0, smoothedVolume * 2.5);

            // ---- Transição God's Eye View (Globo) ----
            const targetGlobeOpacity = isGlobeMode ? 0.4 : 0.0;
            const targetGlobeScale = isGlobeMode ? 1.0 : 0.1;
            globeMaterial.opacity += (targetGlobeOpacity - globeMaterial.opacity) * 0.05;
            globe.scale.setScalar( globe.scale.x + (targetGlobeScale - globe.scale.x) * 0.05 );
            globe.rotation.y = time * 0.05;
            globe.rotation.x = time * 0.02;

            // ---- Esfera: drift lento (acelera levemente com a voz) ----
            timeAcc += dt * (1 + activeVolume * 0.8);
            esferaUniforms.uTime.value = timeAcc;
            esferaUniforms.uPulse.value = activeVolume;
            esferaUniforms.uGenio.value = genioBlend;

            nebAngleY += dt * 0.10;
            nebAngleX += dt * 0.06;
            esfera.rotation.y = nebAngleY;
            esfera.rotation.x = nebAngleX;

            // ---- Fluxo de partículas do núcleo ----
            for (let i = 0; i < F; i++) {
                flowT[i] += dt * (0.07 + 0.10 * flowSeed[i]) * (1 + activeVolume * 1.5);
                if (flowT[i] > 1) flowT[i] -= 1;
                const t = flowT[i];
                const r = 0.15 + t * 2.3;
                const al = Math.sin(Math.PI * t);
                const i3 = i * 3;
                flowPos[i3] = flowDirX[i] * r;
                flowPos[i3 + 1] = flowDirY[i] * r;
                flowPos[i3 + 2] = flowDirZ[i] * r;
                flowCol[i3] = 0.35 * al * 0.6;
                flowCol[i3 + 1] = 0.80 * al * 0.6;
                flowCol[i3 + 2] = 0.90 * al * 0.6;
            }
            flowGeometry.attributes.position.needsUpdate = true;
            flowGeometry.attributes.color.needsUpdate = true;
            flow.rotation.y = time * 0.02;

            dust.rotation.y = time * 0.03;
            stars.rotation.y = time * 0.004;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
