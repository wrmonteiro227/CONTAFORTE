<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultron - Visualizador de IA</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        
        /* ==========================================
           HEADER PREMIUM (Glassmorphism e Glow Sutil)
           ========================================== */
        #app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            /* Fundo de vidro fosco profundo */
            background: rgba(5, 2, 12, 0.6); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: text-shadow 0.2s, border-color 0.2s;
        }

        /* BOTÃO DO MICROFONE */
        #mic-btn {
            position: absolute;
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%); 
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%; 
            cursor: pointer;
            font-size: 24px; 
            display: flex; /* Mudará dinamicamente para 'none' quando ouvindo e 'flex' quando pausado */
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        #mic-btn:active {
            transform: translateX(-50%) scale(0.9); 
        }

        /* ONDAS SONORAS */
        #waveform {
            position: absolute;
            bottom: 120px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0; 
            transition: opacity 0.3s ease;
            z-index: 5;
        }
        .bar {
            width: 4px;
            background-color: #ff0000;
            border-radius: 2px;
            animation: soundWave 0s infinite ease-in-out alternate;
        }
        .bar:nth-child(1) { height: 12px; animation-duration: 0.4s; }
        .bar:nth-child(2) { height: 28px; animation-duration: 0.25s; }
        .bar:nth-child(3) { height: 45px; animation-duration: 0.35s; }
        .bar:nth-child(4) { height: 22px; animation-duration: 0.2s; }
        .bar:nth-child(5) { height: 15px; animation-duration: 0.45s; }

        @keyframes soundWave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }

        /* ==========================================
           MENU LATERAL E TAREFAS
           ========================================== */
        #menu-btn {
            position: absolute;
            top: 10px; 
            left: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 22px;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }
        #menu-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        #side-menu {
            position: absolute;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(10, 5, 20, 0.95);
            backdrop-filter: blur(15px);
            border-right: 2px solid rgba(138, 43, 226, 0.3);
            z-index: 20;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #side-menu.open {
            left: 0;
        }
        
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .menu-header h2 {
            margin: 0;
            font-size: 20px;
        }
        #close-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }
        #close-btn:hover { color: white; }

        #main-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .nav-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover {
            background: rgba(138, 43, 226, 0.3);
        }

        #tasks-panel {
            display: none; 
        }
        #back-nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #back-nav-btn:hover { background: rgba(255,255,255,0.2); }

        #task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        #task-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #8a2be2;
            font-size: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ==========================================
           NOVO: PAINEL DE BUSCAS RECENTES (Internet)
           ========================================== */
        #pesquisas-panel {
            display: none;
        }
        .panel-back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .panel-back-btn:hover { background: rgba(255,255,255,0.2); }

        #pesquisa-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        #pesquisa-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #00d4ff;
            font-size: 14px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
            cursor: pointer;
        }
        #pesquisa-list .q {
            font-weight: bold;
            color: #ffffff;
        }
        #pesquisa-list .meta {
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            margin-top: 4px;
        }
        #pesquisa-list .sub {
            display: block;
            color: #7fd4ff;
            font-size: 12px;
            margin-top: 6px;
            text-decoration: underline;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    
    <!-- Novo Header Fixo -->
    <header id="app-header">Ultron</header>

    <!-- Botão do Menu Hambúrguer -->
    <button id="menu-btn" aria-label="Abrir Menu">☰</button>

    <!-- Menu Lateral Reestruturado -->
    <div id="side-menu">
        <div class="menu-header">
            <h2>Menu</h2>
            <button id="close-btn" aria-label="Fechar Menu">✖</button>
        </div>
        
        <ul id="main-nav">
            <li class="nav-item" id="nav-tarefas-btn">📝 Tarefas Diárias</li>
            <li class="nav-item" id="nav-pesquisas-btn">🌐 Buscas Recentes</li>
        </ul>

        <div id="tasks-panel">
            <button id="back-nav-btn">⬅ Voltar</button>
            <ul id="task-list"></ul>
        </div>

        <!-- NOVO: painel com o histórico das buscas na internet -->
        <div id="pesquisas-panel">
            <button class="panel-back-btn" id="back-pesquisas-btn">⬅ Voltar</button>
            <ul id="pesquisa-list"></ul>
        </div>
    </div>

    <!-- Interface Visual Principal -->
    <div id="waveform">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <button id="mic-btn" aria-label="Ativar IA">🎤</button>

    <script>
        // ==========================================
        // UI DO MENU E TAREFAS
        // ==========================================
        const menuBtn = document.getElementById('menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const closeBtn = document.getElementById('close-btn');
        const mainNav = document.getElementById('main-nav');
        const tasksPanel = document.getElementById('tasks-panel');
        const navTarefasBtn = document.getElementById('nav-tarefas-btn');
        const backNavBtn = document.getElementById('back-nav-btn');
        const taskListEl = document.getElementById('task-list');
        const micBtn = document.getElementById('mic-btn');

        // NOVO: elementos do painel de buscas
        const navPesquisasBtn = document.getElementById('nav-pesquisas-btn');
        const backPesquisasBtn = document.getElementById('back-pesquisas-btn');
        const pesquisasPanel = document.getElementById('pesquisas-panel');
        const pesquisaListEl = document.getElementById('pesquisa-list');

        let tarefas = JSON.parse(localStorage.getItem('utron.tasks.v1')) || []; 
        let pesquisas = JSON.parse(localStorage.getItem('utron.pesquisas.v1')) || [];

        function openSideMenu() {
            sideMenu.classList.add('open');
            mainNav.style.display = 'block';
            tasksPanel.style.display = 'none';
            pesquisasPanel.style.display = 'none';
        }

        function openTasksPanel() {
            mainNav.style.display = 'none';
            tasksPanel.style.display = 'block';
            pesquisasPanel.style.display = 'none';
        }

        function openPesquisasPanel() {
            mainNav.style.display = 'none';
            tasksPanel.style.display = 'none';
            pesquisasPanel.style.display = 'block';
        }

        menuBtn.addEventListener('click', openSideMenu);
        closeBtn.addEventListener('click', () => sideMenu.classList.remove('open'));
        
        navTarefasBtn.addEventListener('click', openTasksPanel);
        backNavBtn.addEventListener('click', () => {
            tasksPanel.style.display = 'none';
            mainNav.style.display = 'block';
        });

        navPesquisasBtn.addEventListener('click', openPesquisasPanel);
        backPesquisasBtn.addEventListener('click', () => {
            pesquisasPanel.style.display = 'none';
            mainNav.style.display = 'block';
        });

        function atualizarListaTarefas() {
            taskListEl.innerHTML = '';
            if (tarefas.length === 0) {
                taskListEl.innerHTML = '<li style="border-left-color: gray; color: gray;">Nenhum compromisso registrado para hoje.</li>';
            } else {
                tarefas.forEach((tarefa) => {
                    let li = document.createElement('li');
                    li.textContent = tarefa;
                    taskListEl.appendChild(li);
                });
            }
            localStorage.setItem('utron.tasks.v1', JSON.stringify(tarefas));
        }
        atualizarListaTarefas(); 

        // NOVO: renderiza o histórico de buscas (clicar abre a fonte no navegador)
        function atualizarListaPesquisas() {
            pesquisaListEl.innerHTML = '';
            if (pesquisas.length === 0) {
                pesquisaListEl.innerHTML = '<li style="border-left-color: gray; color: gray; cursor: default;">Nenhuma busca registrada ainda. Pergunte qualquer coisa para mim.</li>';
                return;
            }
            pesquisas.forEach((p) => {
                let li = document.createElement('li');
                let q = document.createElement('span');
                q.className = 'q';
                q.textContent = p.pergunta;
                let meta = document.createElement('div');
                meta.className = 'meta';
                meta.textContent = (p.fonte || '') + (p.data ? ' • ' + p.data : '');
                li.appendChild(q);
                li.appendChild(meta);
                if (p.lista && p.lista.length) {
                    p.lista.slice(0, 3).forEach((l) => {
                        let sub = document.createElement('span');
                        sub.className = 'sub';
                        sub.textContent = '↳ ' + l.titulo;
                        sub.addEventListener('click', (ev) => {
                            ev.stopPropagation();
                            window.open(l.url, '_blank');
                        });
                        li.appendChild(sub);
                    });
                }
                li.addEventListener('click', () => { if (p.url) window.open(p.url, '_blank'); });
                pesquisaListEl.appendChild(li);
            });
        }
        atualizarListaPesquisas();

        function salvarPesquisa(p) {
            pesquisas.unshift({
                pergunta: p.pergunta,
                fonte: p.fonte,
                titulo: p.titulo,
                url: p.url,
                lista: p.lista || [],
                data: new Date().toLocaleString('pt-BR')
            });
            pesquisas = pesquisas.slice(0, 8);
            localStorage.setItem('utron.pesquisas.v1', JSON.stringify(pesquisas));
            atualizarListaPesquisas();
        }

        // ==========================================
        // VARIÁVEIS GLOBAIS DE ESTADO E CORES
        // ==========================================
        let audioContext;
        let analyser;
        let dataArray;
        let currentVolume = 0;
        let smoothedVolume = 0;
        
        let recognition = null;
        let isUltronSpeaking = false; 
        let currentUtterance = null; 
        let isListening = false; // Controle de estado do microfone para resgate de sessão
        let isSearching = false; // NOVO: trava anti-duplo-comando durante buscas

        let nomeUsuario = localStorage.getItem('utron.name') || "senhor";
        
        // --- NOVO: Verifica na memória se o Modo Gênio estava ativo ao carregar a página
        let isGenioActive = localStorage.getItem('utron.mode') === 'genio'; 

        const corBaseNormal = new THREE.Color(0x8a2be2); 
        const corAtivaNormal = new THREE.Color(0xff0000); 
        const corBaseGenio = new THREE.Color(0x004d00); 
        const corAtivaGenio = new THREE.Color(0x33ff33); 

        // Carrega as cores corretas baseadas na memória
        const corBaseAlvo = new THREE.Color(isGenioActive ? 0x004d00 : 0x8a2be2);
        const corAtivaAlvo = new THREE.Color(isGenioActive ? 0x33ff33 : 0xff0000);
        const corBaseAtual = new THREE.Color(isGenioActive ? 0x004d00 : 0x8a2be2);
        const corAtivaAtual = new THREE.Color(isGenioActive ? 0x33ff33 : 0xff0000);

        const waveform = document.getElementById('waveform'); 
        const appHeader = document.getElementById('app-header'); 

        window.speechSynthesis.onvoiceschanged = () => {
            window.speechSynthesis.getVoices();
        };

        // ==========================================
        // FUNÇÃO DE FALA ROBUSTA
        // ==========================================
        function responderComoUltron(fraseDaVez, onEndCallback = null) {
            if (isUltronSpeaking) return;
            
            isUltronSpeaking = true;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            
            waveform.style.opacity = '1';
            window.speechSynthesis.cancel(); 

            currentUtterance = new SpeechSynthesisUtterance(fraseDaVez);
            currentUtterance.lang = 'pt-BR';
            currentUtterance.pitch = 0.2; 
            currentUtterance.rate = 0.85; 
            currentUtterance.volume = 1.0; 

            const vozes = window.speechSynthesis.getVoices();
            const vozMasculinaOuPremium = vozes.find(voz => 
                (voz.lang.includes('pt-BR') || voz.lang.includes('pt-PT')) && 
                (voz.name.includes('Premium') || voz.name.includes('Daniel') || voz.name.includes('Thiago') || voz.name.includes('Google'))
            ) || vozes.find(voz => voz.lang.includes('pt')); 

            if (vozMasculinaOuPremium) {
                currentUtterance.voice = vozMasculinaOuPremium;
            }

            const finalizarFala = () => {
                isUltronSpeaking = false;
                waveform.style.opacity = '0'; 
                if (typeof onEndCallback === 'function') {
                    onEndCallback();
                } else if (recognition) {
                    try { recognition.start(); } catch(e) { micBtn.style.display = 'flex'; } 
                }
            };

            currentUtterance.onend = finalizarFala;
            currentUtterance.onerror = finalizarFala;

            window.speechSynthesis.speak(currentUtterance);
        }

        // NOVO: fala "prometida" — resolve quando a fala termina,
        // permitindo encadear: falar → buscar na web → falar o resultado
        function falar(frase) {
            return new Promise((resolve) => {
                if (isUltronSpeaking) { resolve(); return; }
                responderComoUltron(frase, () => {
                    resolve();
                    // Quando a busca já terminou, religa o microfone
                    if (recognition && !isSearching) {
                        try { recognition.start(); } catch(e) { micBtn.style.display = 'flex'; }
                    }
                });
            });
        }

        // ==========================================
        // NOVO: MÓDULO DE INTERNET (fontes abertas, sem chave, sem custo)
        // - Wikipedia pt-BR  → conhecimentos, "o que é / quem foi"
        // - DuckDuckGo IA    → respostas rápidas, conversões, curiosidades
        // - Open-Meteo       → clima e geocoding (sem chave, CORS liberado)
        // Tudo roda direto no navegador do usuário: nenhum segredo em servidor.
        // ==========================================
        async function httpGetJSON(url, timeoutMs = 6000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function buscarWikipedia(consulta) {
            const q = encodeURIComponent(consulta);
            const busca = await httpGetJSON(
                `https://pt.wikipedia.org/w/api.php?action=query&list=search&srsearch=${q}&srlimit=5&format=json&origin=*`
            );
            const resultados = (busca.query && busca.query.search) || [];
            if (!resultados.length) return null;
            const primeiro = resultados[0];

            let extResumo = '';
            try {
                const ext = await httpGetJSON(
                    `https://pt.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(primeiro.title)}&format=json&origin=*`
                );
                const paginas = (ext.query && ext.query.pages) ? Object.values(ext.query.pages) : [];
                extResumo = (paginas[0] && paginas[0].extract) || '';
            } catch (e) { /* segue com o snippet da busca */ }

            const resumo = (extResumo || primeiro.snippet || '').replace(/<[^>]*>/g, '');
            return {
                fonte: 'Wikipédia',
                titulo: primeiro.title,
                resumo: resumo,
                url: `https://pt.wikipedia.org/wiki/${encodeURIComponent(primeiro.title.replace(/ /g, '_'))}`,
                lista: resultados.slice(0, 5).map(r => ({
                    titulo: r.title,
                    url: `https://pt.wikipedia.org/wiki/${encodeURIComponent(r.title.replace(/ /g, '_'))}`
                }))
            };
        }

        async function buscarDuckDuckGo(consulta) {
            const q = encodeURIComponent(consulta);
            const d = await httpGetJSON(
                `https://api.duckduckgo.com/?q=${q}&format=json&no_html=1&skip_disambig=1&kl=br-pt`
            );
            let resumo = d.AbstractText || d.Answer || d.Definition || '';
            if (!resumo && d.RelatedTopics && d.RelatedTopics.length) {
                const t = d.RelatedTopics.find(x => x && x.Text);
                if (t) resumo = t.Text;
            }
            if (!resumo) return null;
            return {
                fonte: 'DuckDuckGo',
                titulo: d.Heading || consulta,
                resumo: resumo,
                url: d.AbstractURL || `https://duckduckgo.com/?q=${q}`,
                lista: []
            };
        }

        function climaDescricao(codigo) {
            const mapa = {
                0: 'céu limpo', 1: 'predominantemente limpo', 2: 'parcialmente nublado', 3: 'nublado',
                45: 'nevoeiro', 48: 'nevoeiro com geada',
                51: 'garoa fraca', 53: 'garoa', 55: 'garoa intensa',
                56: 'garoa congelante', 57: 'garoa congelante intensa',
                61: 'chuva fraca', 63: 'chuva moderada', 65: 'chuva forte',
                66: 'chuva congelante fraca', 67: 'chuva congelante forte',
                71: 'neve fraca', 73: 'neve moderada', 75: 'neve forte', 77: 'grãos de neve',
                80: 'pancadas de chuva fracas', 81: 'pancadas de chuva moderadas', 82: 'pancadas de chuva violentas',
                85: 'pancadas de neve fracas', 86: 'pancadas de neve fortes',
                95: 'trovoada', 96: 'trovoada com granizo fraco', 99: 'trovoada com granizo forte'
            };
            return mapa[codigo] || 'condições não informadas';
        }

        async function buscarClima(cidade) {
            let lugar = null;
            const geo = await httpGetJSON(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt&format=json`
            );
            if (geo.results && geo.results.length) {
                lugar = geo.results[0];
            } else if (cidade.includes(' ')) {
                // segunda tentativa só com o primeiro nome (ex.: "salvador ba" → "salvador")
                const geo2 = await httpGetJSON(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade.split(' ')[0])}&count=1&language=pt&format=json`
                );
                if (geo2.results && geo2.results.length) lugar = geo2.results[0];
            }
            if (!lugar) throw new Error('cidade não encontrada');

            const f = await httpGetJSON(
                `https://api.open-meteo.com/v1/forecast?latitude=${lugar.latitude}&longitude=${lugar.longitude}` +
                `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code` +
                `&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`
            );
            const c = f.current;
            const d = f.daily;
            const resumo = `Agora: ${climaDescricao(c.weather_code)}, ${Math.round(c.temperature_2)} graus, sensação de ${Math.round(c.apparent_temperature)} graus, umidade de ${Math.round(c.relative_humidity_2m)} por cento. Hoje a máxima é de ${Math.round(d.temperature_2m_max[0])} e a mínima de ${Math.round(d.temperature_2m_min[0])} graus.`;
            return {
                fonte: 'Meteorologia aberta',
                titulo: 'Clima em ' + lugar.name,
                resumo: resumo,
                url: `https://open-meteo.com/?latitude=${lugar.latitude}&longitude=${lugar.longitude}`,
                lista: []
            };
        }

        // Extrai a cidade de frases como "qual o clima em cachoeira"
        function extrairCidade(transcript) {
            if (!/\b(clima|tempo|previs[ãa]o|chove|chover|chovendo|chuva)\b/i.test(transcript)) return null;
            const m = transcript.match(/\b(?:em|no|na|de|do|da)\s+([a-zà-ö]+(?:\s+[a-zà-ö]+)?)(?:\s+(?:hoje|amanh[ãa]|semana|pra semana|nesta semana))?\s*[.!?]*\s*$/i);
            return m ? m[1].trim() : null;
        }

        // Corta o texto em fronteira de frase para a fala ficar natural
        function prepararParaFala(texto, max) {
            texto = texto.replace(/\s+/g, ' ').trim();
            if (texto.length <= max) return texto;
            let corte = texto.slice(0, max);
            const ponto = corte.lastIndexOf('.');
            if (ponto > max * 0.5) corte = corte.slice(0, ponto);
            return corte + '...';
        }

        // Fluxo completo: anuncia → busca → responde (e salva no histórico)
        async function processarPesquisa(consulta) {
            if (isSearching) return;
            isSearching = true;
            await falar(`Consultando a rede, ${nomeUsuario}.`);

            let mensagemFinal;
            try {
                let resultado = null;
                const cidade = extrairCidade(consulta);
                if (cidade) {
                    try { resultado = await buscarClima(cidade); } catch (e) { resultado = null; }
                }
                if (!resultado) {
                    try { resultado = await buscarWikipedia(consulta); } catch (e) { resultado = null; }
                }
                if (!resultado) {
                    try { resultado = await buscarDuckDuckGo(consulta); } catch (e) { resultado = null; }
                }

                if (resultado) {
                    // Modo Gênio = resposta mais longa (mais contexto)
                    const tamanho = isGenioActive ? 700 : 400;
                    salvarPesquisa({
                        pergunta: consulta,
                        fonte: resultado.fonte,
                        titulo: resultado.titulo,
                        url: resultado.url,
                        lista: resultado.lista
                    });
                    mensagemFinal = `Encontrei, ${nomeUsuario}. ${resultado.fonte}: ${resultado.titulo}. ${prepararParaFala(resultado.resumo, tamanho)}`;
                } else {
                    mensagemFinal = `Procurei em toda a rede, ${nomeUsuario}, mas não encontrei nada sobre isso. Pode tentar reformular?`;
                }
            } catch (e) {
                console.warn('Falha na busca:', e);
                mensagemFinal = `Houve falha na conexão com a rede, ${nomeUsuario}. Verifique sua internet, por favor.`;
            }

            isSearching = false;
            await falar(mensagemFinal);
        }

        // ==========================================
        // CÉREBRO: MICROFONE E ROTEADOR DE INTENTS
        // ==========================================
        micBtn.addEventListener('click', async () => {
            try {
                const unlockSpeech = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockSpeech);

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; 
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition = new SpeechRecognition();
                    recognition.continuous = true; 
                    recognition.interimResults = false;
                    recognition.lang = 'pt-BR';

                    // Controle de Estado para o Resgate de Sessão
                    recognition.onstart = () => {
                        isListening = true;
                        micBtn.style.display = 'none';
                    };

                    recognition.onresult = async (event) => {
                        const lastResult = event.results[event.results.length - 1];
                        const transcript = lastResult[0].transcript.trim().toLowerCase();
                        if (!transcript) return;

                        // NOVO: ignora falas capturadas durante uma busca em andamento
                        if (isSearching) return;

                        console.log("Comando detectado:", transcript);

                        const desativarGenioMatch = transcript.match(/desativar modo gênio|desligar modo gênio|desativar modo genio|desligar modo genio|desativa o modo gênio|desliga o gênio|sair do modo gênio|voltar ao normal/i);
                        const ativarGenioMatch = transcript.match(/ativar modo gênio|ativar modo genio|ligar modo gênio/i) || (transcript.includes('modo gênio') && !transcript.includes('desativar') && !transcript.includes('desligar') && !transcript.includes('sair'));

                        const registroRegex = /(?:registrar|salvar|anotar|registre|anote|salve)(?:\s+(?:nova tarefa|tarefa|compromissos?|que|um compromisso|uma tarefa))?\s+(.+)/i;
                        const registroMatch = transcript.match(registroRegex);

                        const leituraTarefasRegex = /quais (?:são as )?tarefas|o que tenho para fazer|o que há para hoje|ler tarefas|meus compromissos/i;
                        const leituraMatch = transcript.match(leituraTarefasRegex);

                        const nomeRegex = /(?:meu nome [ée]|me chamo)\s+([a-zàáâãéèêíïóôõöúçñ]+)/i;
                        const nomeMatch = transcript.match(nomeRegex);

                        let mathTranscript = transcript
                            .replace(/\bzero\b/g, '0').replace(/\bum\b/g, '1').replace(/\bdois\b/g, '2').replace(/\btrês\b/g, '3')
                            .replace(/\bquatro\b/g, '4').replace(/\bcinco\b/g, '5').replace(/\bseis\b/g, '6').replace(/\bsete\b/g, '7')
                            .replace(/\boito\b/g, '8').replace(/\bnove\b/g, '9').replace(/\bdez\b/g, '10');
                            
                        const mathRegex = /(\d+(?:[.,]\d+)?)\s*(mais|somada? a?|\+|menos|-|vezes|\*|x|multiplicado(?: por)?|dividido(?: por| para| pra)?|\/)\s*(\d+(?:[.,]\d+)?)/i;
                        const mathMatch = mathTranscript.match(mathRegex);

                        // ROTEAMENTO
                        if (desativarGenioMatch) {
                            if (!isGenioActive) {
                                responderComoUltron("O modo gênio já está desligado.");
                            } else {
                                isGenioActive = false; 
                                localStorage.setItem('utron.mode', 'normal'); // Salva na memória
                                responderComoUltron("Desativando modo gênio. Retornando aos parâmetros normais.", () => {
                                    corBaseAlvo.copy(corBaseNormal);
                                    corAtivaAlvo.copy(corAtivaNormal);
                                });
                            }
                        }
                        else if (ativarGenioMatch) {
                            if (isGenioActive) {
                                responderComoUltron(`O modo gênio já está ligado, ${nomeUsuario}.`);
                            } else {
                                isGenioActive = true; 
                                localStorage.setItem('utron.mode', 'genio'); // Salva na memória
                                responderComoUltron("Ativando modo gênio.", () => {
                                    corBaseAlvo.copy(corBaseGenio);
                                    corAtivaAlvo.copy(corAtivaGenio);
                                    setTimeout(() => { responderComoUltron("Modo gênio ativado."); }, 1200); 
                                });
                            }
                        }
                        else if (registroMatch) {
                            let novaTarefa = registroMatch[1].trim();
                            novaTarefa = novaTarefa.charAt(0).toUpperCase() + novaTarefa.slice(1);
                            
                            tarefas.push(novaTarefa); 
                            atualizarListaTarefas();  
                            
                            sideMenu.classList.add('open'); 
                            openTasksPanel(); 
                            
                            responderComoUltron(`Anotado, ${nomeUsuario}. Registrei a seguinte tarefa: ${novaTarefa}.`);
                        }
                        else if (leituraMatch) {
                            sideMenu.classList.add('open'); 
                            openTasksPanel();
                            if (tarefas.length === 0) {
                                responderComoUltron(`${nomeUsuario}, você não tem nenhuma tarefa ou compromisso registrado para hoje.`);
                            } else {
                                let textoTarefas = tarefas.join(". ");
                                let plural = tarefas.length === 1 ? 'tarefa registrada' : 'tarefas registradas';
                                responderComoUltron(`Você tem ${tarefas.length} ${plural}. São elas: ${textoTarefas}.`);
                            }
                        }
                        else if (nomeMatch) {
                            nomeUsuario = nomeMatch[1].charAt(0).toUpperCase() + nomeMatch[1].slice(1);
                            localStorage.setItem('utron.name', nomeUsuario); 
                            responderComoUltron(`Entendido. A partir de agora, o chamarei de ${nomeUsuario}.`);
                        }
                        else if (transcript.includes('capacidade máxima') || transcript.includes('capacidade maxima')) {
                            responderComoUltron(`${nomeUsuario}, minha rede neural agora está conectada à internet aberta. Posso consultar a Wikipédia, responder perguntas gerais e verificar o clima em qualquer cidade — tudo sem depender de serviços pagos.`);
                        }
                        else if (transcript.includes('horas') || transcript.includes('hora')) {
                            const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                            responderComoUltron(`Agora são exatamente ${time}, ${nomeUsuario}.`);
                        }
                        else if (mathMatch) {
                            let num1 = parseFloat(mathMatch[1].replace(',', '.'));
                            let num2 = parseFloat(mathMatch[3].replace(',', '.'));
                            let operador = mathMatch[2].toLowerCase();
                            let resultado;

                            if (operador.includes('mais') || operador.includes('somad') || operador === '+') { 
                                resultado = num1 + num2; 
                            } else if (operador.includes('menos') || operador === '-') { 
                                resultado = num1 - num2; 
                            } else if (operador.includes('vezes') || operador.includes('multiplicado') || operador === '*' || operador === 'x') { 
                                resultado = num1 * num2; 
                            } else if (operador.includes('dividido') || operador === '/') { 
                                if (num2 === 0) {
                                    responderComoUltron(`Não é possível dividir por zero, ${nomeUsuario}.`);
                                    return;
                                }
                                resultado = num1 / num2; 
                            }

                            if (resultado !== undefined) {
                                if (!Number.isInteger(resultado)) resultado = resultado.toFixed(2);
                                responderComoUltron(`${num1} ${operador} ${num2} é igual a ${resultado}.`);
                            }
                        }
                        else if (transcript.includes('ultron') || transcript.includes('outro') || transcript.includes('olá') || transcript.includes('ola')) {
                            responderComoUltron(`Olá, ${nomeUsuario}. O que deseja hoje? Todos os sistemas estão operacionais.`);
                        } 
                        // NOVO: qualquer coisa que não casar com um comando conhecido
                        // agora vai para a BUSCA NA INTERNET (Wikipédia → DuckDuckGo)
                        else {
                            await processarPesquisa(transcript);
                        }
                    };

                    recognition.onend = () => {
                        isListening = false;
                        if (!isUltronSpeaking && !isSearching && recognition) {
                            try { 
                                recognition.start(); 
                            } catch(e) {
                                // Se der erro ao reiniciar (ex: aba em 2º plano no Safari), força mostrar o botão
                                micBtn.style.display = 'flex';
                            }
                        }
                    };
                    
                    recognition.onerror = (event) => {
                        console.warn("Erro de escuta:", event.error);
                        // Restaura o botão na interface caso falhe a permissão ou rede
                        micBtn.style.display = 'flex';
                    };

                    recognition.start();
                }

            } catch (err) {
                console.error('Erro na inicialização de hardware:', err);
                alert('Erro ao inicializar microfone.');
                micBtn.style.display = 'flex';
            }
        });

        // --- SISTEMA DE RESGATE DE SESSÃO (APP EM SEGUNDO PLANO) ---
        // Se você minimizar o Safari e voltar, ele tenta recuperar a audição ou devolver o botão
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (recognition && !isListening && !isUltronSpeaking && !isSearching) {
                    try { 
                        recognition.start(); 
                    } catch(e) {
                        micBtn.style.display = 'flex';
                    }
                }
            } else {
                if (recognition && isListening) {
                    try { recognition.stop(); } catch(e) {}
                }
            }
        });

        // ==========================================
        // SETUP DE CENA, CÂMERA E RENDERER
        // ==========================================
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enablePan = false; 
        controls.minDistance = 0.1; 
        controls.maxDistance = 20; 

        // ==========================================
        // GEOMETRIA E PARTICULAS
        // ==========================================
        const radius = 2.2;
        const detail = 18; 
        const geometry = new THREE.IcosahedronGeometry(radius, detail);

        const positionAttribute = geometry.attributes.position;
        const vertexCount = positionAttribute.count;
        
        const originalPositions = new Float32Array(vertexCount * 3);
        const randomOffsets = new Float32Array(vertexCount);
        const randomScales = new Float32Array(vertexCount); 
        const baseRandomness = new Float32Array(vertexCount); 
        const colors = new Float32Array(vertexCount * 3);
        const tempColor = new THREE.Color();

        for (let i = 0; i < vertexCount; i++) {
            const x = positionAttribute.getX(i);
            const y = positionAttribute.getY(i);
            const z = positionAttribute.getZ(i);
            
            originalPositions[i * 3] = x;
            originalPositions[i * 3 + 1] = y;
            originalPositions[i * 3 + 2] = z;

            randomOffsets[i] = Math.random() * Math.PI * 2;
            randomScales[i] = 0.5 + Math.random() * 2.0; 
            baseRandomness[i] = Math.random() * 0.3; 

            colors[i * 3] = corBaseAtual.r;
            colors[i * 3 + 1] = corBaseAtual.g;
            colors[i * 3 + 2] = corBaseAtual.b;
        }

        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.025, 
            vertexColors: true,
            blending: THREE.NormalBlending, 
            transparent: true,
            opacity: 0.85, 
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // ==========================================
        // LOOP DE RENDERIZAÇÃO E ANIMAÇÃO
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            controls.update(); 

            // Interpolação suave para troca de cor
            corBaseAtual.lerp(corBaseAlvo, 0.03);
            corAtivaAtual.lerp(corAtivaAlvo, 0.03);

            // Sincroniza dinamicamente o brilho (Glow) do Header com a cor exata da esfera
            const cAtivaCSS = `rgb(${Math.round(corAtivaAtual.r * 255)}, ${Math.round(corAtivaAtual.g * 255)}, ${Math.round(corAtivaAtual.b * 255)})`;
            appHeader.style.textShadow = `0 0 12px ${cAtivaCSS}`;
            appHeader.style.borderBottomColor = cAtivaCSS;

            points.rotation.y = elapsedTime * 0.12;
            points.rotation.x = elapsedTime * 0.08;

            if (isUltronSpeaking) {
                currentVolume = (Math.sin(elapsedTime * 20) * 0.5 + 0.5) * (Math.random() * 0.6 + 0.4) * 0.7;
            } else {
                currentVolume = 0;
            }

            smoothedVolume += (currentVolume - smoothedVolume) * 0.15;
            let activeVolume = Math.min(1.0, smoothedVolume * 2.5); 

            const positions = points.geometry.attributes.position;
            const colorAttribute = points.geometry.attributes.color; 
            const normalVector = new THREE.Vector3();
            
            for (let i = 0; i < vertexCount; i++) {
                const ox = originalPositions[i * 3];
                const oy = originalPositions[i * 3 + 1];
                const oz = originalPositions[i * 3 + 2];

                normalVector.set(ox, oy, oz).normalize();
                
                const noise = Math.sin(elapsedTime * 2.5 + randomOffsets[i] + ox * 1.5) * 0.5 + 0.5;
                
                const baseDeformation = (0.08 + baseRandomness[i]) * noise;
                const activeDeformation = activeVolume * 0.45 * noise * randomScales[i]; 
                const totalDeformation = baseDeformation + activeDeformation;
                
                positions.setXYZ(
                    i, 
                    ox + normalVector.x * totalDeformation,
                    oy + normalVector.y * totalDeformation,
                    oz + normalVector.z * totalDeformation
                );

                const colorLerpFactor = Math.min(1.0, activeDeformation * 2.5); 
                tempColor.copy(corBaseAtual).lerp(corAtivaAtual, colorLerpFactor);
                
                colorAttribute.setXYZ(i, tempColor.r, tempColor.g, tempColor.b);
            }
            
            positions.needsUpdate = true;
            colorAttribute.needsUpdate = true; 

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
