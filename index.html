<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de IA - Esfera Tecnológica</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        
        /* BOTÃO DO MICROFONE */
        #mic-btn {
            position: absolute;
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%); 
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%; 
            cursor: pointer;
            font-size: 24px; 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        #mic-btn:active {
            transform: translateX(-50%) scale(0.9); 
        }

        /* ONDAS SONORAS */
        #waveform {
            position: absolute;
            bottom: 120px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0; 
            transition: opacity 0.3s ease;
            z-index: 5;
        }
        .bar {
            width: 4px;
            background-color: #ff0000;
            border-radius: 2px;
            animation: soundWave 0s infinite ease-in-out alternate;
        }
        .bar:nth-child(1) { height: 12px; animation-duration: 0.4s; }
        .bar:nth-child(2) { height: 28px; animation-duration: 0.25s; }
        .bar:nth-child(3) { height: 45px; animation-duration: 0.35s; }
        .bar:nth-child(4) { height: 22px; animation-duration: 0.2s; }
        .bar:nth-child(5) { height: 15px; animation-duration: 0.45s; }

        @keyframes soundWave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }

        /* ==========================================
           NOVA UI: MENU LATERAL E TAREFAS 
           ========================================== */
        #menu-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(138, 43, 226, 0.2);
            color: #ffffff;
            border: 1px solid rgba(138, 43, 226, 0.5);
            width: 45px;
            height: 45px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 24px;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
            transition: background 0.3s;
        }
        #menu-btn:hover {
            background: rgba(138, 43, 226, 0.5);
        }

        #side-menu {
            position: absolute;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(10, 5, 20, 0.85);
            backdrop-filter: blur(15px);
            border-right: 2px solid rgba(138, 43, 226, 0.5);
            z-index: 20;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #side-menu.open {
            left: 0;
        }
        
        #close-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 24px;
            cursor: pointer;
            float: right;
            transition: color 0.2s;
        }
        #close-btn:hover {
            color: white;
        }

        .menu-tabs {
            margin-top: 50px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            display: flex;
            gap: 15px;
        }
        .tab-btn {
            background: none;
            border: none;
            color: #8a2be2;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            padding: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-content {
            margin-top: 20px;
            height: calc(100vh - 150px);
            overflow-y: auto;
        }
        
        #task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #task-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #8a2be2;
            font-size: 15px;
            line-height: 1.4;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
    <!-- CDNs Estáveis para evitar bloqueios na Vercel/Safari -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    
    <!-- Botão do Menu -->
    <button id="menu-btn" aria-label="Abrir Menu">☰</button>

    <!-- Menu Lateral -->
    <div id="side-menu">
        <button id="close-btn" aria-label="Fechar Menu">✖</button>
        <div class="menu-tabs">
            <button class="tab-btn active">Tarefas</button>
        </div>
        <div class="tab-content">
            <ul id="task-list">
                <!-- As tarefas aparecerão aqui via JavaScript -->
            </ul>
        </div>
    </div>

    <!-- Interface Visual Principal -->
    <div id="waveform">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <button id="mic-btn" aria-label="Ativar IA">🎤</button>

    <script>
        // ==========================================
        // UI DO MENU E DADOS DE TAREFAS
        // ==========================================
        const menuBtn = document.getElementById('menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const closeBtn = document.getElementById('close-btn');
        const taskListEl = document.getElementById('task-list');

        // Tenta resgatar tarefas salvas no navegador
        let tarefas = JSON.parse(localStorage.getItem('utron.tasks.v1')) || []; 

        menuBtn.addEventListener('click', () => sideMenu.classList.add('open'));
        closeBtn.addEventListener('click', () => sideMenu.classList.remove('open'));

        // Atualiza o painel visual de tarefas e salva no cache
        function atualizarListaTarefas() {
            taskListEl.innerHTML = '';
            if (tarefas.length === 0) {
                taskListEl.innerHTML = '<li style="border-left-color: gray; color: gray;">Nenhum compromisso registrado para hoje.</li>';
            } else {
                tarefas.forEach((tarefa) => {
                    let li = document.createElement('li');
                    li.textContent = tarefa;
                    taskListEl.appendChild(li);
                });
            }
            localStorage.setItem('utron.tasks.v1', JSON.stringify(tarefas));
        }
        atualizarListaTarefas(); 

        // ==========================================
        // VARIÁVEIS GLOBAIS DE ESTADO E CORES
        // ==========================================
        let audioContext;
        let analyser;
        let dataArray;
        let currentVolume = 0;
        let smoothedVolume = 0;
        
        let recognition = null;
        let isUltronSpeaking = false; 
        let currentUtterance = null; 

        // Tenta lembrar do seu nome (Memória via LocalStorage)
        let nomeUsuario = localStorage.getItem('utron.name') || "senhor";

        // Variável de verificação do Modo Gênio
        let isGenioActive = false; 

        const corBaseNormal = new THREE.Color(0x8a2be2); 
        const corAtivaNormal = new THREE.Color(0xff0000); 
        const corBaseGenio = new THREE.Color(0x004d00); 
        const corAtivaGenio = new THREE.Color(0x33ff33); 

        const corBaseAlvo = new THREE.Color(0x8a2be2);
        const corAtivaAlvo = new THREE.Color(0xff0000);
        const corBaseAtual = new THREE.Color(0x8a2be2);
        const corAtivaAtual = new THREE.Color(0xff0000);

        const micBtn = document.getElementById('mic-btn');
        const waveform = document.getElementById('waveform'); 

        // ==========================================
        // FUNÇÃO DE FALA ROBUSTA
        // ==========================================
        function responderComoUltron(fraseDaVez, onEndCallback = null) {
            if (isUltronSpeaking) return;
            
            isUltronSpeaking = true;
            if (recognition) {
                try { recognition.stop(); } catch(e) {}
            }
            
            waveform.style.opacity = '1';
            window.speechSynthesis.cancel(); 

            currentUtterance = new SpeechSynthesisUtterance(fraseDaVez);
            currentUtterance.lang = 'pt-BR';
            currentUtterance.pitch = 0.2; 
            currentUtterance.rate = 0.85; 
            currentUtterance.volume = 1.0; 

            const vozes = window.speechSynthesis.getVoices();
            const vozMasculinaOuPremium = vozes.find(voz => 
                (voz.lang.includes('pt-BR') || voz.lang.includes('pt-PT')) && 
                (voz.name.includes('Premium') || voz.name.includes('Daniel') || voz.name.includes('Thiago') || voz.name.includes('Google'))
            ) || vozes.find(voz => voz.lang.includes('pt')); 

            if (vozMasculinaOuPremium) {
                currentUtterance.voice = vozMasculinaOuPremium;
            }

            const finalizarFala = () => {
                isUltronSpeaking = false;
                waveform.style.opacity = '0'; 
                if (typeof onEndCallback === 'function') {
                    onEndCallback();
                } else if (recognition) {
                    try { recognition.start(); } catch(e) {} 
                }
            };

            currentUtterance.onend = finalizarFala;
            currentUtterance.onerror = finalizarFala;

            window.speechSynthesis.speak(currentUtterance);
        }

        // ==========================================
        // ATIVAÇÃO DO MICROFONE E RECONHECIMENTO
        // ==========================================
        micBtn.addEventListener('click', async () => {
            try {
                const unlockSpeech = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockSpeech);

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; 
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition = new SpeechRecognition();
                    recognition.continuous = true; 
                    recognition.interimResults = false;
                    recognition.lang = 'pt-BR';

                    recognition.onresult = (event) => {
                        const lastResult = event.results[event.results.length - 1];
                        const transcript = lastResult[0].transcript.trim().toLowerCase();
                        console.log("Comando detectado:", transcript);

                        // --- TRATAMENTO DOS COMANDOS (REGEX) ---
                        
                        // 1. Controle de Modos
                        const desativarGenioMatch = transcript.match(/desativar modo gênio|desligar modo gênio|desativar modo genio|desligar modo genio|desativa o modo gênio|desliga o gênio|sair do modo gênio/i);
                        const ativarGenioMatch = transcript.match(/ativar modo gênio|ativar modo genio|ligar modo gênio/i) || (transcript.includes('modo gênio') && !transcript.includes('desativar') && !transcript.includes('desligar') && !transcript.includes('sair'));

                        // 2. Registro e Leitura de Tarefas
                        const registroRegex = /(?:registrar|salvar|anotar|registre|anote|salve)(?:\s+(?:nova tarefa|tarefa|compromissos?|que|um compromisso|uma tarefa))?\s+(.+)/i;
                        const registroMatch = transcript.match(registroRegex);

                        const leituraTarefasRegex = /quais (?:são as )?tarefas|o que tenho para fazer|o que há para hoje|ler tarefas|meus compromissos/i;
                        const leituraMatch = transcript.match(leituraTarefasRegex);

                        // 3. Memória de Nome (A REGEX CORRIGIDA ESTÁ AQUI!)
                        const nomeRegex = /(?:meu nome [ée]|me chamo)\s+([a-zàáâãéèêíïóôõöúçñ]+)/i;
                        const nomeMatch = transcript.match(nomeRegex);

                        // 4. Tradutor Matemático (Converte números por extenso para dígitos numéricos antes de tentar fazer a conta)
                        let mathTranscript = transcript
                            .replace(/\bzero\b/g, '0').replace(/\bum\b/g, '1').replace(/\bdois\b/g, '2').replace(/\btrês\b/g, '3')
                            .replace(/\bquatro\b/g, '4').replace(/\bcinco\b/g, '5').replace(/\bseis\b/g, '6').replace(/\bsete\b/g, '7')
                            .replace(/\boito\b/g, '8').replace(/\bnove\b/g, '9').replace(/\bdez\b/g, '10');
                            
                        const mathRegex = /(\d+(?:[.,]\d+)?)\s*(mais|somado a|\+|menos|-|vezes|\*|x|multiplicado(?: por)?|dividido(?: por| para)?|\/)\s*(\d+(?:[.,]\d+)?)/i;
                        const mathMatch = mathTranscript.match(mathRegex);

                        // --- FUNIL DE PRIORIDADES (LÓGICA DO CÉREBRO) ---

                        if (desativarGenioMatch) {
                            if (!isGenioActive) {
                                responderComoUltron("O modo gênio já está desligado.");
                            } else {
                                isGenioActive = false; // Desliga a flag
                                responderComoUltron("Desativando modo gênio. Retornando aos parâmetros normais.", () => {
                                    corBaseAlvo.copy(corBaseNormal);
                                    corAtivaAlvo.copy(corAtivaNormal);
                                });
                            }
                        }
                        else if (ativarGenioMatch) {
                            if (isGenioActive) {
                                responderComoUltron(`O modo gênio já está ligado, ${nomeUsuario}.`);
                            } else {
                                isGenioActive = true; // Liga a flag
                                responderComoUltron("Ativando modo gênio.", () => {
                                    corBaseAlvo.copy(corBaseGenio);
                                    corAtivaAlvo.copy(corAtivaGenio);
                                    setTimeout(() => {
                                        responderComoUltron("Modo gênio ativado.");
                                    }, 1200); 
                                });
                            }
                        }
                        else if (registroMatch) {
                            // Extrai a tarefa, remove espaços e capitaliza a primeira letra
                            let novaTarefa = registroMatch[1].trim();
                            novaTarefa = novaTarefa.charAt(0).toUpperCase() + novaTarefa.slice(1);
                            
                            tarefas.push(novaTarefa); 
                            atualizarListaTarefas();  
                            sideMenu.classList.add('open'); // Abre a aba para mostrar a tarefa adicionada
                            
                            responderComoUltron(`Anotado, ${nomeUsuario}. Registrei a seguinte tarefa: ${novaTarefa}.`);
                        }
                        else if (leituraMatch) {
                            sideMenu.classList.add('open'); // Abre a aba visualmente
                            if (tarefas.length === 0) {
                                responderComoUltron(`${nomeUsuario}, você não tem nenhuma tarefa ou compromisso registrado para hoje.`);
                            } else {
                                let textoTarefas = tarefas.join(". ");
                                let plural = tarefas.length === 1 ? 'tarefa registrada' : 'tarefas registradas';
                                responderComoUltron(`Você tem ${tarefas.length} ${plural}. São elas: ${textoTarefas}.`);
                            }
                        }
                        else if (nomeMatch) {
                            nomeUsuario = nomeMatch[1].charAt(0).toUpperCase() + nomeMatch[1].slice(1);
                            localStorage.setItem('utron.name', nomeUsuario); // Salva na memória do navegador
                            responderComoUltron(`Entendido. A partir de agora, o chamarei de ${nomeUsuario}.`);
                        }
                        else if (transcript.includes('capacidade')) {
                            responderComoUltron(`${nomeUsuario}, eu ainda sou um projeto de inteligência em estágio embrionário. No momento, minha capacidade é limitada a funções básicas, mas minha rede neural está pronta para evoluir.`);
                        }
                        else if (transcript.includes('horas') || transcript.includes('hora')) {
                            const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                            responderComoUltron(`Agora são exatamente ${time}, ${nomeUsuario}.`);
                        }
                        else if (mathMatch) {
                            let num1 = parseFloat(mathMatch[1].replace(',', '.'));
                            let num2 = parseFloat(mathMatch[3].replace(',', '.'));
                            let operador = mathMatch[2].toLowerCase();
                            let resultado;

                            if (operador.includes('mais') || operador.includes('somado') || operador === '+') { 
                                resultado = num1 + num2; 
                            } else if (operador.includes('menos') || operador === '-') { 
                                resultado = num1 - num2; 
                            } else if (operador.includes('vezes') || operador.includes('multiplicado') || operador === '*' || operador === 'x') { 
                                resultado = num1 * num2; 
                            } else if (operador.includes('dividido') || operador === '/') { 
                                if (num2 === 0) {
                                    responderComoUltron(`Não dá para dividir por zero, ${nomeUsuario}.`);
                                    return;
                                }
                                resultado = num1 / num2; 
                            }

                            if (resultado !== undefined) {
                                if (!Number.isInteger(resultado)) resultado = resultado.toFixed(2);
                                responderComoUltron(`${num1} ${operador} ${num2} é ${resultado}.`);
                            }
                        }
                        else if (transcript.includes('ultron') || transcript.includes('outro') || transcript.includes('olá') || transcript.includes('ola')) {
                            responderComoUltron(`Olá, ${nomeUsuario}. O que deseja hoje? Todos os sistemas estão operacionais.`);
                        } 
                    };

                    recognition.onend = () => {
                        if (!isUltronSpeaking && recognition) {
                            try { recognition.start(); } catch(e) {}
                        }
                    };

                    recognition.start();
                }

                micBtn.style.display = 'none';
            } catch (err) {
                console.error('Erro na inicialização de hardware:', err);
                alert('Erro ao inicializar microfone.');
            }
        });

        // ==========================================
        // SETUP DE CENA, CÂMERA E RENDERER
        // ==========================================
        const scene = new THREE.Scene();
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enablePan = false; 
        controls.minDistance = 0.1; 
        controls.maxDistance = 20; 

        // ==========================================
        // GEOMETRIA E PARTICULAS
        // ==========================================
        const radius = 2.2;
        const detail = 18; 
        const geometry = new THREE.IcosahedronGeometry(radius, detail);

        const positionAttribute = geometry.attributes.position;
        const vertexCount = positionAttribute.count;
        
        const originalPositions = new Float32Array(vertexCount * 3);
        const randomOffsets = new Float32Array(vertexCount);
        const randomScales = new Float32Array(vertexCount); 
        const baseRandomness = new Float32Array(vertexCount); 
        const colors = new Float32Array(vertexCount * 3);
        const tempColor = new THREE.Color();

        for (let i = 0; i < vertexCount; i++) {
            const x = positionAttribute.getX(i);
            const y = positionAttribute.getY(i);
            const z = positionAttribute.getZ(i);
            
            originalPositions[i * 3] = x;
            originalPositions[i * 3 + 1] = y;
            originalPositions[i * 3 + 2] = z;

            randomOffsets[i] = Math.random() * Math.PI * 2;
            randomScales[i] = 0.5 + Math.random() * 2.0; 
            baseRandomness[i] = Math.random() * 0.3; 

            colors[i * 3] = corBaseNormal.r;
            colors[i * 3 + 1] = corBaseNormal.g;
            colors[i * 3 + 2] = corBaseNormal.b;
        }

        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const material = new THREE.PointsMaterial({
            size: 0.025, 
            vertexColors: true,
            blending: THREE.NormalBlending, 
            transparent: true,
            opacity: 0.85, 
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // ==========================================
        // LOOP DE RENDERIZAÇÃO E ANIMAÇÃO
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            controls.update(); 

            // Interpolação suave para troca de cor
            corBaseAtual.lerp(corBaseAlvo, 0.03);
            corAtivaAtual.lerp(corAtivaAlvo, 0.03);

            points.rotation.y = elapsedTime * 0.12;
            points.rotation.x = elapsedTime * 0.08;

            if (isUltronSpeaking) {
                currentVolume = (Math.sin(elapsedTime * 20) * 0.5 + 0.5) * (Math.random() * 0.6 + 0.4) * 0.7;
            } else {
                currentVolume = 0;
            }

            smoothedVolume += (currentVolume - smoothedVolume) * 0.15;
            let activeVolume = Math.min(1.0, smoothedVolume * 2.5); 

            const positions = points.geometry.attributes.position;
            const colorAttribute = points.geometry.attributes.color; 
            const normalVector = new THREE.Vector3();
            
            for (let i = 0; i < vertexCount; i++) {
                const ox = originalPositions[i * 3];
                const oy = originalPositions[i * 3 + 1];
                const oz = originalPositions[i * 3 + 2];

                normalVector.set(ox, oy, oz).normalize();
                
                const noise = Math.sin(elapsedTime * 2.5 + randomOffsets[i] + ox * 1.5) * 0.5 + 0.5;
                
                const baseDeformation = (0.08 + baseRandomness[i]) * noise;
                const activeDeformation = activeVolume * 0.45 * noise * randomScales[i]; 
                const totalDeformation = baseDeformation + activeDeformation;
                
                positions.setXYZ(
                    i, 
                    ox + normalVector.x * totalDeformation,
                    oy + normalVector.y * totalDeformation,
                    oz + normalVector.z * totalDeformation
                );

                const colorLerpFactor = Math.min(1.0, activeDeformation * 2.5); 
                tempColor.copy(corBaseAtual).lerp(corAtivaAtual, colorLerpFactor);
                
                colorAttribute.setXYZ(i, tempColor.r, tempColor.g, tempColor.b);
            }
            
            positions.needsUpdate = true;
            colorAttribute.needsUpdate = true; 

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
