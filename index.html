<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultron - Visualizador de IA</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05020a;
            font-family: sans-serif;
        }
        canvas {
            display: block;
        }
        
        /* ==========================================
           HEADER PREMIUM (Glassmorphism e Glow Sutil)
           ========================================== */
        #app-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: rgba(5, 2, 12, 0.6); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: text-shadow 0.2s, border-color 0.2s;
        }

        /* BOTÃO DO MICROFONE */
        #mic-btn {
            position: absolute;
            bottom: 40px; 
            left: 50%;
            transform: translateX(-50%); 
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 50%; 
            cursor: pointer;
            font-size: 24px; 
            display: flex; 
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        #mic-btn:active {
            transform: translateX(-50%) scale(0.9); 
        }

        /* ONDAS SONORAS */
        #waveform {
            position: absolute;
            bottom: 120px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0; 
            transition: opacity 0.3s ease;
            z-index: 5;
        }
        .bar {
            width: 4px;
            background-color: #ff0000;
            border-radius: 2px;
            animation: soundWave 0s infinite ease-in-out alternate;
        }
        .bar:nth-child(1) { height: 12px; animation-duration: 0.4s; }
        .bar:nth-child(2) { height: 28px; animation-duration: 0.25s; }
        .bar:nth-child(3) { height: 45px; animation-duration: 0.35s; }
        .bar:nth-child(4) { height: 22px; animation-duration: 0.2s; }
        .bar:nth-child(5) { height: 15px; animation-duration: 0.45s; }

        @keyframes soundWave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }

        /* ==========================================
           MENU LATERAL, TAREFAS E CÉREBRO
           ========================================== */
        #menu-btn {
            position: absolute;
            top: 10px; 
            left: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 22px;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }
        #menu-btn:hover { background: rgba(255, 255, 255, 0.15); }

        #side-menu {
            position: absolute;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(10, 5, 20, 0.95);
            backdrop-filter: blur(15px);
            border-right: 2px solid rgba(138, 43, 226, 0.3);
            z-index: 20;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #side-menu.open { left: 0; }
        
        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .menu-header h2 { margin: 0; font-size: 20px; }
        #close-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }
        #close-btn:hover { color: white; }

        #main-nav { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover { background: rgba(138, 43, 226, 0.3); }

        /* Paineis Ocultos */
        #tasks-panel, #brain-panel { display: none; }
        
        .back-nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .back-nav-btn:hover { background: rgba(255,255,255,0.2); }

        #task-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        #task-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #8a2be2;
            font-size: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        /* Estilos do Painel do Cérebro */
        .brain-action-btn {
            width: 100%;
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(138, 43, 226, 0.5);
            color: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            text-align: left;
        }
        .brain-action-btn:hover { background: rgba(138, 43, 226, 0.4); }
        .brain-action-btn.supabase-btn {
            background: rgba(62, 207, 142, 0.2);
            border-color: rgba(62, 207, 142, 0.5);
        }
        .brain-action-btn.supabase-btn:hover { background: rgba(62, 207, 142, 0.4); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
    
    <!-- Bibliotecas e CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Cliente do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    
    <header id="app-header">Ultron</header>

    <button id="menu-btn" aria-label="Abrir Menu">☰</button>

    <div id="side-menu">
        <div class="menu-header">
            <h2>Menu</h2>
            <button id="close-btn" aria-label="Fechar Menu">✖</button>
        </div>
        
        <ul id="main-nav">
            <li class="nav-item" id="nav-tarefas-btn">📝 Tarefas Diárias</li>
            <li class="nav-item" id="nav-brain-btn">🧠 Cérebro e Aprendizado</li>
        </ul>

        <!-- Painel de Tarefas -->
        <div id="tasks-panel">
            <button class="back-nav-btn">⬅ Voltar</button>
            <ul id="task-list"></ul>
        </div>

        <!-- Painel do Cérebro -->
        <div id="brain-panel">
            <button class="back-nav-btn">⬅ Voltar</button>
            <h3 style="color: #8a2be2; margin-top: 0;">🧠 Conexões Neurais</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 20px;">Gerencie e sincronize as memórias do Ultron.</p>
            
            <button id="export-brain-btn" class="brain-action-btn">📥 Baixar Cérebro (Backup Local)</button>
            
            <input type="file" id="import-brain-file" style="display: none;" accept=".json">
            <button id="import-brain-btn" class="brain-action-btn">📤 Carregar Cérebro (Restaurar)</button>
            
            <button id="sync-supabase-btn" class="brain-action-btn supabase-btn">☁️ Sincronizar com Supabase</button>
            
            <p id="brain-status-msg" style="font-size: 12px; color: #8a2be2; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- Interface Visual Principal -->
    <div id="waveform">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    <button id="mic-btn" aria-label="Ativar IA">🎤</button>

    <script>
        console.log('Script iniciado');

        // ==========================================
        // CÉREBRO DO ULTRON (NLP Estatístico Interno)
        // ==========================================
        const UltronBrain = {
            redes: {
                modo_genio_ativar: ["ativar", "ligar", "modo", "genio", "inteligencia"],
                modo_genio_desativar: ["desativar", "desligar", "sair", "parar", "normal", "genio", "voltar"],
                leitura_tarefas: ["quais", "ler", "mostrar", "tarefas", "compromissos", "hoje", "agenda", "tenho", "fazer"],
                capacidade: ["capacidade", "maxima", "sabe", "fazer", "limites", "inteligente"],
                horas: ["horas", "hora", "relogio", "tempo", "agora"],
                saudacao: ["ola", "oi", "ultron", "tudo", "bem", "fala", "outro", "chapa", "amigo"],
            },

            filtrarRuido: function(texto) {
                return texto.toLowerCase()
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "") 
                    .replace(/[.,!?]/g, ""); 
            },

            pensar: function(fraseOriginal) {
                const fraseLimpa = this.filtrarRuido(fraseOriginal);
                const palavras = fraseLimpa.split(" ");
                
                // 1. Reflexos (Regex Consolidadas)
                const nomeMatch = fraseOriginal.match(/(?:meu nome [ée]|me chamo)\s+([a-zàáâãéèêíïóôõöúçñ]+)/i);
                if (nomeMatch) return { intencao: 'APRENDER_NOME', dados: nomeMatch[1] };

                let mathStr = fraseOriginal
                    .replace(/\bzero\b/g, '0').replace(/\bum\b/g, '1').replace(/\bdois\b/g, '2').replace(/\btrês\b/g, '3')
                    .replace(/\bquatro\b/g, '4').replace(/\bcinco\b/g, '5').replace(/\bseis\b/g, '6').replace(/\bsete\b/g, '7')
                    .replace(/\boito\b/g, '8').replace(/\bnove\b/g, '9').replace(/\bdez\b/g, '10');
                const mathMatch = mathStr.match(/(\d+(?:[.,]\d+)?)\s*(mais|somada? a?|\+|menos|-|vezes|\*|x|multiplicado(?: por)?|dividido(?: por| para| pra)?|\/)\s*(\d+(?:[.,]\d+)?)/i);
                if (mathMatch) return { intencao: 'CALCULAR', dados: mathMatch };

                const registroMatch = fraseOriginal.match(/(?:registrar|salvar|anotar|registre|anote|salve)(?:\s+(?:nova tarefa|tarefa|compromissos?|que|um compromisso|uma tarefa))?\s+(.+)/i);
                if (registroMatch) return { intencao: 'SALVAR_TAREFA', dados: registroMatch[1].trim() };

                // 2. Processamento Neural Probabilístico
                let intencaoGanhadora = 'DESCONHECIDO';
                let maiorPontuacao = 0;

                for (const [nomeRede, neuronios] of Object.entries(this.redes)) {
                    let pontuacao = 0;
                    for (const palavra of palavras) {
                        if (neuronios.includes(palavra)) pontuacao++;
                    }
                    
                    if (nomeRede === 'modo_genio_desativar' && pontuacao > 0) pontuacao += 5;

                    if (pontuacao > maiorPontuacao && pontuacao >= 1) {
                        maiorPontuacao = pontuacao;
                        intencaoGanhadora = nomeRede;
                    }
                }

                if (intencaoGanhadora === 'modo_genio_ativar' && fraseLimpa.includes("desativar")) {
                    intencaoGanhadora = 'modo_genio_desativar';
                }

                return { intencao: intencaoGanhadora, dados: null };
            }
        };

        // ==========================================
        // CONFIGURAÇÕES DO SUPABASE 
        // ==========================================
        const SUPABASE_URL = 'https://oewodtojczbxmqcqwobo.supabase.co'; 
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ld29kdG9qY3pieG1xY3F3b2JvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1OTA1NzcsImV4cCI6MjEwMzE2NjU3N30.84cEtEFHQFFPWZh2qw7NRphfuD9F8kN6nSjttx9EH3Q'; // Mantenha sua Key inteira aqui!
        
        let supabase = null;
        try {
            if (window.supabase) {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            } else {
                console.warn("Biblioteca Supabase não encontrada no window.");
            }
        } catch (error) {
            console.warn("Erro ao inicializar Supabase. O app continuará funcionando localmente.", error);
            supabase = null;
        }

        // ==========================================
        // DADOS LOCAIS DO CÉREBRO (Memória Curta e Longa)
        // ==========================================
        let tarefas = JSON.parse(localStorage.getItem('utron.tasks.v1')) || []; 
        let nomeUsuario = localStorage.getItem('utron.name') || "senhor";
        let isGenioActive = localStorage.getItem('utron.mode') === 'genio'; 

        // ==========================================
        // GERENCIAMENTO DA UI (MENU E PAINEIS)
        // ==========================================
        const menuBtn = document.getElementById('menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const closeBtn = document.getElementById('close-btn');
        const mainNav = document.getElementById('main-nav');
        
        const tasksPanel = document.getElementById('tasks-panel');
        const brainPanel = document.getElementById('brain-panel');
        
        const navTarefasBtn = document.getElementById('nav-tarefas-btn');
        const navBrainBtn = document.getElementById('nav-brain-btn');
        const backNavBtns = document.querySelectorAll('.back-nav-btn');
        
        const taskListEl = document.getElementById('task-list');
        const micBtn = document.getElementById('mic-btn');
        const brainStatusMsg = document.getElementById('brain-status-msg');

        function openSideMenu() {
            sideMenu.classList.add('open');
            mainNav.style.display = 'block';
            tasksPanel.style.display = 'none';
            brainPanel.style.display = 'none';
        }

        menuBtn.addEventListener('click', openSideMenu);
        closeBtn.addEventListener('click', () => sideMenu.classList.remove('open'));
        
        navTarefasBtn.addEventListener('click', () => {
            mainNav.style.display = 'none';
            tasksPanel.style.display = 'block';
        });

        navBrainBtn.addEventListener('click', () => {
            mainNav.style.display = 'none';
            brainPanel.style.display = 'block';
        });

        backNavBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tasksPanel.style.display = 'none';
                brainPanel.style.display = 'none';
                mainNav.style.display = 'block';
            });
        });

        function atualizarListaTarefas() {
            taskListEl.innerHTML = '';
            if (tarefas.length === 0) {
                taskListEl.innerHTML = '<li style="border-left-color: gray; color: gray;">Nenhum compromisso registrado.</li>';
            } else {
                tarefas.forEach((tarefa) => {
                    let li = document.createElement('li');
                    li.textContent = tarefa;
                    taskListEl.appendChild(li);
                });
            }
            localStorage.setItem('utron.tasks.v1', JSON.stringify(tarefas));
        }
        atualizarListaTarefas(); 

        // ==========================================
        // LÓGICA DE APRENDIZADO E SINCRONIZAÇÃO 
        // ==========================================
        
        function compilarCerebro() {
            return JSON.stringify({
                nomeUsuario: nomeUsuario,
                modoGenio: isGenioActive,
                tarefas: tarefas,
                timestamp: new Date().toISOString()
            }, null, 2);
        }

        document.getElementById('export-brain-btn').addEventListener('click', () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(compilarCerebro());
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `ultron-brain-${new Date().getTime()}.json`);
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            brainStatusMsg.textContent = "✅ Cérebro baixado com sucesso.";
        });

        document.getElementById('import-brain-btn').addEventListener('click', () => {
            document.getElementById('import-brain-file').click();
        });

        document.getElementById('import-brain-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > 1024 * 1024) { 
                brainStatusMsg.textContent = "❌ Arquivo muito grande (Máx 1MB).";
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const brainData = JSON.parse(event.target.result);
                    
                    if (brainData.nomeUsuario && typeof brainData.nomeUsuario === 'string') {
                        nomeUsuario = brainData.nomeUsuario;
                        localStorage.setItem('utron.name', nomeUsuario);
                    }
                    if (Array.isArray(brainData.tarefas)) {
                        tarefas = brainData.tarefas.filter(t => typeof t === 'string');
                    }
                    if (typeof brainData.modoGenio === 'boolean') {
                        isGenioActive = brainData.modoGenio;
                        localStorage.setItem('utron.mode', isGenioActive ? 'genio' : 'normal');
                        corBaseAlvo.copy(isGenioActive ? corBaseGenio : corBaseNormal);
                        corAtivaAlvo.copy(isGenioActive ? corAtivaGenio : corAtivaNormal);
                    }

                    atualizarListaTarefas();
                    brainStatusMsg.textContent = "✅ Cérebro restaurado e neurônios conectados!";
                    setTimeout(() => location.reload(), 2000); 
                } catch (err) {
                    brainStatusMsg.textContent = "❌ Arquivo JSON corrompido ou inválido.";
                }
            };
            reader.readAsText(file);
        });

        document.getElementById('sync-supabase-btn').addEventListener('click', async () => {
            if (!supabase) {
                brainStatusMsg.textContent = "❌ Supabase não está configurado.";
                return;
            }
            
            brainStatusMsg.textContent = "⏳ Sincronizando com a nuvem...";
            
            try {
                const { data: remoteData, error: fetchError } = await supabase
                    .from('utron_brain')
                    .select('data')
                    .eq('id', 'master_brain')
                    .single();

                let deveSubirDadosLocais = true;

                if (remoteData && remoteData.data) {
                    const localTime = new Date(JSON.parse(compilarCerebro()).timestamp);
                    const remoteTime = new Date(remoteData.data.timestamp);

                    if (remoteTime > localTime) {
                        tarefas = remoteData.data.tarefas || [];
                        nomeUsuario = remoteData.data.nomeUsuario || "senhor";
                        localStorage.setItem('utron.name', nomeUsuario);
                        atualizarListaTarefas();
                        deveSubirDadosLocais = false;
                        brainStatusMsg.textContent = "✅ Cérebro atualizado via nuvem!";
                    }
                }

                if (deveSubirDadosLocais) {
                    const payload = JSON.parse(compilarCerebro());
                    const { error: upsertError } = await supabase
                        .from('utron_brain')
                        .upsert({ id: 'master_brain', data: payload });

                    if (upsertError) throw upsertError;
                    brainStatusMsg.textContent = "✅ Memória enviada para a nuvem com sucesso!";
                }

            } catch (error) {
                console.error(error);
                brainStatusMsg.textContent = "❌ Erro ao conectar com Supabase.";
            }
        });

        // ==========================================
        // VARIÁVEIS DE COR E CONTROLE
        // ==========================================
        let audioContext;
        let analyser;
        let dataArray;
        let currentVolume = 0;
        let smoothedVolume = 0;
        
        let recognition = null; 
        let isUltronSpeaking = false; 
        let currentUtterance = null; 
        let isListening = false; 

        const corBaseNormal = new THREE.Color(0x8a2be2); 
        const corAtivaNormal = new THREE.Color(0xff0000); 
        const corBaseGenio = new THREE.Color(0x004d00); 
        const corAtivaGenio = new THREE.Color(0x33ff33); 

        const corBaseAlvo = new THREE.Color(isGenioActive ? 0x004d00 : 0x8a2be2);
        const corAtivaAlvo = new THREE.Color(isGenioActive ? 0x33ff33 : 0xff0000);
        const corBaseAtual = new THREE.Color(isGenioActive ? 0x004d00 : 0x8a2be2);
        const corAtivaAtual = new THREE.Color(isGenioActive ? 0x33ff33 : 0xff0000);

        const waveform = document.getElementById('waveform'); 
        const appHeader = document.getElementById('app-header'); 

        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

        // ==========================================
        // FUNÇÃO DE FALA ROBUSTA
        // ==========================================
        function responderComoUltron(fraseDaVez, onEndCallback = null) {
            if (isUltronSpeaking) return;
            
            isUltronSpeaking = true;
            if (recognition) { try { recognition.stop(); } catch(e) {} }
            
            waveform.style.opacity = '1';
            window.speechSynthesis.cancel(); 

            currentUtterance = new SpeechSynthesisUtterance(fraseDaVez);
            currentUtterance.lang = 'pt-BR';
            currentUtterance.pitch = 0.2; 
            currentUtterance.rate = 0.85; 
            currentUtterance.volume = 1.0; 

            const vozes = window.speechSynthesis.getVoices();
            const vozMasculinaOuPremium = vozes.find(voz => 
                (voz.lang.includes('pt-BR') || voz.lang.includes('pt-PT')) && 
                (voz.name.includes('Premium') || voz.name.includes('Daniel') || voz.name.includes('Thiago') || voz.name.includes('Google'))
            ) || vozes.find(voz => voz.lang.includes('pt')); 

            if (vozMasculinaOuPremium) {
                currentUtterance.voice = vozMasculinaOuPremium;
            }

            const finalizarFala = () => {
                isUltronSpeaking = false;
                waveform.style.opacity = '0'; 
                if (typeof onEndCallback === 'function') {
                    onEndCallback();
                } else if (recognition) {
                    try { recognition.start(); } catch(e) { micBtn.style.display = 'flex'; } 
                }
            };

            currentUtterance.onend = finalizarFala;
            currentUtterance.onerror = finalizarFala;

            window.speechSynthesis.speak(currentUtterance);
        }

        // ==========================================
        // EXECUÇÃO DO PENSAMENTO E AÇÕES
        // ==========================================
        micBtn.addEventListener('click', async () => {
            try {
                const unlockSpeech = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(unlockSpeech);

                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; 
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognition = new SpeechRecognition();
                    recognition.continuous = true; 
                    recognition.interimResults = false;
                    recognition.lang = 'pt-BR';

                    recognition.onstart = () => {
                        isListening = true;
                        micBtn.style.display = 'none';
                    };

                    recognition.onresult = (event) => {
                        const lastResult = event.results[event.results.length - 1];
                        const transcript = lastResult[0].transcript.trim();
                        if (!transcript) return;

                        console.log("Comando detectado:", transcript);
                        
                        const pensamento = UltronBrain.pensar(transcript);
                        console.log("Intenção Decodificada:", pensamento);

                        switch(pensamento.intencao) {
                            case 'modo_genio_desativar':
                                if (!isGenioActive) {
                                    responderComoUltron("O modo gênio já está desligado.");
                                } else {
                                    isGenioActive = false; 
                                    localStorage.setItem('utron.mode', 'normal'); 
                                    responderComoUltron("Desativando modo gênio. Retornando aos parâmetros normais.", () => {
                                        corBaseAlvo.copy(corBaseNormal);
                                        corAtivaAlvo.copy(corAtivaNormal);
                                    });
                                }
                                break;
                                
                            case 'modo_genio_ativar':
                                if (isGenioActive) {
                                    responderComoUltron(`O modo gênio já está ligado, ${nomeUsuario}.`);
                                } else {
                                    isGenioActive = true; 
                                    localStorage.setItem('utron.mode', 'genio'); 
                                    responderComoUltron("Ativando modo gênio.", () => {
                                        corBaseAlvo.copy(corBaseGenio);
                                        corAtivaAlvo.copy(corAtivaGenio);
                                        setTimeout(() => { responderComoUltron("Modo gênio ativado."); }, 1200); 
                                    });
                                }
                                break;

                            case 'SALVAR_TAREFA':
                                let novaTarefa = pensamento.dados;
                                novaTarefa = novaTarefa.charAt(0).toUpperCase() + novaTarefa.slice(1);
                                tarefas.push(novaTarefa); 
                                atualizarListaTarefas();  
                                sideMenu.classList.add('open'); 
                                mainNav.style.display = 'none';
                                tasksPanel.style.display = 'block';
                                responderComoUltron(`Anotado, ${nomeUsuario}. Registrei a seguinte tarefa: ${novaTarefa}.`);
                                break;

                            case 'leitura_tarefas':
                                sideMenu.classList.add('open'); 
                                mainNav.style.display = 'none';
                                tasksPanel.style.display = 'block';
                                if (tarefas.length === 0) {
                                    responderComoUltron(`${nomeUsuario}, você não tem nenhuma tarefa ou compromisso registrado para hoje.`);
                                } else {
                                    let textoTarefas = tarefas.join(". ");
                                    let plural = tarefas.length === 1 ? 'tarefa registrada' : 'tarefas registradas';
                                    responderComoUltron(`Você tem ${tarefas.length} ${plural}. São elas: ${textoTarefas}.`);
                                }
                                break;

                            case 'APRENDER_NOME':
                                nomeUsuario = pensamento.dados.charAt(0).toUpperCase() + pensamento.dados.slice(1);
                                localStorage.setItem('utron.name', nomeUsuario); 
                                responderComoUltron(`Entendido. A partir de agora, o chamarei de ${nomeUsuario}.`);
                                break;

                            case 'capacidade':
                                responderComoUltron(`${nomeUsuario}, eu ainda sou um projeto de inteligência em estágio embrionário. No momento, minha capacidade é limitada a funções básicas, mas minha rede neural está pronta para evoluir.`);
                                break;

                            case 'horas':
                                const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                                responderComoUltron(`Agora são exatamente ${time}, ${nomeUsuario}.`);
                                break;

                            case 'CALCULAR':
                                let matchData = pensamento.dados;
                                let num1 = parseFloat(matchData[1].replace(',', '.'));
                                let num2 = parseFloat(matchData[3].replace(',', '.'));
                                let operador = matchData[2].toLowerCase();
                                let resultado;

                                if (operador.includes('mais') || operador.includes('somad') || operador === '+') { 
                                    resultado = num1 + num2; 
                                } else if (operador.includes('menos') || operador === '-') { 
                                    resultado = num1 - num2; 
                                } else if (operador.includes('vezes') || operador.includes('multiplicado') || operador === '*' || operador === 'x') { 
                                    resultado = num1 * num2; 
                                } else if (operador.includes('dividido') || operador === '/') { 
                                    if (num2 === 0) {
                                        responderComoUltron(`Não é possível dividir por zero, ${nomeUsuario}.`);
                                        break;
                                    }
                                    resultado = num1 / num2; 
                                }

                                if (resultado !== undefined) {
                                    if (!Number.isInteger(resultado)) resultado = resultado.toFixed(2);
                                    responderComoUltron(`${num1} ${operador} ${num2} é igual a ${resultado}.`);
                                }
                                break;

                            case 'saudacao':
                                responderComoUltron(`Olá, ${nomeUsuario}. O que deseja hoje? Todos os sistemas estão operacionais.`);
                                break;

                            default:
                                const respostasErro = [
                                    "Desculpe, não entendi o comando. Poderia repetir?",
                                    "Perdão, não tenho resposta para isso no momento.",
                                    "Não compreendi, senhor. Pode reformular a instrução?"
                                ];
                                const falaAleatoria = respostasErro[Math.floor(Math.random() * respostasErro.length)];
                                responderComoUltron(falaAleatoria);
                                break;
                        }
                    };

                    recognition.onend = () => {
                        isListening = false;
                        if (!isUltronSpeaking && recognition) {
                            try { recognition.start(); } catch(e) { micBtn.style.display = 'flex'; }
                        }
                    };
                    
                    recognition.onerror = () => { micBtn.style.display = 'flex'; };

                    recognition.start();
                }

            } catch (err) {
                alert('Erro ao inicializar microfone.');
                micBtn.style.display = 'flex';
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (recognition && !isListening && !isUltronSpeaking) {
                    try { recognition.start(); } catch(e) { micBtn.style.display = 'flex'; }
                }
            } else {
                if (recognition && isListening) {
                    try { recognition.stop(); } catch(e) {}
                }
            }
        });

        // ==========================================
        // SETUP DE CENA E ANIMAÇÃO
        // ==========================================
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7; 

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.05;
        controls.enablePan = false; 
        controls.minDistance = 0.1; 
        controls.maxDistance = 20; 

        const radius = 2.2;
        // VALOR REDUZIDO DE FORMA SEGURA (Detail = 5) PARA O IPHONE NÃO TRAVAR
        const detail = 5; 
        const geometry = new THREE.IcosahedronGeometry(radius, detail);

        const positionAttribute = geometry.attributes.position;
        const vertexCount = positionAttribute.count;
        
        const originalPositions = new Float32Array(vertexCount * 3);
        const randomOffsets = new Float32Array(vertexCount);
        const randomScales = new Float32Array(vertexCount); 
        const baseRandomness = new Float32Array(vertexCount); 
        const colors = new Float32Array(vertexCount * 3);
        const tempColor = new THREE.Color();

        for (let i = 0; i < vertexCount; i++) {
            const x = positionAttribute.getX(i);
            const y = positionAttribute.getY(i);
            const z = positionAttribute.getZ(i);
            
            originalPositions[i * 3] = x;
            originalPositions[i * 3 + 1] = y;
            originalPositions[i * 3 + 2] = z;

            randomOffsets[i] = Math.random() * Math.PI * 2;
            
            // Aumentado a escala randômica para compensar a diminuição dos pontos
            randomScales[i] = 1.0 + Math.random() * 3.0; 
            // Aumentado a aleatoriedade base para os pontos se espalharem mais
            baseRandomness[i] = Math.random() * 0.8; 

            colors[i * 3] = corBaseAtual.r;
            colors[i * 3 + 1] = corBaseAtual.g;
            colors[i * 3 + 2] = corBaseAtual.b;
        }

        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        
        const material = new THREE.PointsMaterial({
            // Tamanho da partícula aumentado para preencher melhor o espaço
            size: 0.05, 
            vertexColors: true,
            blending: THREE.NormalBlending, 
            transparent: true,
            opacity: 0.85, 
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);
        console.log('Cena 3D montada com detail 5 e randomness ajustada.');

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            controls.update(); 

            corBaseAtual.lerp(corBaseAlvo, 0.03);
            corAtivaAtual.lerp(corAtivaAlvo, 0.03);

            const cAtivaCSS = `rgb(${Math.round(corAtivaAtual.r * 255)}, ${Math.round(corAtivaAtual.g * 255)}, ${Math.round(corAtivaAtual.b * 255)})`;
            appHeader.style.textShadow = `0 0 12px ${cAtivaCSS}`;
            appHeader.style.borderBottomColor = cAtivaCSS;

            points.rotation.y = elapsedTime * 0.12;
            points.rotation.x = elapsedTime * 0.08;

            if (isUltronSpeaking) {
                currentVolume = (Math.sin(elapsedTime * 20) * 0.5 + 0.5) * (Math.random() * 0.6 + 0.4) * 0.7;
            } else {
                currentVolume = 0;
            }

            smoothedVolume += (currentVolume - smoothedVolume) * 0.15;
            let activeVolume = Math.min(1.0, smoothedVolume * 2.5); 

            const positions = points.geometry.attributes.position;
            const colorAttribute = points.geometry.attributes.color; 
            const normalVector = new THREE.Vector3();
            
            for (let i = 0; i < vertexCount; i++) {
                const ox = originalPositions[i * 3];
                const oy = originalPositions[i * 3 + 1];
                const oz = originalPositions[i * 3 + 2];

                normalVector.set(ox, oy, oz).normalize();
                
                const noise = Math.sin(elapsedTime * 2.5 + randomOffsets[i] + ox * 1.5) * 0.5 + 0.5;
                
                const baseDeformation = (0.08 + baseRandomness[i]) * noise;
                const activeDeformation = activeVolume * 0.45 * noise * randomScales[i]; 
                const totalDeformation = baseDeformation + activeDeformation;
                
                positions.setXYZ(
                    i, 
                    ox + normalVector.x * totalDeformation,
                    oy + normalVector.y * totalDeformation,
                    oz + normalVector.z * totalDeformation
                );

                const colorLerpFactor = Math.min(1.0, activeDeformation * 2.5); 
                tempColor.copy(corBaseAtual).lerp(corAtivaAtual, colorLerpFactor);
                
                colorAttribute.setXYZ(i, tempColor.r, tempColor.g, tempColor.b);
            }
            
            positions.needsUpdate = true;
            colorAttribute.needsUpdate = true; 

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
