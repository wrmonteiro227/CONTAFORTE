<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sexta-Feira - Visualizador de IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #e8f1f5;
            --muted: #8ca6b0;
            --panel: rgba(7, 18, 24, 0.94);
            --line: rgba(125, 211, 232, 0.2);
            --cyan: #7dd3e8;
            --accent: #ff6b4a;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 42%, #102d35 0%, #071218 32%, #030609 76%);
            color: var(--ink);
            font-family: 'DM Sans', sans-serif;
        }
        canvas { display: block; }

        #app-header {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 60px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: rgba(3, 10, 14, 0.72);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: text-shadow 0.2s, border-color 0.2s;
        }

        #mic-btn {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            width: 60px; height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: background-color 0.3s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.4);
        }
        #mic-btn:active { transform: translateX(-50%) scale(0.9); }

        #waveform {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 5;
        }
        .bar {
            width: 4px;
            background-color: #ff0000;
            border-radius: 2px;
            animation: soundWave 0s infinite ease-in-out alternate;
        }
        .bar:nth-child(1) { height: 12px; animation-duration: 0.4s; }
        .bar:nth-child(2) { height: 28px; animation-duration: 0.25s; }
        .bar:nth-child(3) { height: 45px; animation-duration: 0.35s; }
        .bar:nth-child(4) { height: 22px; animation-duration: 0.2s; }
        .bar:nth-child(5) { height: 15px; animation-duration: 0.45s; }
        @keyframes soundWave {
            0% { transform: scaleY(0.3); }
            100% { transform: scaleY(1.2); }
        }

        #menu-btn {
            position: absolute;
            top: 10px; left: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 40px; height: 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 22px;
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.3s;
        }
        #menu-btn:hover { background: rgba(255, 255, 255, 0.15); }

        #side-menu {
            position: absolute;
            top: 0; left: -320px;
            width: 300px; height: 100vh;
            background: var(--panel);
            backdrop-filter: blur(15px);
            border-right: 1px solid var(--line);
            z-index: 20;
            transition: left 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            padding: 20px;
            box-sizing: border-box;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #side-menu.open { left: 0; }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }
        .menu-header h2 { margin: 0; font-size: 20px; }
        #close-btn {
            background: none;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }
        #close-btn:hover { color: white; }

        #main-nav { list-style: none; padding: 0; margin: 0; }
        .nav-item {
            background: rgba(125, 211, 232, 0.06);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item:hover { background: rgba(138, 43, 226, 0.3); }

        #tasks-panel { display: none; }
        #back-nav-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        #back-nav-btn:hover { background: rgba(255,255,255,0.2); }

        #task-list {
            list-style: none;
            padding: 0; margin: 0;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        #task-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #8a2be2;
            font-size: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        #pesquisas-panel { display: none; }
        .panel-back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .panel-back-btn:hover { background: rgba(255,255,255,0.2); }

        #pesquisa-list {
            list-style: none;
            padding: 0; margin: 0;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
        }
        #pesquisa-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #00d4ff;
            font-size: 14px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
            cursor: pointer;
        }
        #pesquisa-list .q { font-weight: bold; color: #ffffff; }
        #pesquisa-list .meta { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 4px; }
        #pesquisa-list .sub {
            display: block;
            color: #7fd4ff;
            font-size: 12px;
            margin-top: 6px;
            text-decoration: underline;
        }

        /* ==========================================
           HUD CENTRAL (avisos / countdown / alertas)
           ========================================== */
        #hud-center {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150px; height: 150px;
            z-index: 12;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        #hud-center.active { opacity: 1; }
        #hud-center svg {
            position: absolute;
            inset: 0;
            transform: rotate(-90deg);
        }
        .hud-bg { fill: none; stroke: rgba(64, 220, 255, 0.14); stroke-width: 2; }
        .hud-fg {
            fill: none;
            stroke: rgba(64, 220, 255, 0.9);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 326.73;
            stroke-dashoffset: 0;
            filter: drop-shadow(0 0 6px rgba(64, 220, 255, 0.8));
        }
        #hud-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 2px;
        }
        #hud-icon { font-size: 14px; }
        #hud-time {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #cfeeff;
            text-shadow: 0 0 12px rgba(64, 220, 255, 0.9);
        }
        #hud-label {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: rgba(160, 220, 240, 0.75);
            text-align: center;
            padding: 0 14px;
        }
        #hud-center.alert .hud-fg {
            stroke: rgba(255, 77, 106, 0.95);
            filter: drop-shadow(0 0 8px rgba(255, 77, 106, 0.9));
            animation: hudPulse 0.8s infinite;
        }
        #hud-center.alert #hud-time {
            font-size: 13px;
            letter-spacing: 1px;
            color: #ffd7de;
            text-shadow: 0 0 14px rgba(255, 77, 106, 0.9);
        }
        #hud-center.alert #hud-icon { animation: hudPulse 0.8s infinite; }
        @keyframes hudPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* ==========================================
           CHAT
           ========================================== */
        #chat-panel {
            position: fixed;
            left: 0; right: 0; bottom: 0;
            height: 72vh;
            background: rgba(4, 13, 18, 0.96);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-top: 1px solid var(--line);
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
            z-index: 18;
            transform: translateY(105%);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            flex-direction: column;
            color: white;
        }
        #chat-panel.open { transform: translateY(0); }
        #chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .chat-subtitle {
            display: block;
            color: var(--muted);
            font-size: 10px;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }
        .chat-actions {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 9px 14px 0;
            scrollbar-width: none;
        }
        .chat-actions::-webkit-scrollbar { display: none; }
        .chat-action {
            flex: 0 0 auto;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: rgba(125, 211, 232, 0.06);
            color: var(--cyan);
            cursor: pointer;
            font: 600 11px 'DM Sans', sans-serif;
            padding: 7px 9px;
        }
        .chat-action:hover { background: rgba(125, 211, 232, 0.14); }
        .chat-title {
            font-size: 13px;
            letter-spacing: 3px;
            font-weight: 800;
            color: #7fe3ff;
            text-shadow: 0 0 8px rgba(64, 220, 255, 0.6);
        }
        #chat-close {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 30px; height: 30px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }
        #chat-msgs {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg {
            max-width: 82%;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.35;
            animation: fadeIn 0.25s ease;
            word-wrap: break-word;
        }
        .msg .hora {
            display: block;
            font-size: 9px;
            opacity: 0.5;
            margin-top: 3px;
            letter-spacing: 1px;
        }
        .msg.user {
            align-self: flex-end;
            background: rgba(255, 107, 74, 0.16);
            border: 1px solid rgba(255, 107, 74, 0.42);
            border-bottom-right-radius: 2px;
        }
        .msg.ai {
            align-self: flex-start;
            background: rgba(64, 220, 255, 0.12);
            border: 1px solid rgba(64, 220, 255, 0.3);
            border-bottom-left-radius: 2px;
        }
        #chat-empty {
            text-align: center;
            color: rgba(160, 220, 240, 0.4);
            font-size: 12px;
            letter-spacing: 1px;
            margin-top: 30px;
        }
        #chat-input-row {
            display: flex;
            gap: 8px;
            padding: 10px 14px calc(14px + env(safe-area-inset-bottom));
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        #chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(64, 220, 255, 0.25);
            border-radius: 8px;
            padding: 10px 12px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        #chat-input:focus { border-color: rgba(64, 220, 255, 0.7); }
        #chat-send {
            background: rgba(138, 43, 226, 0.6);
            border: none;
            color: white;
            width: 44px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/interpreter.js"></script>
</head>
<body>

    <header id="app-header">Sexta-Feira</header>
    <button id="menu-btn" aria-label="Abrir Menu">☰</button>

    <div id="side-menu">
        <div class="menu-header">
            <h2>Menu</h2>
            <button id="close-btn" aria-label="Fechar Menu">✖</button>
        </div>
        <ul id="main-nav">
            <li class="nav-item" id="nav-tarefas-btn">📝 Tarefas Diárias</li>
            <li class="nav-item" id="nav-pesquisas-btn">🌐 Buscas Recentes</li>
        </ul>
        <div id="tasks-panel">
            <button id="back-nav-btn">⬅ Voltar</button>
            <ul id="task-list"></ul>
        </div>
        <div id="pesquisas-panel">
            <button class="panel-back-btn" id="back-pesquisas-btn">⬅ Voltar</button>
            <ul id="pesquisa-list"></ul>
        </div>
    </div>

    <!-- HUD CENTRAL (avisos tecnológicos) -->
    <div id="hud-center">
        <svg viewBox="0 0 120 120" width="150" height="150">
            <circle class="hud-bg" cx="60" cy="60" r="52"></circle>
            <circle class="hud-fg" id="hud-fg" cx="60" cy="60" r="52"></circle>
        </svg>
        <div id="hud-content">
            <div id="hud-icon">⏰</div>
            <div id="hud-time">--:--</div>
            <div id="hud-label">STANDBY</div>
        </div>
    </div>

    <!-- CHAT -->
    <div id="chat-panel">
        <div id="chat-header">
            <div>
                <span class="chat-title">◈ CHAT SEXTA-FEIRA</span>
                <span class="chat-subtitle">Núcleo local • memória no dispositivo</span>
            </div>
            <button id="chat-close" aria-label="Fechar Chat">✖</button>
        </div>
        <div class="chat-actions" aria-label="Ações rápidas">
            <button class="chat-action" data-command="comandos">Comandos</button>
            <button class="chat-action" data-command="pesquisa sobre inteligência artificial">Pesquisar</button>
            <button class="chat-action" data-command="quais são as tarefas">Tarefas</button>
            <button class="chat-action" data-command="que horas são">Horário</button>
        </div>
        <div id="chat-msgs">
            <div id="chat-empty">SISTEMA DE COMUNICAÇÃO POR TEXTO ATIVO</div>
        </div>
        <div id="chat-input-row">
            <input id="chat-input" type="text" placeholder="Digite um comando (ex: pesquisa sobre X)..." autocomplete="off">
            <button id="chat-send" aria-label="Enviar">➤</button>
        </div>
    </div>

    <div id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
    </div>

    <button id="mic-btn" aria-label="Ativar IA">🎤</button>

    <script>
        // ============================================================
        // 📚 EDITE AQUI SUA BASE DE CONHECIMENTO LOCAL
        //   { chave: ["palavra ou frase", "variação"], resposta: "o que a Sexta-Feira fala" }
        // ============================================================
        const BASE_CONHECIMENTO = [
            { chave: ["senha do wifi", "senha wifi", "wifi"],  resposta: "A senha do wifi é: EDITE_AQUI." },
            { chave: ["meu email", "meu e-mail", "meu mail"],  resposta: "Seu e-mail é: EDITE_AQUI." },
            { chave: ["meu endereco", "onde eu moro", "endereço"], resposta: "Seu endereço é: EDITE_AQUI." },
            { chave: ["meu numero", "meu telefone", "telefone"], resposta: "Seu número é: EDITE_AQUI." }
        ];
        // ============================================================

        // ==========================================
        // UI: MENU, PAINÉIS, HUD, CHAT
        // ==========================================
        const menuBtn = document.getElementById('menu-btn');
        const sideMenu = document.getElementById('side-menu');
        const closeBtn = document.getElementById('close-btn');
        const mainNav = document.getElementById('main-nav');
        const tasksPanel = document.getElementById('tasks-panel');
        const navTarefasBtn = document.getElementById('nav-tarefas-btn');
        const backNavBtn = document.getElementById('back-nav-btn');
        const taskListEl = document.getElementById('task-list');
        const micBtn = document.getElementById('mic-btn');
        const appHeader = document.getElementById('app-header');
        const waveform = document.getElementById('waveform');

        const navPesquisasBtn = document.getElementById('nav-pesquisas-btn');
        const backPesquisasBtn = document.getElementById('back-pesquisas-btn');
        const pesquisasPanel = document.getElementById('pesquisas-panel');
        const pesquisaListEl = document.getElementById('pesquisa-list');

        const hudEl = document.getElementById('hud-center');
        const hudFg = document.getElementById('hud-fg');
        const hudIcon = document.getElementById('hud-icon');
        const hudTime = document.getElementById('hud-time');
        const hudLabel = document.getElementById('hud-label');

        const chatPanel = document.getElementById('chat-panel');
        const chatMsgs = document.getElementById('chat-msgs');
        const chatInput = document.getElementById('chat-input');
        const chatSend = document.getElementById('chat-send');
        const chatClose = document.getElementById('chat-close');
        const chatActions = document.querySelectorAll('.chat-action');

        // Migração suave de Ultron para Sexta-Feira sem perder os dados do localStorage
        let tarefas = JSON.parse(localStorage.getItem('sexta_feira.tasks.v1') || localStorage.getItem('utron.tasks.v1')) || [];
        let pesquisas = JSON.parse(localStorage.getItem('sexta_feira.pesquisas.v1') || localStorage.getItem('utron.pesquisas.v1')) || [];
        let fatos = JSON.parse(localStorage.getItem('sexta_feira.fatos.v1') || localStorage.getItem('utron.fatos.v1')) || [];

        function persistirTarefas() {
            if (!window.SextaStorage) return;
            SextaStorage.replaceAll('tasks', tarefas.map((texto) => ({
                id: SextaStorage.newId(),
                text: texto,
                completed: false
            }))).then(() => SextaStorage.syncAll()).catch((error) => console.warn('Sincronizacao de tarefas falhou:', error));
        }
        function persistirFatos() {
            if (!window.SextaStorage) return;
            SextaStorage.replaceAll('memories', fatos.map((fato) => ({
                id: SextaStorage.newId(),
                kind: 'fact',
                content: fato.frase || String(fato),
                source: 'user',
                confidence: 1
            }))).then(() => SextaStorage.syncAll()).catch((error) => console.warn('Sincronizacao de memoria falhou:', error));
        }
        SextaStorage.init().then(async () => {
            const storedTasks = await SextaStorage.readAll('tasks');
            const storedMemories = await SextaStorage.readAll('memories');
            if (!tarefas.length && storedTasks.length) tarefas = storedTasks.map((item) => item.text).filter(Boolean);
            if (!fatos.length && storedMemories.length) fatos = storedMemories.map((item) => ({ frase: item.content, data: item.created_at || '' }));
            atualizarListaTarefas();
            atualizarListaPesquisas();
        }).catch((error) => console.warn('Memoria local indisponivel:', error));

        // ---- Menu ----
        function openSideMenu() {
            sideMenu.classList.add('open');
            mainNav.style.display = 'block';
            tasksPanel.style.display = 'none';
            pesquisasPanel.style.display = 'none';
        }
        function openTasksPanel() {
            mainNav.style.display = 'none';
            tasksPanel.style.display = 'block';
            pesquisasPanel.style.display = 'none';
        }
        function openPesquisasPanel() {
            mainNav.style.display = 'none';
            tasksPanel.style.display = 'none';
            pesquisasPanel.style.display = 'block';
        }
        menuBtn.addEventListener('click', openSideMenu);
        closeBtn.addEventListener('click', () => sideMenu.classList.remove('open'));
        navTarefasBtn.addEventListener('click', openTasksPanel);
        backNavBtn.addEventListener('click', () => { tasksPanel.style.display = 'none'; mainNav.style.display = 'block'; });
        navPesquisasBtn.addEventListener('click', openPesquisasPanel);
        backPesquisasBtn.addEventListener('click', () => { pesquisasPanel.style.display = 'none'; mainNav.style.display = 'block'; });

        function atualizarListaTarefas() {
            taskListEl.innerHTML = '';
            if (tarefas.length === 0) {
                taskListEl.innerHTML = '<li style="border-left-color: gray; color: gray;">Nenhum compromisso registrado para hoje.</li>';
            } else {
                tarefas.forEach((tarefa) => {
                    let li = document.createElement('li');
                    li.textContent = tarefa;
                    taskListEl.appendChild(li);
                });
            }
            localStorage.setItem('sexta_feira.tasks.v1', JSON.stringify(tarefas));
            persistirTarefas();
        }
        atualizarListaTarefas();

        function atualizarListaPesquisas() {
            pesquisaListEl.innerHTML = '';
            if (pesquisas.length === 0) {
                pesquisaListEl.innerHTML = '<li style="border-left-color: gray; color: gray; cursor: default;">Nenhuma busca registrada ainda. Diga "pesquisa sobre tal coisa".</li>';
                return;
            }
            pesquisas.forEach((p) => {

        // ==========================================
        // VOZ — seleção inteligente (Feminina para Sexta-Feira)
        // Prioriza vozes femininas naturais da API local.
        // ==========================================
        function escolherVoz() {
            const vozes = window.speechSynthesis.getVoices();
            const ptBR = vozes.filter(v => /^pt[-_]BR/i.test(v.lang));
            const allPT = vozes.filter(v => /^pt[-_]/i.test(v.lang));
            let v = ptBR.find(v => /luciana|vitoria|joana|marcia|female|mulher/i.test(v.name));
            if (!v) v = ptBR.find(v => /premium|enhanced/i.test(v.name));
            if (!v) v = allPT.find(v => /luciana|vitoria/i.test(v.name));
            if (!v) v = allPT[0] || vozes.find(v => /google/i.test(v.name) && /pt/i.test(v.lang));
            return v || null;
        }

        function configurarVoz(utterance) {
            const v = escolherVoz();
            if (v) utterance.voice = v;
            const nome = v ? v.name.toLowerCase() : '';
            if (/luciana|joana|vitoria|female/i.test(nome)) {
                // voz feminina: tom e ritmo naturais
                utterance.pitch = 1.0;
                utterance.rate = 1.0;
            } else {
                utterance.pitch = 1.1; // leve ajuste se cair em voz genérica
                utterance.rate = 1.0;
            }
            utterance.volume = 1.0;
        }

        // ==========================================
        // FALA + BARGE-IN
        // ==========================================
        function responderComoSextaFeira(fraseDaVez, onEndCallback = null) {
            if (isSextaFeiraSpeaking) return;

            isSextaFeiraSpeaking = true;
            currentUtteranceText = fraseDaVez.toLowerCase();
            pushMsg('sexta-feira', fraseDaVez);

            waveform.style.opacity = '1';
            window.speechSynthesis.cancel();

            currentUtterance = new SpeechSynthesisUtterance(fraseDaVez);
            currentUtterance.lang = 'pt-BR';
            configurarVoz(currentUtterance);

            const finalizarFala = () => {
                if (currentUtterance && currentUtterance.onend !== finalizarFala) {
                    if (isSextaFeiraSpeaking) {
                        isSextaFeiraSpeaking = false;
                        currentUtteranceText = '';
                        waveform.style.opacity = '0';
                        if (typeof onEndCallback === 'function') onEndCallback();
                    }
                    return;
                }
                isSextaFeiraSpeaking = false;
                currentUtteranceText = '';
                waveform.style.opacity = '0';
                if (typeof onEndCallback === 'function') onEndCallback();
            };

            currentUtterance.onend = finalizarFala;
            currentUtterance.onerror = () => finalizarFala();

            // pequeno atraso: evita o iOS "engolir" a fala logo após o cancel
            setTimeout(() => {
                if (isSextaFeiraSpeaking) window.speechSynthesis.speak(currentUtterance);
            }, 60);
        }

        function interromperFala() {
            if (!isSextaFeiraSpeaking) return;
            searchToken++;

        function parecerAutoEscuta(transcript) {
            if (!currentUtteranceText) return false;
            const palavrasNovas = transcript.split(/\s+/).filter(w => w.length > 3);
            if (palavrasNovas.length === 0) return false;
            const palavrasSextaFeira = new Set(currentUtteranceText.split(/\s+/).filter(w => w.length > 3));
            const emComum = palavrasNovas.filter(w => palavrasSextaFeira.has(w));
            return emComum.length / palavrasNovas.length > 0.5;
        }

        function falar(frase) {
            return new Promise((resolve) => {
                if (isSextaFeiraSpeaking) { resolve(); return; }
                responderComoSextaFeira(frase, () => resolve());

        async function httpGetJSON(url, timeoutMs = 6000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: ctrl.signal });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return await res.json();
            } finally {
                clearTimeout(timer);
            }
        }

        async function buscarWikipedia(consulta) {
            const q = encodeURIComponent(consulta);
            const busca = await httpGetJSON(
                `https://pt.wikipedia.org/w/api.php?action=query&list=search&srsearch=${q}&srlimit=5&format=json&origin=*`
            );
            const resultados = (busca.query && busca.query.search) || [];
            if (!resultados.length) return null;
            const primeiro = resultados[0];

            let extResumo = '';
            try {
                const ext = await httpGetJSON(
                    `https://pt.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&titles=${encodeURIComponent(primeiro.title)}&format=json&origin=*`
                );
                const paginas = (ext.query && ext.query.pages) ? Object.values(ext.query.pages) : [];
                extResumo = (paginas[0] && paginas[0].extract) || '';
            } catch (e) {}

            const resumo = (extResumo || primeiro.snippet || '').replace(/<[^>]*>/g, '');
            return {
                fonte: 'Wikipédia',
                titulo: primeiro.title,
                resumo: resumo,
                url: `https://pt.wikipedia.org/wiki/${encodeURIComponent(primeiro.title.replace(/ /g, '_'))}`,
                lista: resultados.slice(0, 5).map(r => ({
                    titulo: r.title,
                    url: `https://pt.wikipedia.org/wiki/${encodeURIComponent(r.title.replace(/ /g, '_'))}`
                }))
            };
        }

        async function buscarDuckDuckGo(consulta) {
            const q = encodeURIComponent(consulta);
            const d = await httpGetJSON(
                `https://api.duckduckgo.com/?q=${q}&format=json&no_html=1&skip_disambig=1&kl=br-pt`
            );
            let resumo = d.AbstractText || d.Answer || d.Definition || '';
            if (!resumo && d.RelatedTopics && d.RelatedTopics.length) {
                const t = d.RelatedTopics.find(x => x && x.Text);
                if (t) resumo = t.Text;
            }
            if (!resumo && !d.Heading && !d.AbstractURL) return null;
            return {
                fonte: 'DuckDuckGo',
                titulo: d.Heading || consulta,
                resumo: resumo || `A busca não trouxe um resumo instantâneo, mas encontrei uma página relacionada para você consultar.`,
                url: d.AbstractURL || `https://duckduckgo.com/?q=${q}`,
                lista: []
            };
        }

        async function buscarRede(consulta) {
            const tentativas = [
                () => buscarWikipedia(consulta),
                () => buscarDuckDuckGo(consulta)
            ];
            for (const buscar of tentativas) {
                try {
                    const resultado = await buscar();
                    if (resultado) return resultado;
                } catch (e) {}
            }
            return {
                fonte: 'Busca na web',
                titulo: consulta,
                resumo: 'Não consegui extrair um resumo automático. Abri uma busca ampla para você continuar a investigação.',
                url: `https://www.google.com/search?q=${encodeURIComponent(consulta)}`,
                lista: []
            };
        }

        async function buscarClima(cidade) {
            let lugar = null;
            const geo = await httpGetJSON(
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade)}&count=1&language=pt&format=json`
            );
            if (geo.results && geo.results.length) {
                lugar = geo.results[0];
            } else if (cidade.includes(' ')) {
                const geo2 = await httpGetJSON(
                    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cidade.split(' ')[0])}&count=1&language=pt&format=json`
                );
                if (geo2.results && geo2.results.length) lugar = geo2.results[0];
            }
            if (!lugar) throw new Error('cidade não encontrada');

            const f = await httpGetJSON(
                `https://api.open-meteo.com/v1/forecast?latitude=${lugar.latitude}&longitude=${lugar.longitude}` +
                `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code` +
                `&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`
            );
            const c = f.current;
            const d = f.daily;
            const resumo = `Agora: ${climaDescricao(c.weather_code)}, ${Math.round(c.temperature_2)} graus, sensação de ${Math.round(c.apparent_temperature)} graus, umidade de ${Math.round(c.relative_humidity_2m)} por cento. Hoje a máxima é de ${Math.round(d.temperature_2m_max[0])} e a mínima de ${Math.round(d.temperature_2m_min[0])} graus.`;
            return {
                fonte: 'Meteorologia aberta',
                titulo: 'Clima em ' + lugar.name,
                resumo: resumo,
                url: `https://open-meteo.com/?latitude=${lugar.latitude}&longitude=${lugar.longitude}`,
                lista: []
            };
        }

        function extrairCidade(transcript) {
            if (!/\b(clima|tempo|previs[ãa]o|chove|chover|chovendo|chuva)\b/i.test(transcript)) return null;
            const m = transcript.match(/\b(?:em|no|na|de|do|da)\s+([a-zà-ö]+(?:\s+[a-zà-ö]+)?)(?:\s+(?:hoje|amanh[ãa]|semana|pra semana|nesta semana))?\s*[.!?]*\s*$/i);
            return m ? m[1].trim() : null;
        }

        function prepararParaFala(texto, max) {
            texto = texto.replace(/\s+/g, ' ').trim();
            if (texto.length <= max) return texto;
            let corte = texto.slice(0, max);
            const ponto = corte.lastIndexOf('.');
            if (ponto > max * 0.5) corte = corte.slice(0, ponto);
            return corte + '...';
        }

        // Busca SÓ com gatilho explícito
        const TRIGGERS_BUSCA = /pesquis|busc|achar?\b|procur|na internet|na web|no google|me informa|informa sobre|me fala sobre|me diz sobre/i;

        function limparConsulta(transcript) {
            let q = transcript
                .replace(/^(sexta-feira|sexta feira|ei|eai)\s*,?\s*/i, '')
                .replace(/^(por favor|pra mim)\s*/i, '')
                .replace(/^(me\s+)?(pesquise|pesquisar|pesquisa|busque|buscar|busca|acha|achar|procura|procure|procurar)\s+(na\s+internet|na\s+web|no\s+google|na\s+wikip[ée]dia|lá|la)\s*/i, '')
                .replace(/^(me\s+)?(pesquise|pesquisar|pesquisa|busque|buscar|busca|acha|achar|procura|procure|procurar)\s*/i, '')
                .replace(/^(sobre|de|me fala|me diz|qual é|quem é|o que é)\s+/i, '')
                .trim();
            return q.length >= 3 ? q : transcript;
        }

        async function processarPesquisa(consulta, prefixoResposta) {
            if (isSearching) return;
            isSearching = true;
            const token = ++searchToken;
            await falar(`Consultando a rede.`);
            if (token !== searchToken) return;

            let mensagemFinal;
            try {
                let resultado = null;
                const cidade = extrairCidade(consulta);
                if (cidade) {
                    try { resultado = await buscarClima(cidade); } catch (e) { resultado = null; }
                    if (token !== searchToken) return;
                }
                if (!resultado) resultado = await buscarRede(consulta);
                if (token !== searchToken) return;

                if (resultado) {
                    const tamanho = isGenioActive ? 700 : 400;
                    memoria.ultimoTopico = consulta;
                    memoria.ultimoResumo = prepararParaFala(resultado.resumo, 400);
                    salvarPesquisa({ pergunta: consulta, fonte: resultado.fonte, titulo: resultado.titulo, url: resultado.url, lista: resultado.lista });
                    const inicio = prefixoResposta ? prefixoResposta + ' ' : 'Encontrei. ';
                    mensagemFinal = `${inicio}${resultado.fonte}: ${resultado.titulo}. ${prepararParaFala(resultado.resumo, tamanho)}`;
                } else {
                    mensagemFinal = `Procurei na rede, mas não encontrei nada sobre isso. Pode tentar com outras palavras?`;
                }
            } catch (e) {
                console.warn('Falha na busca:', e);
                mensagemFinal = `Falha na conexão com a rede. Verifique sua internet, por favor.`;
            }

            if (token !== searchToken) return;
            isSearching = false;
            await falar(mensagemFinal);
        }

        // ==========================================
        // 📚 BASE DE CONHECIMENTO LOCAL + FATOS POR VOZ
        // ==========================================
        function normalizar(s) {
            return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function consultarBase(transcript) {
            const t = normalizar(transcript);
            for (const item of BASE_CONHECIMENTO) {
                for (const chave of item.chave) {
                    if (t.includes(normalizar(chave))) return item.resposta;
                }
            }
            return null;
        }

        const PALAVRAS_PARA = new Set([
            'que','meu','minha','meus','minhas','o','a','os','as','de','da','do','das','dos','em','no','na','nos','nas',
            'é','e','com','para','pra','tem','ter','está','esta','este','foi','se','um','uma','ao','pela','pelo','mas',
            'mais','quando','onde','qual','quais','me','eu','voc','você','voce','ja','ainda','tambem','so','sobre','depois','antes'
        ]);

        function palavrasSignificativas(s) {
            return normalizar(s).split(/[^a-z0-9]+/).filter(w => w.length > 3 && !PALAVRAS_PARA.has(w));
        }

        function consultarFatos(transcript) {
            const pt = palavrasSignificativas(transcript);
            if (pt.length < 2) return null;
            for (const f of fatos) {
                const fw = new Set(palavrasSignificativas(f.frase));
                const comuns = pt.filter(w => fw.has(w));
                if (comuns.length >= 2) return f.frase;
            }
            return null;
        }

        // ==========================================
        // ⏰ TIMERS + ALARMES (com HUD central)
        // ==========================================
        let timerId = null;
        let timerEndsAt = 0;
        let timerTotalMs = 0;
        let timerLabel = '';

        function formatarTempo(seg) {
            seg = Math.max(0, Math.ceil(seg));
            const h = Math.floor(seg / 3600);
            const m = Math.floor((seg % 3600) / 60);
            const s = seg % 60;
            const mm = String(m).padStart(2, '0');
            const ss = String(s).padStart(2, '0');
            return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
        }

        function atualizarTimer() {
            const restMs = timerEndsAt - Date.now();
            if (restMs <= 0) {
                clearInterval(timerId);
                timerId = null;
                timerEndsAt = 0;
                hudAlert('⏰', 'TEMPO ESGOTADO', timerLabel);
                tocarAlarme();
                if ('Notification' in window && Notification.permission === 'granted') {
                    try { new Notification('Sexta-Feira', { body: `${timerLabel} concluído.` }); } catch(e) {}
                }
                responderComoSextaFeira(`Tempo esgotado. ${timerLabel} terminou.`);
                return;
            }
            hudCountdown(restMs, timerTotalMs, timerLabel);
        }

        function tocarAlarme() {
            try {
                const ctxA = audioContext || new (window.AudioContext || window.webkitAudioContext)();
                [0, 0.35, 0.7].forEach((d, i) => {
                    const o = ctxA.createOscillator();
                    const g = ctxA.createGain();
                    o.type = 'sine';
                    o.frequency.value = i === 2 ? 1318.5 : 880;
                    g.gain.setValueAtTime(0.0001, ctxA.currentTime + d);
                    g.gain.exponentialRampToValueAtTime(0.3, ctxA.currentTime + d + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, ctxA.currentTime + d + 0.3);
                    o.connect(g); g.connect(ctxA.destination);
                    o.start(ctxA.currentTime + d);
                    o.stop(ctxA.currentTime + d + 0.35);
                });
            } catch(e) {}
        }

        function extrairAlarme(transcript) {
            if (!/(?:acorda|acorde|avise|alarme|toque|lembre)/i.test(transcript)) return null;
            if (/meia[- ]noite/i.test(transcript)) return montarHoraAlvo(0, 0);
            if (/meio dia/i.test(transcript)) return montarHoraAlvo(12, 0);
            const m = transcript.match(/(\d{1,2})(?::(\d{2}))?\s*(?:horas?|h)?\s*(da\s+(manh[ãa]|tarde|noite|madrugada))?/i);
            if (!m) return null;
            const idxNum = transcript.indexOf(m[0]);
            const depois = transcript.slice(idxNum + m[0].length);
            if (/^minutos?/i.test(depois)) return null; // timer relativo, não alarme
            let hora = parseInt(m[1], 10);
            const min = m[2] ? parseInt(m[2], 10) : 0;
            const periodo = m[3];
            if (hora < 1 || hora > 23 || min > 59) return null;
            if (periodo) {
                if (periodo === 'tarde' && hora < 12) hora += 12;
                if (periodo === 'noite' && hora < 19) hora += 12;
                if (periodo === 'madrugada' && hora > 5) hora -= 12;
            }
            return montarHoraAlvo(hora, min);
        }

        function montarHoraAlvo(hora, min) {
            const agora = new Date();
            const alvo = new Date(agora);
            alvo.setHours(hora, min, 0, 0);
            if (alvo <= agora) alvo.setDate(alvo.getDate() + 1);
            const hh = String(hora).padStart(2, '0');
            const mm = String(min).padStart(2, '0');
            return { timestamp: alvo.getTime(), hora, min, hhmm: `${hh}:${mm}` };
        }

        function extrairTimer(transcript) {
            if (!/(?:me avise|me lembre|lembre|avise|timer|cron[oó]metro|alarme|defina|definir|ative|crie|deixe um)/i.test(transcript)) return null;
            if (/\bmeia hora\b/i.test(transcript)) return { totalSeg: 30 * 60, minutos: 30 };
            const t2 = transcript
                .replace(/\bzero\b/g, '0').replace(/\bum\b/g, '1').replace(/\bdois\b/g, '2').replace(/\btr[eê]s\b/g, '3')
                .replace(/\bquatro\b/g, '4').replace(/\bcinco\b/g, '5').replace(/\bseis\b/g, '6').replace(/\bsete\b/g, '7')
                .replace(/\boito\b/g, '8').replace(/\bnove\b/g, '9').replace(/\bdez\b/g, '10').replace(/\bquinze\b/g, '15')
                .replace(/\btrinta\b/g, '30').replace(/\bcinq[ûu]enta\b/g, '50').replace(/\bsessenta\b/g, '60')
                .replace(/\bnoventa\b/g, '90').replace(/\bcem\b/g, '100');
            const numMatch = t2.match(/(\d+)\s*(?:minutos?|horas?)/);
            if (!numMatch) return null;
            let minutos = parseInt(numMatch[1], 10);
            if (/hora/i.test(numMatch[0])) minutos *= 60;
            const totalSeg = minutos * 60;
            if (totalSeg < 60 || totalSeg > 12 * 3600) return null;
            return { totalSeg, minutos };
        }

        function ativarTimer(endTs, label) {
            if (timerId) clearInterval(timerId);
            timerEndsAt = endTs;
            timerTotalMs = Math.max(1000, endTs - Date.now());
            timerLabel = label;
            timerId = setInterval(atualizarTimer, 250);
            if ('Notification' in window && Notification.permission === 'default') {
                try { Notification.requestPermission(); } catch(e) {}
            }
        }

        function cancelarTimer() {
            if (!timerId) return false;
            clearInterval(timerId);
            timerId = null;
            timerEndsAt = 0;
            timerLabel = '';
            hudEsconder();
            return true;
        }

        // ==========================================
        // 🧠 CONTEXTO: seguir a conversa e orientar soluções
        // ==========================================
        function detectarContexto(transcript) {
            if (!memoria.ultimoTopico || (Date.now() - memoria.ultimoTs > 10 * 60 * 1000)) return null;
            const problema = /(nao funciona|nao esta funcionando|nao esta funcio|errou|deu errado|quebrou|travou|falhou|nao entendi|nada a ver|esta errado|nao gostei|errado|nao resolveu)/i.test(transcript);
            const questao = /^(e |ent[ãa]o |ai |a[íi] |da[íi] |dai |como |o que |qual |quais |por que |porque |quando |onde |quanto |e como |e qual |isso |daquilo |e ai)/i.test(transcript) && transcript.split(/\s+/).length <= 10;
            if (!problema && !questao) return null;
            if (problema) {
                return {
                    tipo: 'problema',
                    consulta: memoria.ultimoTopico + ' solucao problemas como resolver',
                    prefixo: `Sobre ${memoria.ultimoTopico}, somando com o problema relatado, a melhor saída que encontrei:`
                };
            }
            const limpa = transcript.replace(/^(e |ent[ãa]o |ai |a[íi] |da[íi] |dai |e como |e o que |e qual |como |o que |qual |quais |por que |porque |quando |onde |quanto |isso |daquilo )+/i, '').trim();
            return {
                tipo: 'questao',
                consulta: (limpa.length >= 3 ? memoria.ultimoTopico + ' ' + limpa : memoria.ultimoTopico),
                prefixo: `Combinando o que conversamos sobre ${memoria.ultimoTopico} com a pergunta:`
            };
        }

        // ==========================================
        // 🧠 ROTEADOR DE INTENTS (comum: voz + chat)
        // ==========================================
        const STOP_RE = /(t[áa] bom pode parar|pode parar|cala a boca|para de falar|pare de falar|sil[eê]ncio|chega de falar|para agora|pare agora|\bchega\b|\bbasta\b|ok,? t[áa] bom|t[áa] bom)/i;
        const CHAT_OPEN_RE = /ativar chat|abrir chat|abre o chat|mostra (o |a )?chat|chamar o chat|paine?l de chat|tela de chat/i;
        const CHAT_CLOSE_RE = /fechar chat|fecha o chat|fecha o painel|sair do chat|desativar chat|fecha a tela|fecha a janela/i;
        const COMANDOS_RE = /quais (s[ãa]o os )?comandos|lista de comandos|me mostra os comandos|^comandos$|o que voc[eê] (faz|sabe fazer|pode fazer|consegue fazer|consegue)|em que voc[eê] (consegue )?me ajud|o que eu posso falar|me ensina o que voc[eê] faz/i;

        const LISTA_COMANDOS = `Aqui está tudo que eu posso fazer. Tarefas: diga "anote comprar pão" e depois "quais são as tarefas". Internet: diga "pesquisa sobre tal coisa" ou "acha pra mim". OSINT: "localizar estação espacial" para abrir o mapa global. Clima: "qual o clima em sua cidade". Tempo: "timer de cinco minutos", "alarme das sete da manhã", e "cancelar timer". Chat: "abrir chat" para conversar por texto. Memória: "salve na memória que tal coisa", "repete" e "apague minha memória". Modo gênio: "ativar modo gênio" para respostas mais longas. Extras: "que horas são", contas como "cinco mais três", e "me chamo seu nome" para eu te chamar pelo nome. Isso é tudo o que eu sei fazer por enquanto.`;

        async function processarComando(transcript) {
            console.log("Comando detectado:", transcript);
            registrarComando(transcript);
            const intencaoLocal = window.SextaInterpreter ? SextaInterpreter.classify(transcript) : { intent: 'unknown', confidence: 0 };

            const etapas = transcript.split(/\s+(?:e depois|depois disso|em seguida)\s+/i).map((etapa) => etapa.trim()).filter(Boolean);
            if (etapas.length > 1) {
                for (const etapa of etapas) await processarComando(etapa);
                return;
            }

            // ---- Intents duros ----
            const cancelarTimerMatch = transcript.match(/cancelar (o )?(timer|alarme|cron[oó]metro)|pare (o )?(timer|alarme)|desligue (o )?(timer|alarme)/i);
            const statusTimerMatch = transcript.match(/quanto (tempo )?falta no? (timer|alarme)|tempo restante no? (timer|alarme)|situa[çc][ãa]o do timer/i);
            const alarmeInfo = extrairAlarme(transcript);
            const timerInfo = extrairTimer(transcript);

            // ---- INTENTS OSINT / GLOBO ----
            const osintISS = transcript.match(/(?:localizar|rastrear|monitorar|mostrar)\s+(?:a|o)?\s*(esta[çc][ãa]o espacial|iss|sat[ée]lite)/i);
            const osintClose = transcript.match(/(?:fechar|parar|cancelar|sair|voltar)\s+(?:o|a)?\s*(?:rastreio|monitoramento|mapa|globo|osint)/i);

            const chatOpenMatch = CHAT_OPEN_RE.test(transcript);
            const chatCloseMatch = CHAT_CLOSE_RE.test(transcript);
            const comandosMatch = COMANDOS_RE.test(transcript);

            const desativarGenioMatch = transcript.match(/desativar modo g[eê]nio|desligar modo g[eê]nio|desativa o modo g[eê]nio|desliga o g[eê]nio|sair do modo g[eê]nio|voltar ao normal/i);
            const ativarGenioMatch = transcript.match(/ativar modo g[eê]nio|liga[r]? modo g[eê]nio/i) || (transcript.includes('modo gênio') && !transcript.includes('desativar') && !transcript.includes('desligar') && !transcript.includes('sair'));

            const salvarFatoMatch = transcript.match(/(?:salve na mem[óo]ria|salvar na mem[óo]ria|guarde que|aprenda que|memorize que|memorize)\s+(.+)/i);
            const limparMemoriaMatch = transcript.match(/apague (minha|sua) mem[óo]ria|limpe a mem[óo]ria|esvazie a mem[óo]ria/i);
            const explicarMemoriaMatch = /(?:o que voc[eê] sabe sobre mim|mostre minhas mem[óo]rias|listar mem[óo]rias|quais fatos voc[eê] sabe)/i.test(transcript);
            const personalidadeMatch = transcript.match(/(?:mude|altere|ative|use) (?:sua )?personalidade para (objetiva|t[eé]cnica|acolhedora|investigadora)/i);
            const correcaoMatch = transcript.match(/(?:voc[eê] entendeu errado|n[aã]o foi isso|corrija isso)(?:,?\s*(?:era|para|o correto [ée]))?\s*(.+)?/i);
            const repetirMatch = transcript.match(/repete|diga de novo|o que (voce|voc[eê]) disse/i);

            const registroRegex = /(?:registrar|salvar|anotar|registre|anote|salve)(?:\s+(?:nova tarefa|tarefa|compromissos?|que|um compromisso|uma tarefa))?\s+(.+)/i;
            const registroMatch = transcript.match(registroRegex);

            const leituraTarefasRegex = /quais (?:s[ãa]o as )?tarefas|o que tenho para fazer|o que h[áa] para hoje|ler tarefas|meus compromissos/i;
            const leituraMatch = transcript.match(leituraTarefasRegex);
            const limparTarefasMatch = transcript.match(/(?:apague|limpe|remova|exclua|delete) (?:todas? )?(?:as )?(?:minhas )?(?:tarefas|compromissos)/i);
            const removerTarefaMatch = transcript.match(/(?:apague|remova|exclua|delete|conclua) (?:a |a tarefa |o compromisso )?(.+)/i);

            const nomeRegex = /(?:meu nome [ée]|me chamo)\s+([a-zàáâãéèêíïóôõöúçñ]+)/i;
            const nomeMatch = transcript.match(nomeRegex);

            let mathTranscript = transcript
                .replace(/\bzero\b/g, '0').replace(/\bum\b/g, '1').replace(/\bdois\b/g, '2').replace(/\btr[eê]s\b/g, '3')
                .replace(/\bquatro\b/g, '4').replace(/\bcinco\b/g, '5').replace(/\bseis\b/g, '6').replace(/\bsete\b/g, '7')
                .replace(/\boito\b/g, '8').replace(/\bnove\b/g, '9').replace(/\bdez\b/g, '10');

            const mathRegex = /(\d+(?:[.,]\d+)?)\s*(mais|somada? a?|\+|menos|-|vezes|\*|x|multiplicado(?: por)?|dividido(?: por| para| pra)?|\/)\s*(\d+(?:[.,]\d+)?)/i;
            const mathMatch = mathTranscript.match(mathRegex);

            const saudacaoMatch = /\b(ol[aá]|oi|opa|bom dia|boa tarde|boa noite|e a[ií]|eai)\b/i.test(transcript) || transcript.includes('sexta-feira') || transcript.includes('sexta feira') || transcript.includes('outro');

            // ROTEAMENTO
            if (cancelarTimerMatch) {
                responderComoSextaFeira(cancelarTimer() ? 'Timer cancelado.' : 'Não há nenhum timer ativo.');
            }
            else if (statusTimerMatch) {
                if (timerId) {
                    const restante = (timerEndsAt - Date.now()) / 1000;
                    const m = Math.floor(restante / 60);
                    const s = Math.ceil(restante % 60);
                    responderComoSextaFeira(`Faltam ${m} minutos e ${s} segundos. ${timerLabel}.`);
                } else {
                    responderComoSextaFeira('Não há nenhum timer ativo.');
                }
            }
            else if (alarmeInfo) {
                ativarTimer(alarmeInfo.timestamp, `o alarme das ${alarmeInfo.hhmm}`);
                responderComoSextaFeira(`Alarme definido: às ${alarmeInfo.hhmm}.`);
                hudFlash('⏰', 'DEFINIDO', `alarme às ${alarmeInfo.hhmm}`);
            }
            else if (timerInfo) {
                const rotulo = timerInfo.minutos >= 60
                    ? `${Math.round(timerInfo.minutos / 60)} ${timerInfo.minutos / 60 === 1 ? 'hora' : 'horas'}`
                    : `${timerInfo.minutos} minutos`;
                ativarTimer(Date.now() + timerInfo.totalSeg * 1000, `o timer de ${rotulo}`);
                responderComoSextaFeira(`Timer definido: ${rotulo}.`);
                hudFlash('⏳', 'DEFINIDO', `timer de ${rotulo}`);
            }
            else if (osintISS) {
                isGlobeMode = true;
                hudFlash('🛰️', 'OSINT: ISS', 'conectando...');
                responderComoSextaFeira('Iniciando varredura global. Conectando aos sensores públicos da Estação Espacial Internacional...', async () => {
                    try {
                        const res = await fetch('https://api.wheretheiss.at/v1/satellites/25544');
                        const data = await res.json();
                        const lat = data.latitude.toFixed(2);
                        const lon = data.longitude.toFixed(2);
                        const alt = data.altitude.toFixed(0);
                        const vel = data.velocity.toFixed(0);
                        responderComoSextaFeira(`Alvo localizado. A Estação Espacial está atualmente sobre as coordenadas: latitude ${lat} e longitude ${lon}. Altitude de ${alt} quilômetros, viajando a ${vel} quilômetros por hora.`);
                        hudFlash('🌐', 'ALVO LOCALIZADO', `LAT ${lat} / LON ${lon}`);
                    } catch(e) {
                        responderComoSextaFeira('Não foi possível estabelecer conexão com a rede de satélites no momento.');
                    }
                });
            }
            else if (osintClose) {
                if (isGlobeMode) {
                    isGlobeMode = false;
                    responderComoSextaFeira('Monitoramento global desativado. Voltando ao modo de repouso.');
                    hudEsconder();
                } else {
                    responderComoSextaFeira('O monitoramento já está desativado.');
                }
            }
            else if (chatOpenMatch) {
                abrirChat();
                responderComoSextaFeira('Chat aberto. Digite ou continue falando.');
            }
            else if (chatCloseMatch) {
                fecharChat();
                responderComoSextaFeira('Chat fechado.');
            }
            else if (comandosMatch) {
                responderComoSextaFeira(LISTA_COMANDOS);
            }
            else if (personalidadeMatch) {
                const personalidade = personalidadeMatch[1].toLowerCase().replace('é', 'e');
                localStorage.setItem('sexta_feira.personality', personalidade);
                responderComoSextaFeira(`Personalidade configurada para o modo ${personalidade}.`);
            }
            else if (correcaoMatch) {
                const textoCorrecao = correcaoMatch[1] || transcript;
                const corrigidoPara = /tarefa|agenda|compromisso|lembrete/i.test(textoCorrecao) ? 'criar_tarefa'
                    : /pesquis|internet|busca/i.test(textoCorrecao) ? 'pesquisar'
                    : /mem[óo]ria|guardar|lembrar/i.test(textoCorrecao) ? 'salvar_memoria' : 'unknown';
                if (corrigidoPara !== 'unknown' && window.SextaInterpreter) {
                    SextaInterpreter.learn(transcript, intencaoLocal.intent, corrigidoPara);
                    responderComoSextaFeira('Entendido. Registrei essa correção e vou considerar esse padrão nas próximas vezes.');
                } else {
                    responderComoSextaFeira('Entendi que minha resposta ficou errada. Diga, por exemplo: corrija para tarefa.');
                }
            }
            else if (explicarMemoriaMatch) {
                if (!fatos.length) {
                    responderComoSextaFeira('Ainda não tenho fatos pessoais salvos na memória local.');
                } else {
                    responderComoSextaFeira(`Tenho ${fatos.length} ${fatos.length === 1 ? 'memória' : 'memórias'} locais: ${fatos.map((fato) => fato.frase).join('. ')}.`);
                }
            }
            else if (intencaoLocal.intent === 'informar_data') {
                const data = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                responderComoSextaFeira(`Hoje é ${data}.`);
            }
            else if (intencaoLocal.intent === 'informar_horario') {
                const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                responderComoSextaFeira(`Agora são exatamente ${time}.`);
            }
            else if (desativarGenioMatch) {
                if (!isGenioActive) {
                    responderComoSextaFeira('O modo gênio já está desligado.');
                } else {
                    isGenioActive = false;
                    localStorage.setItem('sexta_feira.mode', 'normal');
                    responderComoSextaFeira('Modo gênio desativado.', () => {
                        corBaseAlvo.copy(corBaseNormal);
                        corAtivaAlvo.copy(corAtivaNormal);
                    });
                    hudFlash('⚡', 'MODO GÊNIO', 'desativado');

            }
            else if (ativarGenioMatch) {

                    });
                    hudFlash('⚡', 'MODO GÊNIO', 'ativado');
                }
            }
            else if (salvarFatoMatch) {
                const frase = salvarFatoMatch[1].trim().replace(/[.?!]+$/, '');
                fatos.push({ frase, data: new Date().toLocaleString('pt-BR') });
                fatos = fatos.slice(0, 30);
                localStorage.setItem('sexta_feira.fatos.v1', JSON.stringify(fatos));

                hudFlash('🧠', 'MEMORIZADO', frase.slice(0, 34) + (frase.length > 34 ? '…' : ''));

            else if (repetirMatch) {
                responderComoSextaFeira(memoria.ultimoResumo ? `Última informação: ${memoria.ultimoResumo}` : 'Não há nada anterior para repetir.');
            }
            else if (registroMatch) {
                let novaTarefa = registroMatch[1].trim();
                novaTarefa = novaTarefa.charAt(0).toUpperCase() + novaTarefa.slice(1);
                tarefas.push(novaTarefa);
                atualizarListaTarefas();
                sideMenu.classList.add('open');
                openTasksPanel();
                responderComoSextaFeira(`Anotado. Registrei: ${novaTarefa}.`);
            }
            else if (leituraMatch) {
                sideMenu.classList.add('open');
                openTasksPanel();
                if (tarefas.length === 0) {
                    responderComoSextaFeira('Você não tem nenhuma tarefa registrada para hoje.');
                } else {
                    let textoTarefas = tarefas.join(". ");
                    let plural = tarefas.length === 1 ? 'tarefa registrada' : 'tarefas registradas';
                    responderComoSextaFeira(`Você tem ${tarefas.length} ${plural}. São elas: ${textoTarefas}.`);
                }
            }
            else if (limparTarefasMatch) {
                const total = tarefas.length;
                tarefas = [];
                atualizarListaTarefas();
                responderComoSextaFeira(total ? `Apaguei ${total} ${total === 1 ? 'tarefa' : 'tarefas'}.` : 'Não havia tarefas para apagar.');
            }
            else if (removerTarefaMatch && tarefas.length) {
                const alvo = normalizar(removerTarefaMatch[1].replace(/[.!?]+$/, '').trim());
                const indice = tarefas.findIndex(tarefa => normalizar(tarefa).includes(alvo) || alvo.includes(normalizar(tarefa)));
                if (indice >= 0) {
                    const removida = tarefas.splice(indice, 1)[0];
                    atualizarListaTarefas();
                    responderComoSextaFeira(`Removi a tarefa: ${removida}.`);

            else if (nomeMatch) {

                responderComoSextaFeira(`Entendido. A partir de agora, o chamarei de ${nomeUsuario}.`);

            else if (transcript.includes('capacidade máxima') || transcript.includes('capacidade maxima')) {
                responderComoSextaFeira('Meus sistemas atuais: núcleo de processamento holográfico expansível com integração OSINT, chat de texto e voz, pesquisa pública web, gestão de alarmes e tarefas, memória local e interrupção fluida. Diga "comandos" para listar minhas capacidades.');
            }
            else if (/(?:que dia é hoje|qual a data|data de hoje|hoje é que dia)/i.test(transcript)) {
                const data = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                responderComoSextaFeira(`Hoje é ${data}.`);
            }
            else if (transcript.includes('horas') || transcript.includes('hora')) {
                const time = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                responderComoSextaFeira(`Agora são exatamente ${time}.`);
            }
            else if (mathMatch) {
                let num1 = parseFloat(mathMatch[1].replace(',', '.'));
                let num2 = parseFloat(mathMatch[3].replace(',', '.'));
                let operador = mathMatch[2].toLowerCase();
                let resultado;

                if (operador.includes('mais') || operador.includes('somad') || operador === '+') {
                    resultado = num1 + num2;
                } else if (operador.includes('menos') || operador === '-') {
                    resultado = num1 - num2;
                } else if (operador.includes('vezes') || operador.includes('multiplicado') || operador === '*' || operador === 'x') {
                    resultado = num1 * num2;
                } else if (operador.includes('dividido') || operador === '/') {
                    if (num2 === 0) {
                        responderComoSextaFeira('Não é possível dividir por zero.');
                        return;
                    }
                    resultado = num1 / num2;
                }

                if (resultado !== undefined) {
                    if (!Number.isInteger(resultado)) resultado = resultado.toFixed(2);
                    responderComoSextaFeira(`${num1} ${operador} ${num2} é igual a ${resultado}.`);

            }
            else if (saudacaoMatch) {
                const hoje = new Date().toDateString();
