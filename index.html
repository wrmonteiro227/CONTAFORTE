<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beat & Letra - Meu Estúdio</title>
    <style>
        /* Importando uma fonte estilosa do Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #121212;
            color: #f5f5f5;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1e1e1e;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8a2be2; /* Detalhe roxo neon */
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            font-size: 24px;
            color: #8a2be2;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 60%;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            outline: none;
            transition: border 0.3s;
        }

        input[type="text"]:focus {
            border: 1px solid #8a2be2;
        }

        button {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            background-color: #8a2be2;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: #9b45e4;
        }

        button:active {
            transform: scale(0.98);
        }

        .main-content {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            height: calc(100vh - 80px);
        }

        .player-container {
            flex: 1;
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .iframe-wrapper {
            flex: 1;
            width: 100%;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .lyrics-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .lyrics-container h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #bbb;
        }

        textarea {
            flex: 1;
            width: 100%;
            background-color: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #555;
        }

        /* Scrollbar customizada */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8a2be2;
        }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            .controls {
                width: 100%;
            }
            header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎙️ Beat & Letra</h1>
        <div class="controls">
            <input type="text" id="yt-link" placeholder="Cole o link do YouTube aqui (ex: https://youtube.com/watch?v=...)">
            <button onclick="carregarBeat()">Dar Play</button>
        </div>
    </header>

    <div class="main-content">
        <!-- Lado Esquerdo: Player de Vídeo -->
        <div class="player-container">
            <div class="iframe-wrapper" id="video-wrapper">
                <p>O beat vai tocar aqui...</p>
            </div>
        </div>

        <!-- Lado Direito: Bloco de Notas -->
        <div class="lyrics-container">
            <h2>Suas Letras (Salvas automaticamente)</h2>
            <textarea id="bloco-de-letras" placeholder="Comece a soltar as rimas aqui..."></textarea>
        </div>
    </div>

    <script>
        // Função para extrair o ID do vídeo do link do YouTube
        function extrairIdYoutube(url) {
            const regex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i;
            const match = url.match(regex);
            return (match && match[1]) ? match[1] : null;
        }

        // Função para carregar o vídeo no iframe
        function carregarBeat() {
            const inputLink = document.getElementById('yt-link').value;
            const videoId = extrairIdYoutube(inputLink);
            const wrapper = document.getElementById('video-wrapper');

            if (videoId) {
                // Cria o iframe do YouTube
                wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
            } else {
                alert("Mano, não consegui ler esse link. Tem certeza que é um link válido do YouTube?");
            }
        }

        // --- SISTEMA DE SALVAMENTO AUTOMÁTICO DAS LETRAS ---
        const textarea = document.getElementById('bloco-de-letras');

        // Quando a página carrega, recupera a letra salva (se houver)
        window.onload = function() {
            const letraSalva = localStorage.getItem('minhasRimas');
            if (letraSalva) {
                textarea.value = letraSalva;
            }
        };

        // Toda vez que você digitar, ele salva no navegador
        textarea.addEventListener('input', function() {
            localStorage.setItem('minhasRimas', textarea.value);
        });

    </script>
</body>
</html>
